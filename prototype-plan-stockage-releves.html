<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plan de stockage — Échalotes &amp; Oignons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E3DECF;
    --panel: #FBF9F3;
    --panel-2: #F1ECDE;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --line: #D2C9B4;
    --copper: #963E88;
    --copper-soft: #EAD7E6;
    --wave-1: #B23C92;
    --wave-2: #5B2A66;
    --green: #4E6647;
    --green-soft: #DCE4D2;
    --warn: #A13B2F;
    --warn-soft: #F1D6CC;
    --blue: #3E5C76;
    --blue-soft: #D9E2EA;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(43,38,32,0.06), 0 4px 14px rgba(43,38,32,0.06);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  .wrap{ max-width: 1320px; margin: 0 auto; padding: 18px 14px 60px; }

  header.app-header{ display:flex; align-items:center; justify-content:space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:36px; height:36px; flex-shrink:0; }
  .brand h1{ font-family:'Fraunces', serif; font-weight:600; font-size: 20px; margin:0; letter-spacing:-0.01em; }
  .brand p{ margin:2px 0 0; color: var(--ink-soft); font-size: 12px; }
  .header-stats{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .stat-pill{ background: var(--panel); border:1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .stat-pill b{ font-family:'IBM Plex Mono', monospace; color: var(--ink); font-size: 12.5px; font-weight:600; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--copper); }
  .dot.green{ background: var(--green); }
  .refresh-btn{ background: var(--panel); border:1px solid var(--line); border-radius: 999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--ink-soft); }
  .refresh-btn.spin svg{ animation: spin .6s linear; }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  nav.tabs{ display:flex; gap:4px; margin-bottom: 16px; background: var(--panel-2); padding: 5px; border-radius: 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ font-family:'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 9px 14px; border:none; background: transparent; color: var(--ink-soft); border-radius: 8px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  nav.tabs button:hover{ color: var(--ink); }
  nav.tabs button.active{ background: var(--panel); color: var(--copper); box-shadow: var(--shadow); }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2{ font-family:'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0 0 4px; }
  .card .sub{ color: var(--ink-soft); font-size: 12.5px; margin: 0 0 14px; }

  .cellule-tabs{ display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .cellule-tabs button{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; padding:8px 12px; border-radius:7px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .cellule-tabs button.active{ background: var(--copper); border-color: var(--copper); color:#fff; }
  .cellule-tabs button .n{ opacity:.75; font-weight:500; }

  .stockage-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  .ligne-list{ display:flex; flex-direction:column; gap:10px; }
  .ligne-list-item{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; background:#fff; transition: border-color .15s ease; }
  .ligne-list-item:hover{ border-color: var(--copper); }
  .ligne-list-item .lli-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .ligne-list-item h3{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; margin:0; }
  .ligne-list-item .lli-count{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .fill-track{ height:12px; border-radius:6px; background: var(--panel-2); overflow:hidden; display:flex; }
  .fill-seg{ height:100%; flex-shrink:0; }
  .lli-produits{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .produit-chip{ font-family:'Inter', sans-serif; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; border:none; cursor:pointer; }
  .produit-chip:hover{ filter: brightness(1.1); }
  .lli-empty{ font-size:12px; color:var(--ink-soft); margin-top:8px; font-style:italic; }

  .grid-form{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid-form.wide-3{ grid-template-columns: repeat(3,1fr); }
  .grid-form.two{ grid-template-columns: repeat(2,1fr); }
  @media (max-width: 760px){ .grid-form, .grid-form.wide-3, .grid-form.two{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px){ .grid-form, .grid-form.wide-3, .grid-form.two{ grid-template-columns: 1fr; } }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size: 11.5px; font-weight:600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  label.field input, label.field select{ font-family:'Inter', sans-serif; font-size: 16px; font-weight: 500; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 10px; text-transform: none; letter-spacing: normal; }
  label.field input:focus, label.field select:focus{ outline:none; border-color: var(--copper); }
  label.field.span-2{ grid-column: span 2; }
  label.field.span-full{ grid-column: 1/-1; }
  @media (max-width:480px){ label.field.span-2{ grid-column: span 1; } }
  label.field .hint{ font-size:11px; text-transform:none; letter-spacing:normal; font-weight:500; color:var(--ink-soft); margin-top:2px; }
  label.field.checkbox-field{ flex-direction:row; align-items:center; gap:8px; }
  label.field.checkbox-field input[type=checkbox]{ width:18px; height:18px; padding:0; flex:none; }

  .btn{ font-family:'Inter', sans-serif; font-weight: 700; font-size: 13.5px; cursor:pointer; border:none; border-radius: 8px; padding: 11px 18px; }
  .btn:active{ transform: scale(0.98); }
  .btn-copper{ background: var(--copper); color: #fff; }
  .btn-green{ background: var(--green); color: #fff; }
  .btn-warn{ background: var(--warn); color: #fff; }
  .btn-blue{ background: var(--blue); color: #fff; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
  .btn-sm{ padding:8px 13px; font-size:12.5px; border-radius:6px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ margin-top: 14px; display:flex; align-items:center; gap: 10px; flex-wrap:wrap; }
  .msg{ font-size: 13px; font-weight: 600; }
  .msg.ok{ color: var(--green); }
  .msg.err{ color: var(--warn); }

  .overlay-bg{ display:none; position:fixed; inset:0; background: rgba(43,38,32,0.4); z-index:40; }
  .overlay-bg.open{ display:block; }
  .detail-panel{ position:fixed; top:0; right:0; height:100vh; height:100dvh; width:min(560px, 100vw); background: var(--panel); box-shadow: -8px 0 30px rgba(0,0,0,0.15); z-index:41; transform: translateX(100%); transition: transform .2s ease; overflow-y:auto; }
  .detail-panel.open{ transform: translateX(0); }
  .detail-header{ padding:16px 16px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; }
  .detail-header h3{ font-family:'Fraunces', serif; font-size:17px; margin:0 0 3px; padding-right:30px; }
  .detail-header p{ margin:0; color:var(--ink-soft); font-size:12px; font-family:'IBM Plex Mono', monospace; }
  .detail-close{ position:absolute; top:12px; right:12px; background:var(--panel-2); border:none; font-size:20px; width:34px; height:34px; border-radius:50%; cursor:pointer; color:var(--ink-soft); }
  .detail-body{ padding: 14px 16px 30px; }
  .lot-card{ background:var(--panel-2); border-radius:8px; padding:13px; margin-bottom:10px; border-left: 5px solid var(--copper); transition: outline .15s ease; }
  .lot-card .lp-title{ font-weight:700; font-size:14px; margin-bottom:2px; }
  .badge-poids-sorti{ display:inline-block; font-family:'Inter', sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:3px 9px; border-radius:999px; background:var(--copper-soft); color:var(--copper); margin-left:8px; vertical-align:2px; }
  .lot-card .lp-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .lot-card .lp-meta span{ font-family:'IBM Plex Mono', monospace; }
  .palox-list{ display:flex; flex-direction:column; gap:4px; margin:8px 0; }
  .palox-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px; border-radius:6px; background:#fff; }
  .palox-item input{ width:auto; margin:0; }
  .palox-select-all{ font-weight:700; color:var(--ink-soft); background:transparent; margin-bottom:4px; }
  .batch-summary{ font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600; }
  .lot-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .inline-form{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:none; }
  .inline-form.open{ display:block; }
  .entree-row{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:#fff; }
  .palox-weights{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .palox-weights .pw-item{ display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px; min-width:88px; }
  .palox-weights .pw-item > span{ font-size:9.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:.03em; }
  .palox-weights .pw-item input[type=number]{ width:100%; font-family:'IBM Plex Mono'; font-size:12.5px; padding:6px 6px; border:1px solid var(--line); border-radius:6px; }
  .selection-recap{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; background:var(--panel); border-radius:6px; padding:8px 10px; }

  .divider-label{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; font-weight:600; color: var(--ink-soft); text-transform:uppercase; letter-spacing: 0.08em; margin: 14px 0 10px; display:flex; align-items:center; gap:10px; }
  .divider-label::after{ content:''; flex:1; height:1px; background: var(--line); }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin: 0 -16px; padding: 0 16px; }
  table.data{ width:100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.data th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color: var(--ink-soft); padding: 8px 9px; border-bottom: 2px solid var(--line); white-space:nowrap; }
  table.data td{ padding: 9px 9px; border-bottom: 1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  table.data tr:last-child td{ border-bottom:none; }
  .mono{ font-family:'IBM Plex Mono', monospace; font-size: 12px; }
  .tag{ display:inline-block; padding: 3px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 700; text-transform:uppercase; letter-spacing:.02em; }
  .tag.entree{ background: var(--green-soft); color: var(--green); }
  .tag.sortie{ background: var(--warn-soft); color: var(--warn); }
  .tag.deplacement{ background: var(--copper-soft); color: var(--copper); }
  .tag.modification{ background: var(--blue-soft); color: var(--blue); }

  .search-box{ position:relative; margin-bottom:14px; }
  .search-box input{ width:100%; font-family:'Inter'; font-size:16px; padding:12px 14px 12px 40px; border-radius:9px; border:1.5px solid var(--line); background:#fff; }
  .search-box input:focus{ outline:none; border-color:var(--copper); }
  .search-box svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); }

  .empty-state{ text-align:center; padding: 24px 8px; color: var(--ink-soft); }
  .empty-state svg{ width:38px; height:38px; margin-bottom:8px; opacity:.6; }

  .config-cellule{ border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .config-cellule .cfg-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
  .config-cellule .cfg-head input{ font-family:'Fraunces'; font-weight:600; font-size:14.5px; border:none; background:transparent; padding:2px 4px; border-radius:4px; min-width:0; flex:1; }
  .config-cellule .cfg-head input:focus{ outline:1.5px solid var(--copper); background:#fff; }
  .ligne-row{ display:flex; align-items:center; gap:8px; padding:8px 0; font-size:12.5px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .ligne-row:last-of-type{ border-bottom:none; }
  .ligne-row input[type=text]{ font-family:'Inter'; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:160px; }
  .ligne-row input[type=number]{ font-family:'IBM Plex Mono'; font-size:12.5px; padding:6px 6px; border:1px solid var(--line); border-radius:6px; width:70px; }
  .del-btn{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px; text-decoration:underline; flex-shrink:0; }
  .del-btn:hover{ color: var(--warn); }
  .loading{ text-align:center; padding:60px 0; color: var(--ink-soft); font-family:'Fraunces'; font-size:16px; }

  .login-screen{ display:none; min-height:100vh; align-items:center; justify-content:center; padding: 20px; }
  .login-card{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; width: 100%; max-width: 360px; }
  .login-card .brand{ justify-content:center; margin-bottom: 4px; }
  .login-card form{ display:flex; flex-direction:column; gap:12px; }
  .login-card .btn{ width:100%; margin-top:4px; }
  .brand-wave{ display:block; width:100%; height:14px; margin:2px 0 18px; }
  header.app-header .brand-wave{ margin:10px 0 4px; }
  .role-badge{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding: 5px 10px; border-radius:999px; }
  .role-badge.editor{ background: var(--green-soft); color: var(--green); }
  .role-badge.viewer{ background: var(--blue-soft); color: var(--blue); }
  .role-badge.admin{ background: #8B5FBF; color: #fff; }
  .readonly-note{ background: var(--panel-2); border:1px dashed var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--ink-soft); }
  .filter-bar{ background: var(--copper-soft); border-radius:8px; padding:8px 12px; font-size:12.5px; color: var(--ink); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .consult-total{ background: var(--panel-2); border-radius:8px; padding:10px 14px; margin-top:12px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .consult-total span:first-child{ color: var(--ink-soft); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.04em; }
  table.data tr.totals-row td{ font-weight:700; border-top:2px solid var(--line); border-bottom:none; }
  .view-switch{ display:flex; gap:6px; margin-bottom:14px; }
  .view-switch button{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:7px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; }
  .view-switch button.active{ background: var(--copper); border-color: var(--copper); color:#fff; }
  .produit-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:1px; }
/* ===== Intégration relevés de température (démo) ===== */
.demo-banner{background:#2B2620;color:#FBF9F3;font-size:13px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));text-align:center;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;box-sizing:border-box;max-width:100vw;overflow:hidden}
.demo-banner select{max-width:100%;min-width:0;min-height:36px}
@media (max-width:640px){.demo-banner{font-size:12px}.demo-banner select{flex:1 1 100%}.demo-banner .demo-note{display:none}

  .tb-home{justify-content:flex-start}.tb-home h1{font-size:24px}.tb-tile{min-height:0;padding:18px}.tb-tile b{font-size:19px}
  .adm-wrap{padding:12px 10px 40px}.adm-card{padding:14px 12px}.adm-row.sub{padding-left:8px}.adm-row input[type=text]{min-width:0;flex:1 1 100%}
  .adm-bar span{font-size:13px}}
.cellule-tabs button .tb-pill{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:600}
.tb-pill.ok{background:#DCE4D2;color:#2F4A2A}.tb-pill.ko{background:#F1D6CC;color:#7E2B22}.tb-pill.none{background:#F1ECDE;color:#5C554A}
.tb-box{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-radius:10px;padding:12px 14px;margin:6px 0 14px}
.tb-box.ok{border:1px solid #4E6647;background:#DCE4D2;color:#1F3320}.tb-box.ko{border:1px solid #A13B2F;background:#F1D6CC;color:#6E1F17}.tb-box.none{border:1px dashed #6B6355;background:#F1ECDE;color:#5C554A}
.tb-box .tb-l1{font-size:11px;font-weight:700;letter-spacing:.05em}.tb-box .tb-l2{font-size:22px;font-weight:600;font-family:'Inter',sans-serif}.tb-box .tb-l3{font-size:12px}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:42px}
.tb-btn.p{background:#1F5C63;color:#fff;border:none}.tb-btn.s{background:#fff;color:#1F5C63;border:1.5px solid #1F5C63}
.tb-dock{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tb-dock button{background:#fff;border:2px solid #1F5C63;color:#1F5C63;border-radius:12px;padding:10px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(43,38,32,.12)}
.tb-dock button.g{border-color:#1F7444;color:#1A5E38}
.tb-mod{position:fixed;inset:0;z-index:80;background:#EEF3F3;display:none;flex-direction:column}
.tb-mod.open{display:flex}
.tb-modbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#13323A;color:#fff;font:600 14px 'Inter',sans-serif;flex-wrap:wrap}
.tb-modbar button{background:#fff;color:#13323A;border:none;border-radius:9px;padding:10px 14px;font:600 14px 'Inter',sans-serif;cursor:pointer}
.tb-mod iframe{flex:1;border:0;width:100%;background:#EEF3F3}
.tb-modbar .bts{display:flex;gap:8px;flex-wrap:wrap}
.tb-modbar button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.tb-home>:first-child{margin-top:auto}.tb-home>:last-child{margin-bottom:auto}
.tb-home{position:fixed;inset:0;z-index:95;background:#E3DECF;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:28px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;font-family:'Inter',system-ui,sans-serif;color:#2B2620}
.tb-home h1{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;margin:0;text-align:center}
.tb-home p.who{margin:4px 0 0;color:#6B6355;font-size:14px;text-align:center}
.tb-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;width:100%;max-width:1100px}
@media (max-width:640px){.tb-tiles{grid-template-columns:1fr}}
.tb-tile{text-align:left;border-radius:18px;padding:26px 24px;min-height:200px;cursor:pointer;display:flex;flex-direction:column;gap:10px;font-family:inherit}
.tb-tile.plan{background:#FBF9F3;border:2px solid #963E88;color:#2B2620}
.tb-tile.rel{background:#EEF3F3;border:2px solid #1F5C63;color:#13323A}

.tb-tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}

table{border-collapse:collapse;width:100%;min-width:640px;font-size:.95rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.15rem;font-weight:600;white-space:nowrap}
tr.ko td{background:var(--ko-bg)}
.tag{font-weight:700;white-space:nowrap}
.tag.ok{color:var(--ok)} .tag.ko{color:var(--ko)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item .nm{display:grid;grid-template-columns:1fr 44px;gap:6px;margin-bottom:6px}
.item .lim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item .lim label{font-size:.8rem;color:var(--muted);display:block}
.item input{min-height:44px;padding:8px}
.item .x{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:1.2rem}
.etat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.etat button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.etat button[aria-pressed="true"]{border-color:var(--brand);background:var(--sel)}
.hr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hr input{width:100%;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:2.2rem;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--bg);min-height:64px;padding:6px}
.hr.ok input{border-color:var(--ok);background:var(--ok-bg)} .hr.ko input{border-color:var(--ko);background:var(--ko-bg)}
.hr span{font-size:1.3rem;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
table.month{min-width:0;font-size:.9rem}
table.month th,table.month td{padding:6px 6px;text-align:center;border:1px solid var(--line);white-space:nowrap}
table.month th:first-child,table.month td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.month td.c{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.05rem;font-weight:600}
table.month td.c small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:.75rem;color:var(--muted)}
table.month td.ko{background:var(--ko-bg);color:var(--ko)}
table.month td.st{color:var(--muted);font-family:"Barlow",sans-serif;font-size:.8rem}
table.month tr.we td{background:var(--bg)}
table.month td[data-rid]{cursor:pointer}
table.month td[data-rid]:hover{box-shadow:inset 0 0 0 2px var(--brand)}
tr.focus td{box-shadow:inset 0 2px 0 var(--brand),inset 0 -2px 0 var(--brand);background:var(--sel)!important}
.back{margin-bottom:8px}
table.month th small{display:block;font-weight:500;font-size:.75rem}
.row-edit{display:grid;grid-template-columns:1fr 84px 84px 44px;gap:6px;align-items:center;margin-bottom:6px}
.row-edit input{min-height:44px;padding:8px}
.row-edit .x{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:1.2rem}
.row-head{display:grid;grid-template-columns:1fr 84px 84px 44px;gap:6px;color:var(--muted);font-size:.85rem;margin-bottom:4px}
.empty{color:var(--muted);padding:12px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:480px){
  nav button{font-size:.9rem;padding:10px 2px}
  .filters{grid-template-columns:1fr}
  .row-edit,.row-head{grid-template-columns:1fr 64px 64px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Relevé de température chambres froides</h1>
    <span class="site">Réf. STOC E12.1 – La Légumière</span>
  </header>
  <div id="banner" class="banner hidden"></div>
  <nav role="tablist">
    <button role="tab" data-tab="frigo" aria-selected="true">Frigos</button>
    <button role="tab" data-tab="produit" aria-selected="false">Produits</button>
    <button role="tab" data-tab="hist" aria-selected="false">Historique</button>
    <button role="tab" data-tab="reglages" aria-selected="false">Réglages</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  let db = null, downloads = null, dbReady = false;
  let config = { frigos: [], produits: [] };
  let configLoaded = false;
  let currentMonthDocs = [];
  let histDocs = null, histUnsub = null;
  let tab = "frigo";
  let operateur = "";
  try { operateur = localStorage.getItem("ll-operateur") || ""; } catch(e){}
  const savedToday = new Set();

  const F = { lieu:null, etat:"service", temp:"", hr:"", action:"", comment:"" };
  const P = { cellule:null, produit:null, lot:"", lotKey:null, calibre:"", ligne:"", mesures:[""], action:"", comment:"", filtre:"" };
  const H = { mois: monthKey(new Date()), type:"all", ko:false, vue:"tableau", focus:null };
  let draft = null;

  const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function monthLabel(mk){ const [y,m]=mk.split("-"); return MOIS[+m-1]+" "+y; }
  function colName(mk){ return "releves-"+mk; }
  function num(v){ if(v===null||v===undefined) return NaN; const n=parseFloat(String(v).replace(",",".").trim()); return Number.isFinite(n)?n:NaN; }
  function fin(n){ return Number.isFinite(n); }
  function fmtT(n){ return fin(n)?n.toFixed(1).replace(".",","):"–"; }
  function fmtH(n){ return fin(n)?Math.round(n)+" %":"–"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
  function hm(iso){ return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
  function isToday(iso){ return new Date(iso).toDateString()===new Date().toDateString(); }
  function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
  function banner(msg){ const b=document.getElementById("banner"); if(msg){b.textContent=msg;b.classList.remove("hidden");} else b.classList.add("hidden"); }
  function saveOp(v){ operateur=v; try{localStorage.setItem("ll-operateur",v);}catch(e){} }
  function parseHr(v){ let n=num(v); if(fin(n)&&n>0&&n<=1.5) n=n*100; return n; }
  async function withRetry(fn){
    try { return await fn(); }
    catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); return await fn(); } throw e; }
  }
  function errMsg(e){
    if(!e) return "Erreur inconnue.";
    if(e.code==="forbidden") return "Code des réglages incorrect.";
    if(e.code==="invalid_data") return "Données refusées par le serveur. Vérifiez la saisie.";
    if(e.code==="invalid_argument") return "Enregistrement refusé : votre accès à cette page ne permet pas d'écrire.";
    if(e.code==="quota_exceeded") return "Espace de stockage plein. Exportez puis contactez l'administrateur.";
    if(e.code==="unavailable") return "Connexion indisponible. Vérifiez le réseau puis réessayez.";
    return "Enregistrement impossible ("+(e.code||"erreur")+").";
  }
  function inRange(t,min,max){ if(!fin(t)) return null; if(fin(min)&&t<min) return false; if(fin(max)&&t>max) return false; return true; }
  function rangeTxt(min,max,u){ u=u||"°C"; const f=u==="%"?(x=>Math.round(x)):fmtT; const a=fin(min),b=fin(max);
    if(a&&b) return "entre "+f(min)+" et "+f(max)+" "+u; if(b) return "≤ "+f(max)+" "+u; if(a) return "≥ "+f(min)+" "+u; return "aucune limite définie"; }
  function rangeShort(min,max,u){ u=u||"°C"; const f=u==="%"?(x=>Math.round(x)):fmtT; const a=fin(min),b=fin(max);
    if(a&&b) return f(min)+" à "+f(max)+" "+u; if(b) return "≤ "+f(max)+" "+u; if(a) return "≥ "+f(min)+" "+u; return ""; }
  function fnum(x){ return x==null||x==="" ? NaN : num(x); }

  function opField(){
    return '<div class="card"><label class="f" for="op">Opérateur</label><input id="op" type="text" autocomplete="name" placeholder="Votre nom" value="'+esc(operateur)+'"></div>';
  }
  function bindOp(){ const o=document.getElementById("op"); if(o) o.addEventListener("input",e=>saveOp(e.target.value)); }

  function tempBlock(id,min,max,value){
    return '<div class="readout">'+
      '<button class="step" type="button" data-step="-0.1" data-for="'+id+'" aria-label="Baisser de 0,1">−</button>'+
      '<div class="tinput" id="'+id+'-box"><input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" placeholder="0,0" value="'+esc(value)+'" aria-label="Température en degrés"></div>'+
      '<button class="step" type="button" data-step="0.1" data-for="'+id+'" aria-label="Monter de 0,1">+</button></div>'+
      '<div class="scale" id="'+id+'-scale"><div class="zone"></div><div class="mark"></div></div>'+
      '<div class="scale-l"><span id="'+id+'-lo"></span><span>Cible : '+rangeTxt(min,max)+'</span><span id="'+id+'-hi"></span></div>';
  }
  function paintTemp(id,min,max){
    const inp=document.getElementById(id); if(!inp) return null;
    const t=num(inp.value), box=document.getElementById(id+"-box"), ok=inRange(t,min,max);
    box.classList.toggle("ok",ok===true); box.classList.toggle("ko",ok===false);
    const lo=(fin(min)?min:(fin(max)?max-8:-5))-4, hi=(fin(max)?max:(fin(min)?min+8:15))+4;
    const pct=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
    const sc=document.getElementById(id+"-scale"), zone=sc.querySelector(".zone"), mark=sc.querySelector(".mark");
    const zl=fin(min)?pct(min):0, zr=fin(max)?pct(max):100;
    zone.style.left=zl+"%"; zone.style.width=(zr-zl)+"%";
    if(fin(t)){ mark.style.display="block"; mark.style.left=pct(t)+"%"; } else mark.style.display="none";
    document.getElementById(id+"-lo").textContent=fmtT(lo)+"°";
    document.getElementById(id+"-hi").textContent=fmtT(hi)+"°";
    return ok;
  }
  function bindSteps(){
    document.querySelectorAll(".step").forEach(b=>b.addEventListener("click",()=>{
      const inp=document.getElementById(b.dataset.for); let t=num(inp.value); if(!fin(t)) t=0;
      t=Math.round((t+parseFloat(b.dataset.step))*10)/10; inp.value=fmtT(t); inp.dispatchEvent(new Event("input"));
    }));
  }
  function noConfig(what){
    return '<div class="card"><h2>Aucun '+what+' paramétré</h2><p class="hint">Un admin doit compléter la liste depuis l\'accueil, rubrique Administration.</p></div>';
  }
  function bindGoReg(){ const g=document.getElementById("goReg"); if(g) g.addEventListener("click",()=>setTab("reglages")); }
  function lastFrigo(lieu){ let l=null; for(const d of currentMonthDocs){ if(d.type==="frigo"&&d.lieu===lieu&&(!l||d.at>l.at)) l=d; } return l; }
  function doneToday(nom){ if(savedToday.has(nom)) return true; const l=lastFrigo(nom); return !!(l&&isToday(l.at)); }

  // ---------- Frigos ----------
  function renderFrigo(){
    const v=document.getElementById("view");
    if(!configLoaded){ v.innerHTML='<p class="empty">Chargement…</p>'; return; }
    if(!config.frigos.length){ v.innerHTML=opField()+noConfig("frigo"); bindOp(); bindGoReg(); return; }
    const fr=config.frigos.find(f=>f.nom===F.lieu);
    const nbDone=config.frigos.filter(f=>doneToday(f.nom)).length;
    let h=opField();
    h+='<div class="card"><h2>Chambre froide contrôlée</h2><p class="hint">'+nbDone+' sur '+config.frigos.length+' relevées aujourd\'hui.</p><div class="grid">';
    for(const f of config.frigos){
      const l=lastFrigo(f.nom);
      let sub;
      if(l&&isToday(l.at)) sub='<span class="done">Fait à '+hm(l.at)+(l.etat==="arret"?" (arrêt)":l.temp!=null?" : "+fmtT(l.temp)+" °C":"")+'</span>';
      else if(savedToday.has(f.nom)) sub='<span class="done">Fait</span>';
      else sub='<span>À relever – cible '+esc(rangeShort(fnum(f.min),fnum(f.max)))+'</span>';
      h+='<button type="button" class="pick" data-lieu="'+esc(f.nom)+'" aria-pressed="'+(F.lieu===f.nom)+'"><b>'+esc(f.nom)+'</b>'+sub+'</button>';
    }
    h+='</div></div>';
    if(fr){
      const hrMin=fnum(fr.hrMin), hrMax=fnum(fr.hrMax);
      h+='<div class="card"><h2>État de la chambre</h2><div class="etat">'+
        ['service','vide','arret'].map(e=>'<button type="button" data-etat="'+e+'" aria-pressed="'+(F.etat===e)+'">'+({service:"En service",vide:"Vide",arret:"À l'arrêt"})[e]+'</button>').join("")+'</div></div>';
      h+='<div id="mesures-f"><div class="card"><h2>Température</h2>'+tempBlock("tf",fnum(fr.min),fnum(fr.max),F.temp)+'<div class="status" id="tf-st"></div></div>';
      h+='<div class="card"><label class="f" for="hrf">Hygrométrie (facultatif)</label><p class="hint">'+(fin(hrMin)||fin(hrMax)?'Cible : '+rangeTxt(hrMin,hrMax,"%")+'.':'Humidité relative affichée par l\'hygromètre.')+'</p>'+
        '<div class="hr" id="hrf-box"><input id="hrf" type="text" inputmode="decimal" autocomplete="off" placeholder="–" value="'+esc(F.hr)+'" aria-label="Hygrométrie en pourcentage"><span>%</span></div><div class="status" id="hr-st"></div></div></div>';
      h+='<div class="card hidden" id="f-act"><label class="f" for="fa">Action corrective</label><p class="hint">Obligatoire en cas d\'écart : ce qui a été fait et qui a été prévenu.</p><textarea id="fa">'+esc(F.action)+'</textarea></div>';
      h+='<div class="card"><label class="f" for="fc">Remarques (facultatif)</label><textarea id="fc">'+esc(F.comment)+'</textarea></div>';
      h+='<button class="primary" type="button" id="fsave">Enregistrer le relevé</button><p class="err hidden" id="ferr"></p>';
    }
    v.innerHTML=h; bindOp();
    v.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>{ if(F.lieu!==b.dataset.lieu){F.temp="";F.hr="";F.action="";F.comment="";F.etat="service";} F.lieu=b.dataset.lieu; renderFrigo(); document.querySelector(".etat")&&document.querySelector(".etat").scrollIntoView({block:"start",behavior:"smooth"}); }));
    if(!fr) return;
    const min=fnum(fr.min), max=fnum(fr.max), hrMin=fnum(fr.hrMin), hrMax=fnum(fr.hrMax);
    const update=()=>{
      const arret=F.etat==="arret";
      document.getElementById("mesures-f").classList.toggle("hidden",arret);
      const ok=paintTemp("tf",min,max), st=document.getElementById("tf-st");
      st.className="status"+(ok===true?" ok":ok===false?" ko":""); st.textContent=ok===true?"Température conforme":ok===false?"Température hors cible":"";
      const hv=parseHr(F.hr), hok=inRange(hv,hrMin,hrMax), hb=document.getElementById("hrf-box"), hs=document.getElementById("hr-st");
      const hasHrLim=fin(hrMin)||fin(hrMax);
      hb.classList.toggle("ok",hasHrLim&&hok===true); hb.classList.toggle("ko",hasHrLim&&hok===false);
      hs.className="status"+(hasHrLim&&hok===false?" ko":""); hs.textContent=hasHrLim&&hok===false?"Hygrométrie hors cible":"";
      const ecart=!arret&&(ok===false||(hasHrLim&&hok===false));
      document.getElementById("f-act").classList.toggle("hidden",!ecart);
    };
    document.getElementById("tf").addEventListener("input",e=>{F.temp=e.target.value; update();});
    document.getElementById("hrf").addEventListener("input",e=>{F.hr=e.target.value; update();});
    bindSteps();
    v.querySelectorAll("[data-etat]").forEach(b=>b.addEventListener("click",()=>{ F.etat=b.dataset.etat; v.querySelectorAll("[data-etat]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); update(); }));
    document.getElementById("fa").addEventListener("input",e=>F.action=e.target.value);
    document.getElementById("fc").addEventListener("input",e=>F.comment=e.target.value);
    document.getElementById("fsave").addEventListener("click",()=>saveFrigo(fr));
    update();
  }

  async function saveFrigo(fr){
    const err=document.getElementById("ferr"), btn=document.getElementById("fsave");
    const show=m=>{err.textContent=m;err.classList.remove("hidden");};
    err.classList.add("hidden");
    const min=fnum(fr.min), max=fnum(fr.max), hrMin=fnum(fr.hrMin), hrMax=fnum(fr.hrMax);
    const arret=F.etat==="arret";
    const t=num(F.temp), hrTxt=String(F.hr).trim(), hv=parseHr(F.hr);
    if(!operateur.trim()) return show("Indiquez le nom de l'opérateur.");
    if(!arret&&!fin(t)) return show("Saisissez la température relevée.");
    if(!arret&&hrTxt&&(!fin(hv)||hv<0||hv>100)) return show("L'hygrométrie doit être un pourcentage entre 0 et 100.");
    const tOk=arret?null:inRange(t,min,max);
    const hOk=arret||!hrTxt?null:inRange(hv,hrMin,hrMax);
    const conforme=arret||(tOk!==false&&hOk!==false);
    if(!conforme&&!F.action.trim()) return show("Décrivez l'action corrective.");
    if(!db) return show("Enregistrement indisponible dans cette vue.");
    const now=new Date();
    const doc={ type:"frigo", lieu:fr.nom, etat:F.etat, produit:"", lot:"",
      temp:arret?null:t, temps:arret?[]:[t], hr:(!arret&&hrTxt)?Math.round(hv*10)/10:null,
      min:fin(min)?min:null, max:fin(max)?max:null, hrMin:fin(hrMin)?hrMin:null, hrMax:fin(hrMax)?hrMax:null,
      tempConforme:tOk!==false, hrConforme:hOk!==false, conforme,
      action:F.action.trim(), commentaire:F.comment.trim(), operateur:operateur.trim(), at:now.toISOString() };
    btn.disabled=true;
    try{
      await withRetry(()=>db.collection(colName(monthKey(now))).doc().set(doc));
      savedToday.add(fr.nom);
      const idx=config.frigos.findIndex(f=>f.nom===fr.nom);
      const order=config.frigos.slice(idx+1).concat(config.frigos.slice(0,idx));
      const next=order.find(f=>!doneToday(f.nom));
      F.temp=""; F.hr=""; F.action=""; F.comment=""; F.etat="service"; F.lieu=next?next.nom:null;
      toast((conforme?"Relevé enregistré":"Relevé enregistré avec écart")+(next?" – suivant : "+next.nom:" – tournée terminée"));
      renderFrigo();
      const tgt=next?document.querySelector(".etat"):null; if(tgt) tgt.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
    }catch(e){ show(errMsg(e)); btn.disabled=false; }
  }

  // ---------- Produits ----------
  function renderProduit(){
    const v=document.getElementById("view");
    if(!configLoaded){ v.innerHTML='<p class="empty">Chargement…</p>'; return; }
    if(!config.frigos.length){ v.innerHTML=opField()+noConfig("frigo ou cellule"); bindOp(); bindGoReg(); return; }
    if(!config.produits.length){ v.innerHTML=opField()+noConfig("produit"); bindOp(); bindGoReg(); return; }
    const pr=config.produits.find(p=>p.nom===P.produit)||(P.produit?{nom:P.produit,min:null,max:null}:null);
    const frP=config.frigos.find(f=>f.nom===P.cellule);
    const lotsPlan=(frP&&frP.cellulePlan)?FS.lotsDe(frP.cellulePlan):null;
    let h=opField();
    h+='<div class="card"><h2>Cellule</h2><div class="grid">';
    for(const f of config.frigos) h+='<button type="button" class="pick" data-cel="'+esc(f.nom)+'" aria-pressed="'+(P.cellule===f.nom)+'"><b>'+esc(f.nom)+'</b></button>';
    h+='</div></div>';
    if(P.cellule&&lotsPlan){
      h+='<div class="card" style="border:2px solid #963E88"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Lots présents dans '+esc(frP.cellulePlan)+'</h2><span style="font-size:13px;font-weight:700;padding:5px 9px;border-radius:7px;background:#EAD7E6;color:#5B2A66">Plan de stockage – lecture seule</span></div>'+
        '<p class="hint" style="margin-top:6px">Touchez le lot contrôlé : produit, lot et calibre sont remplis. Rien n\'est modifié dans le stock.</p>'+
        (lotsPlan.length?'<div class="grid">'+lotsPlan.map(l=>'<button type="button" class="pick" data-lotkey="'+esc(l.key)+'" aria-pressed="'+(P.lotKey===l.key)+'"><b>'+esc(l.produit)+(l.calibre?' – '+esc(l.calibre):'')+'</b><span>Lot '+esc(l.lot||"—")+' – '+esc(l.ligne)+' – '+l.n+' palox</span></button>').join("")+'</div>':'<p class="empty">Aucun lot dans cette cellule.</p>')+'</div>';
    }
    if(P.cellule){
      h+='<div class="card"><h2>Produit contrôlé</h2>';
      if(config.produits.length>8) h+='<input type="text" id="pfil" placeholder="Rechercher un produit" value="'+esc(P.filtre)+'" style="margin-bottom:10px">';
      h+='<div class="grid" id="pgrid"></div></div>';
    }
    if(P.cellule&&pr){
      h+='<div class="card"><label class="f" for="plot">N° de lot ou commande (facultatif)</label><input id="plot" type="text" value="'+esc(P.lot)+'"></div>';
      h+='<div class="card"><h2>Températures à cœur</h2><p class="hint">Cible pour ce produit : '+rangeTxt(fnum(pr.min),fnum(pr.max))+'.</p><div id="mes"></div><button type="button" class="link" id="addm">Ajouter une mesure</button><div class="status" id="p-st"></div></div>';
      h+='<div class="card hidden" id="p-act"><label class="f" for="pa">Action corrective</label><p class="hint">Obligatoire en cas d\'écart : produit isolé, bloqué, refroidi, responsable prévenu…</p><textarea id="pa">'+esc(P.action)+'</textarea></div>';
      h+='<div class="card"><label class="f" for="pc">Remarques (facultatif)</label><textarea id="pc">'+esc(P.comment)+'</textarea></div>';
      h+='<button class="primary" type="button" id="psave">Enregistrer le contrôle</button><p class="err hidden" id="perr"></p>';
    }
    v.innerHTML=h; bindOp();
    v.querySelectorAll("[data-cel]").forEach(b=>b.addEventListener("click",()=>{ P.cellule=b.dataset.cel; P.lotKey=null; renderProduit(); }));
    v.querySelectorAll("[data-lotkey]").forEach(b=>b.addEventListener("click",()=>{ const l=lotsPlan.find(x=>x.key===b.dataset.lotkey); if(!l) return; P.lotKey=l.key; P.produit=l.produit; P.lot=l.lot||""; P.calibre=l.calibre||""; P.ligne=l.ligne||""; renderProduit(); }));
    if(!P.cellule) return;
    const drawGrid=()=>{
      const q=P.filtre.trim().toLowerCase(), list=config.produits.filter(p=>!q||p.nom.toLowerCase().includes(q)), g=document.getElementById("pgrid");
      g.innerHTML=list.length?list.map(p=>'<button type="button" class="pick" data-prod="'+esc(p.nom)+'" aria-pressed="'+(P.produit===p.nom)+'"><b>'+esc(p.nom)+'</b><span>'+esc(rangeShort(fnum(p.min),fnum(p.max))||"Sans limite")+'</span></button>').join(""):'<p class="empty">Aucun produit ne correspond.</p>';
      g.querySelectorAll("[data-prod]").forEach(b=>b.addEventListener("click",()=>{ P.produit=b.dataset.prod; P.lotKey=null; P.calibre=""; P.ligne=""; renderProduit(); }));
    };
    drawGrid();
    const fil=document.getElementById("pfil"); if(fil) fil.addEventListener("input",e=>{P.filtre=e.target.value; drawGrid();});
    if(!pr) return;
    const min=fnum(pr.min), max=fnum(pr.max);
    const update=()=>{
      let anyKo=false, anyVal=false;
      P.mesures.forEach((m,i)=>{ const ok=paintTemp("pm"+i,min,max); if(ok===false) anyKo=true; if(ok!==null) anyVal=true; });
      const st=document.getElementById("p-st");
      st.className="status"+(anyKo?" ko":anyVal?" ok":""); st.textContent=anyKo?"Au moins une mesure hors cible":anyVal?"Mesures conformes":"";
      document.getElementById("p-act").classList.toggle("hidden",!anyKo);
    };
    const drawMes=()=>{
      const box=document.getElementById("mes");
      box.innerHTML=P.mesures.map((m,i)=>'<div class="mesure"><div class="mh"><b>Mesure '+(i+1)+'</b>'+(P.mesures.length>1?'<button type="button" class="link" data-rm="'+i+'">Retirer</button>':'')+'</div>'+tempBlock("pm"+i,min,max,m)+'</div>').join("");
      P.mesures.forEach((m,i)=>document.getElementById("pm"+i).addEventListener("input",e=>{P.mesures[i]=e.target.value; update();}));
      box.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{P.mesures.splice(+b.dataset.rm,1); drawMes();}));
      bindSteps(); document.getElementById("addm").classList.toggle("hidden",P.mesures.length>=5); update();
    };
    drawMes();
    document.getElementById("addm").addEventListener("click",()=>{P.mesures.push(""); drawMes();});
    document.getElementById("plot").addEventListener("input",e=>P.lot=e.target.value);
    document.getElementById("pa").addEventListener("input",e=>P.action=e.target.value);
    document.getElementById("pc").addEventListener("input",e=>P.comment=e.target.value);
    document.getElementById("psave").addEventListener("click",()=>saveProduit(pr));
  }
  async function saveProduit(pr){
    const err=document.getElementById("perr"), btn=document.getElementById("psave");
    const show=m=>{err.textContent=m;err.classList.remove("hidden");};
    err.classList.add("hidden");
    const min=fnum(pr.min), max=fnum(pr.max), temps=P.mesures.map(num).filter(fin);
    if(!operateur.trim()) return show("Indiquez le nom de l'opérateur.");
    if(!temps.length||temps.length!==P.mesures.length) return show("Saisissez chaque température à cœur, ou retirez les mesures vides.");
    const conforme=temps.every(t=>inRange(t,min,max)!==false);
    if(!conforme&&!P.action.trim()) return show("Décrivez l'action corrective.");
    if(!db) return show("Enregistrement indisponible dans cette vue.");
    const now=new Date();
    const frS=config.frigos.find(f=>f.nom===P.cellule);
    const doc={ type:"produit", lieu:P.cellule, cellulePlan:(frS&&frS.cellulePlan)||"", calibre:P.calibre||"", ligne:P.ligne||"", produit:pr.nom, lot:P.lot.trim(), temps, temp:Math.max(...temps), hr:null,
      min:fin(min)?min:null, max:fin(max)?max:null, conforme, action:P.action.trim(), commentaire:P.comment.trim(), operateur:operateur.trim(), at:now.toISOString() };
    btn.disabled=true;
    try{
      await withRetry(()=>db.collection(colName(monthKey(now))).doc().set(doc));
      P.produit=null; P.lot=""; P.lotKey=null; P.calibre=""; P.ligne=""; P.mesures=[""]; P.action=""; P.comment="";
      toast(conforme?"Contrôle enregistré":"Contrôle enregistré avec écart"); renderProduit(); window.scrollTo(0,0);
    }catch(e){ show(errMsg(e)); btn.disabled=false; }
  }

  // ---------- Historique ----------
  function histSource(){ return H.mois===monthKey(new Date())?currentMonthDocs:(histDocs||[]); }
  function loadHistMonth(){
    if(histUnsub){ histUnsub(); histUnsub=null; }
    histDocs=null;
    if(!db||H.mois===monthKey(new Date())) return;
    histUnsub=db.collection(colName(H.mois)).orderBy("at","desc").limit(1000).onSnapshot(s=>{ histDocs=s.docs.map(d=>Object.assign({_id:d.id},d.data())); if(tab==="hist") drawHist(); },()=>{ histDocs=[]; if(tab==="hist") drawHist(); });
  }
  function filteredHist(){ return histSource().filter(d=>(H.type==="all"||d.type===H.type)&&(!H.ko||!d.conforme)).slice().sort((a,b)=>a.at<b.at?1:-1); }
  function chambresDuMois(docs){
    const names=config.frigos.map(f=>f.nom);
    for(const d of docs) if(d.type==="frigo"&&!names.includes(d.lieu)) names.push(d.lieu);
    return names;
  }
  function grilleMois(docs){
    // dernier relevé frigo par jour et par chambre
    const g={};
    for(const d of docs){ if(d.type!=="frigo") continue; const day=new Date(d.at).getDate(); const k=day+"|"+d.lieu; if(!g[k]||d.at>g[k].at) g[k]=d; }
    return g;
  }
  function etatLabel(d){ return d.etat==="arret"?"Arrêt":d.etat==="vide"?"Vide":""; }
  function renderHist(){
    const v=document.getElementById("view");
    v.innerHTML='<div class="card"><div class="seg"><button type="button" data-vue="tableau" aria-pressed="'+(H.vue==="tableau")+'">Tableau du mois (frigos)</button><button type="button" data-vue="liste" aria-pressed="'+(H.vue==="liste")+'">Liste détaillée</button></div>'+

        '<td class="t">'+(d.etat==="arret"?"–":(d.temps||[d.temp]).map(fmtT).join(" / "))+'</td><td>'+(d.hr!=null?fmtH(d.hr):"")+'</td>'+
        '<td><span class="tag '+(d.conforme?"ok":"ko")+'">'+(d.etat==="arret"?"Arrêt":d.conforme?"Conforme":"Écart")+'</span>'+(d.etat==="vide"?'<br><span class="hint">Chambre vide</span>':'')+'</td>'+
        '<td>'+esc(d.operateur)+'</td><td>'+esc(d.action)+(d.commentaire?'<br><span class="hint">'+esc(d.commentaire)+'</span>':'')+'</td></tr>').join("")+'</tbody></table>';

        b.addEventListener("click",()=>{ H.focus=null; H.vue="tableau"; renderHist(); });

  function drawMonthTable(el,docs){
    const chs=chambresDuMois(docs);
    if(!chs.length){ el.innerHTML='<p class="empty">Aucune chambre paramétrée.</p>'; return; }
    const [y,m]=H.mois.split("-").map(Number), nd=new Date(y,m,0).getDate(), g=grilleMois(docs);
    const cfg=n=>config.frigos.find(f=>f.nom===n)||{};
    let h='<table class="month"><thead><tr><th>Date</th>'+chs.map(n=>{const c=cfg(n); return '<th>'+esc(n)+'<small>'+esc(rangeShort(fnum(c.min),fnum(c.max)))+'</small></th>';}).join("")+'</tr></thead><tbody>';
    for(let d=1; d<=nd; d++){
      const dt=new Date(y,m-1,d), we=dt.getDay()===0||dt.getDay()===6;
      h+='<tr class="'+(we?"we":"")+'"><td>'+dt.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit"})+'</td>';
      for(const n of chs){
        const r=g[d+"|"+n];
        if(!r){ h+='<td></td>'; continue; }
        const ra=' data-rid="'+esc(r._id)+'" tabindex="0" role="button" aria-label="'+esc(n)+', '+dt.toLocaleDateString("fr-FR")+' : voir le détail"';
        if(r.etat==="arret"){ h+='<td class="st"'+ra+' title="'+esc(r.operateur)+'">Arrêt</td>'; continue; }
        const tip=hm(r.at)+" – "+r.operateur+(r.commentaire?" – "+r.commentaire:"")+(r.action?" – Action : "+r.action:"");
        h+='<td class="c'+(r.conforme?"":" ko")+'"'+ra+' title=""'+esc(tip)+'">'+fmtT(r.temp)+(r.hr!=null?'<small>'+fmtH(r.hr)+'</small>':'')+(r.etat==="vide"?'<small>Vide</small>':'')+'</td>';
      }
      h+='</tr>';
    }
    el.innerHTML=h+'</tbody></table><p class="hint" style="margin-top:8px">Touchez une case pour ouvrir le relevé dans la liste détaillée.</p>';
    el.querySelectorAll("td[data-rid]").forEach(td=>{
      const go=()=>{ H.focus=td.dataset.rid; H.vue="liste"; H.type="all"; H.ko=false; renderHist(); };
      td.addEventListener("click",go);
      td.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    });
  }

  async function saveReglages(){
    const err=document.getElementById("rerr"), btn=document.getElementById("rsave");
    const show=m=>{err.textContent=m;err.classList.remove("hidden");};
    err.classList.add("hidden");
    const fields={frigos:["min","max","hrMin","hrMax"],produits:["min","max"]};
    for(const k in fields) for(const x of draft[k]) for(const f of fields[k]){ const s=String(x[f]==null?"":x[f]).trim(); if(s&&!fin(num(s))) return show("« "+(x.nom||"Sans nom")+" » : une limite saisie n'est pas un nombre (ex. 4 ou -0,5)."); }
    const out={};
    for(const k in fields){
      out[k]=draft[k].map(x=>{ const o={nom:String(x.nom||"").trim()}; for(const f of fields[k]){ const s=String(x[f]==null?"":x[f]).trim(); o[f]=s?num(s):null; } if(k==="frigos") o.cellulePlan=String(x.cellulePlan||""); return o; }).filter(x=>x.nom);
      const names=out[k].map(x=>x.nom.toLowerCase()); if(new Set(names).size!==names.length) return show("Deux éléments portent le même nom dans la liste "+(k==="frigos"?"des chambres":"des produits")+".");
      for(const x of out[k]){ if(x.min!=null&&x.max!=null&&x.min>x.max) return show("Pour « "+x.nom+" », la T° mini est supérieure à la maxi."); if(x.hrMin!=null&&x.hrMax!=null&&x.hrMin>x.hrMax) return show("Pour « "+x.nom+" », l'hygro mini est supérieure à la maxi."); }
    }
    if(!db) return show("Enregistrement indisponible dans cette vue.");
    btn.disabled=true;
    try{ await withRetry(()=>db.doc("config/parametres").set(out)); config=out; draft=null; toast("Réglages enregistrés"); renderReglages(); }
    catch(e){ show(errMsg(e)); btn.disabled=false; }
  }


  // ---------- données : même projet Firebase que le plan de stockage ----------
  // Démo : le parent (plan de stockage) simule Firestore. Collections utilisées par ce module :
  //   temperatures/config (réglages) et releves (un document par relevé, création seule). Jamais planStockage/main.
  const FS = (function(){ try{ if(window.parent!==window && window.parent.__demoFirestore) return window.parent.__demoFirestore; }catch(e){} 
    const subs=new Set(); return { releves:[], temperatures:{config:null,derniers:{}}, subs, notify(){ subs.forEach(f=>f()); }, log(){}, lotsDe(){ return null; }, cellulesPlan(){ return []; } }; })();
  const clone=o=>JSON.parse(JSON.stringify(o));
  function sub(fn){ FS.subs.add(fn); fn(); return ()=>FS.subs.delete(fn); }
  const hhmm=iso=>{ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
  const fbDb = {
    doc(){ return {
      set: async (data)=>{ FS.temperatures.config=clone(data); FS.log("Réglages enregistrés dans temperatures/config","rel"); FS.notify(); },
      onSnapshot: (next)=>{ let last=null; return sub(()=>{ const j=JSON.stringify(FS.temperatures.config); if(j!==last){ last=j; next({ exists:!!FS.temperatures.config, data:()=>JSON.parse(j) }); } }); }

  function archiver(type){

      var ds = data.map(function(r){ return r.at; }).sort(); du = ds[0]; au = ds[ds.length - 1]; cons = c.relConservationAns;
    } else {
      var p = FS.planData(), lim = ajoutMois(now, -c.planArchiveApresMois).toISOString().slice(0, 10);
      data = (p.transactions || []).filter(function(t){ return String(t.date || '') < lim; }); if (!data.length) return;
      p.transactions = (p.transactions || []).filter(function(t){ return !(String(t.date || '') < lim); });
      FS.planSave(p);
      var dt = data.map(function(t){ return String(t.date); }).sort(); du = dt[0]; au = dt[dt.length - 1]; cons = c.planConservationAns;
    }
    FS.archives.push({ id: 'a' + Date.now(), type: type, du: du, au: au, nb: data.length, creeLe: now.toISOString(), par: moi().email, expireLe: cons ? ajoutAns(au, cons).toISOString() : null, data: JSON.parse(JSON.stringify(data)) });

    // plan
    var P = A.plan;
    on('[data-cnom]', 'input', function(e){ P.cellules[+e.dataset.cnom].nom = e.value; });
    on('[data-cna]', 'change', function(e){ P.cellules[+e.dataset.cna].nonAchetee = e.checked; });
    on('[data-lnom]', 'input', function(e){ var k = e.dataset.lnom.split('|'); P.cellules[+k[0]].lignes[+k[1]].nom = e.value; });
    on('[data-lcap]', 'input', function(e){ var k = e.dataset.lcap.split('|'); P.cellules[+k[0]].lignes[+k[1]].capacite = parseInt(e.value, 10) || 0; });
    on('[data-cdel]', 'click', function(e){ var c = P.cellules[+e.dataset.cdel]; if (stockDe(c.id)){ A.err = 'La cellule « ' + c.nom + ' » contient encore du stock : suppression impossible.'; A.msg = ''; return draw(); } P.cellules.splice(+e.dataset.cdel, 1); A.err = ''; draw(); });
    on('[data-ldel]', 'click', function(e){ var k = e.dataset.ldel.split('|'), c = P.cellules[+k[0]], l = c.lignes[+k[1]]; if (stockDe(c.id, l.id)){ A.err = 'La ligne « ' + l.nom + ' » contient encore du stock : suppression impossible.'; A.msg = ''; return draw(); } c.lignes.splice(+k[1], 1); A.err = ''; draw(); });
    on('[data-ladd]', 'click', function(e){ P.cellules[+e.dataset.ladd].lignes.push({ id: rid(), nom: 'Nouvelle ligne', capacite: 50 }); draw(); });
    on('#admCadd', 'click', function(){ P.cellules.push({ id: rid(), nom: 'Nouvelle cellule', nonAchetee: false, lignes: [{ id: rid(), nom: 'Ligne 1', capacite: 50 }] }); draw(); });
    on('[data-list]', 'input', function(e){ var k = e.dataset.list.split('|'); P[k[0]][+k[1]] = e.value; });
    on('[data-ldelist]', 'click', function(e){ var k = e.dataset.ldelist.split('|'); P[k[0]].splice(+k[1], 1); draw(); });
    on('[data-laddlist]', 'click', function(e){ var k = e.dataset.laddlist; P[k] = P[k] || []; P[k].push(''); draw(); var ins = o.querySelectorAll('[data-list^="' + k + '|"]'); if (ins.length) ins[ins.length - 1].focus(); });
    on('#admSavePlan', 'click', function(){
      for (var i = 0; i < P.cellules.length; i++){
        var c = P.cellules[i]; if (!String(c.nom).trim()){ A.err = 'Chaque cellule doit avoir un nom.'; return draw(); }
        for (var j = 0; j < c.lignes.length; j++){ var l = c.lignes[j]; if (!String(l.nom).trim() || !(l.capacite >= 1)){ A.err = 'Dans « ' + c.nom + ' », chaque ligne doit avoir un nom et une capacité d\'au moins 1 palox.'; return draw(); }
          if (stockDe(c.id, l.id) > l.capacite){ A.err = 'La ligne « ' + l.nom + ' » de « ' + c.nom + ' » contient plus de palox que la capacité saisie.'; return draw(); } }
      }
      var actuel = FS.planData();
      actuel.cellules = P.cellules.map(function(c){ return { id: c.id, nom: String(c.nom).trim(), nonAchetee: !!c.nonAchetee, lignes: c.lignes.map(function(l){ return { id: l.id, nom: String(l.nom).trim(), capacite: l.capacite }; }) }; });
      actuel.produits = (P.produits || []).map(function(x){ return String(x).trim(); }).filter(Boolean);
      actuel.calibres = (P.calibres || []).map(function(x){ return String(x).trim(); }).filter(Boolean);
      FS.planSave(actuel);
      FS.log('Réglages du plan enregistrés (cellules, produits, calibres) dans planStockage/main – palox et historique inchangés', 'pastille');
      A.plan = FS.planData(); A.err = ''; A.msg = 'Réglages du plan enregistrés.'; draw();
    });
    on('#admBackup', 'click', function(){
      var b = new Blob([JSON.stringify(FS.planData(), null, 2)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'sauvegarde-plan-stockage.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
    // relevés
    var R = A.rel;
    on('[data-rf]', 'input', function(e){ var k = e.dataset.rf.split('|'); R.frigos[+k[0]][k[1]] = e.value; });
    on('[data-rp]', 'input', function(e){ var k = e.dataset.rp.split('|'); R.produits[+k[0]][k[1]] = e.value; });
    on('[data-rfdel]', 'click', function(e){ R.frigos.splice(+e.dataset.rfdel, 1); draw(); });
    on('[data-rpdel]', 'click', function(e){ R.produits.splice(+e.dataset.rpdel, 1); draw(); });
    on('#admRfAdd', 'click', function(){ R.frigos.push({ nom: '', min: null, max: null, hrMin: null, hrMax: null }); draw(); });
    on('#admRpAdd', 'click', function(){ R.produits.push({ nom: '', min: null, max: null }); draw(); });
    on('#admSaveRel', 'click', function(){
      var out = { frigos: [], produits: [] }, noms;
      for (var i = 0; i < R.frigos.length; i++){ var f = R.frigos[i], n = String(f.nom || '').trim(); if (!n) continue;
        var o2 = { nom: n }; ['min', 'max', 'hrMin', 'hrMax'].forEach(function(k){ o2[k] = num(f[k]); });
        if (o2.min != null && o2.max != null && o2.min > o2.max){ A.err = 'Pour « ' + n + ' », la T° mini est supérieure à la maxi.'; return draw(); }
        out.frigos.push(o2); }
      for (var j = 0; j < R.produits.length; j++){ var pr = R.produits[j], pn = String(pr.nom || '').trim(); if (!pn) continue;
        var o3 = { nom: pn, min: num(pr.min), max: num(pr.max) };
        if (o3.min != null && o3.max != null && o3.min > o3.max){ A.err = 'Pour « ' + pn + ' », le mini est supérieur au maxi.'; return draw(); }
        out.produits.push(o3); }
      noms = out.frigos.map(function(x){ return x.nom.toLowerCase(); });
      if (new Set(noms).size !== noms.length){ A.err = 'Deux chambres portent le même nom.'; return draw(); }
      FS.temperatures.config = out; FS.log('Réglages des relevés enregistrés dans temperatures/config', 'rel'); FS.notify();
      A.rel = JSON.parse(JSON.stringify(out)); A.err = ''; A.msg = 'Réglages des relevés enregistrés.'; draw();
    });
  }
})();

      '</div><div class="foot">Un seul compte. Chaque module s\'ouvre selon les accès donnés à votre compte ; les comptes et réglages se gèrent dans Administration. On revient ici avec le bouton « Accueil ».</div>';

<script>
(function(){
  // Remplace ces valeurs par la config de ton projet Firebase
  // (Console Firebase > Paramètres du projet > Tes applications > Config SDK)
  const firebaseConfig = {
    apiKey: "AIzaSyCE7V6RSx1akfJsFymsedaKe-uZPSrjps4",
    authDomain: "stockage-plan-temp-test.firebaseapp.com",
    projectId: "stockage-plan-temp-test",
    storageBucket: "stockage-plan-temp-test.firebasestorage.app",
    messagingSenderId: "1020932560553",
    appId: "1:1020932560553:web:02fad075d7ba49f65d7bb8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const DOC_REF = db.collection('planStockage').doc('main');
  let currentRole = 'viewer';
  function canManageStock(){ return currentRole==='editor' || currentRole==='admin'; }
  function isAdmin(){ return currentRole==='admin'; }
  let unsubscribeSnapshot = null;

  // Chaque entrée de state.lots représente UN palox physique (pas un lot agrégé).
  // Plusieurs palox entrés ensemble partagent le même batchId, pour l'affichage groupé "par lot".
  let state = { cellules: [], lots: [], transactions: [], produits: [], calibres: [] };
  let loaded = false;
  let currentTab = 'stockage';
  let currentCelluleId = null;
  let globalByCellule = false;
  const COLOR_PALETTE = ['#A85C2E','#4E6647','#3E5C76','#8B5FBF','#B0793E','#5C7A6E','#7A4B4B','#5A6B8C','#946846','#3F7161'];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){ const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}); }
  function fmt(n){ return (Math.round(n*100)/100).toString(); }
  function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function isPanelOpen(){ return document.getElementById('detailPanel').classList.contains('open'); }

  function applyIncomingState(raw){
    if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = { cellules:[], lots:[], transactions:[], produits:[], calibres:[] }; } }
    migrate();
    if(!currentCelluleId || !getCellule(currentCelluleId)) currentCelluleId = state.cellules[0] ? state.cellules[0].id : null;
  }
  function attachSnapshotListener(){
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = DOC_REF.onSnapshot(async (snap)=>{
      if(!snap.exists){
        state = { cellules: [], lots: [], transactions: [], produits: [], calibres: [] };
        if(canManageStock()){ seedDefault(); applyIncomingState(null); }
        loaded = true;
        render();
        if(canManageStock()) await saveState();
        return;
      }
      if(isPanelOpen()) return;
      applyIncomingState(snap.data().data);
      loaded = true;
      render();
    }, (err)=>{
      console.error("Erreur de synchronisation Firestore", err);
    });
  }
  async function refetchState(){
    try{
      const snap = await DOC_REF.get();
      if(snap.exists){ applyIncomingState(snap.data().data); render(); }
    }catch(e){ console.error(e); }
  }
  let saveStatusTimer = null;
  function setSaveStatus(status){
    const el = document.getElementById('saveStatus');
    if(!el) return;
    clearTimeout(saveStatusTimer);
    if(status==='saving'){ el.textContent = 'Sauvegarde…'; el.style.color = 'var(--ink-soft)'; el.style.display='inline'; }
    else if(status==='ok'){ el.textContent = '✓ Sauvegardé'; el.style.color = 'var(--green)'; el.style.display='inline'; saveStatusTimer = setTimeout(()=>{ el.style.display='none'; }, 2000); }
    else if(status==='error'){ el.innerHTML = '⚠ Non sauvegardé <button id="retrySaveBtn" style="border:none;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:11.5px;font-weight:700;padding:0;">réessayer</button>'; el.style.color = 'var(--warn)'; el.style.display='inline';
      const rb = document.getElementById('retrySaveBtn'); if(rb) rb.addEventListener('click', ()=>saveState());
    }
  }
  let saveChain = Promise.resolve();
  function saveState(){
    saveChain = saveChain.then(()=>doSaveWithRetry(4));
    return saveChain;
  }
  async function doSaveWithRetry(retriesLeft, delay){
    delay = delay || 1000;
    setSaveStatus('saving');
    try{
      await DOC_REF.set({ data: JSON.stringify(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      setSaveStatus('ok');
    }catch(e){
      console.error("Erreur de sauvegarde", e);
      if(retriesLeft>0){
        await new Promise(r=>setTimeout(r, delay));
        return doSaveWithRetry(retriesLeft-1, Math.min(delay*2, 8000));
      }
      setSaveStatus('error');
    }
  }
  function exportBackup(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sauvegarde-plan-stockage-'+today()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function importBackup(file){
    if(!canManageStock()){ alert('Réservé aux comptes de gestion.'); return; }
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.cellules){ alert('Fichier invalide : ce n\'est pas une sauvegarde reconnue.'); return; }
        if(!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
        state = parsed;
        migrate();
        await saveState();
        renderHeaderStats();
        renderTab(currentTab);
      }catch(e){ alert('Impossible de lire ce fichier : '+e.message); }
    };
    reader.readAsText(file);
  }
  async function manualRefresh(){
    const btn = document.getElementById('refreshBtn');
    if(btn) btn.classList.add('spin');
    const statusEl = document.getElementById('saveStatus');
    const hadPendingError = statusEl && statusEl.textContent.indexOf('⚠')===0;
    await refetchState();
    if(hadPendingError) saveState();
    setTimeout(()=>{ if(btn) btn.classList.remove('spin'); }, 500);
  }

  function migrate(){
    // Anciens modèles : ligne { positions, hauteurParPosition }, lot { position, hauteurDebut, nbPalox, poids total }.
    // Nouveau modèle : ligne { capacite }, lot = UN palox individuel { poids unitaire, batchId }.
    if(!Array.isArray(state.produits)){
      state.produits = ['Echalote','Echalion','Echalote de semis','Oignon de Roscoff','Oignon rouge','Oignon jaune'];
    }
    if(!Array.isArray(state.calibres)){
      state.calibres = ['20/40','40/60','60/80'];
    }
    state.cellules.forEach(c=>{
      if(c.nonAchetee==null) c.nonAchetee = !!c.frigo;
      delete c.frigo;
      c.lignes.forEach(l=>{
        if(l.capacite==null){
          if(Array.isArray(l.hauteurParPosition)) l.capacite = l.hauteurParPosition.reduce((a,b)=>a+b,0) || 50;
          else l.capacite = 50;
        }
        delete l.positions; delete l.hauteurParPosition; delete l.hauteurMax;
      });
    });
    const expanded = [];
    state.lots.forEach(l=>{
      delete l.position; delete l.hauteurDebut;
      if(l.nbPalox!=null){
        const count = Math.max(1, Math.round(l.nbPalox));
        const perUnit = l.poids!=null ? l.poids/count : null;
        const batchId = l.batchId || l.id || uid();
        for(let i=0;i<count;i++){
          expanded.push({ id: i===0 ? (l.id||uid()) : uid(), celluleId: l.celluleId, ligneId: l.ligneId, batchId,
            produit: l.produit, lot: l.lot, parcelle: l.parcelle, calibre: l.calibre, traitement: l.traitement, poidsSorti: l.poidsSorti,
            poids: perUnit, dateEntree: l.dateEntree, commentaire: l.commentaire });
        }
      } else {
        if(!l.batchId) l.batchId = l.id;
        expanded.push(l);
      }
    });
    state.lots = expanded;
    // Fusionne les lots identiques (même produit/lot/calibre/traitement/emplacement) sous un seul batchId,
    // pour éviter que des modifications successives ne fragmentent artificiellement un même lot.
    const batchKeyMap = {};
    state.lots.forEach(l=>{
      const key = [l.celluleId, l.ligneId, l.produit, l.lot||'', l.lot2||'', l.calibre||'', !!l.traitement, !!l.poidsSorti].join('|');
      if(batchKeyMap[key]==null) batchKeyMap[key] = l.batchId;
      else l.batchId = batchKeyMap[key];
    });
  }

  function getCellule(id){ return state.cellules.find(c=>c.id===id); }
  function getLigne(celluleId, ligneId){ const c = getCellule(celluleId); return c ? c.lignes.find(l=>l.id===ligneId) : null; }
  function lotsInLigne(celluleId, ligneId){ return state.lots.filter(l=>l.celluleId===celluleId && l.ligneId===ligneId); }
  function ligneOccupied(celluleId, ligneId){ return lotsInLigne(celluleId, ligneId).length; }
  function lignePercent(celluleId, ligneId){
    const l = getLigne(celluleId, ligneId);
    if(!l || !l.capacite) return 0;
    return (ligneOccupied(celluleId, ligneId) / l.capacite) * 100;
  }
  function paloxById(id){ return state.lots.find(l=>l.id===id); }
  function caseLabel(celluleId, ligneId){
    const c = getCellule(celluleId), l = getLigne(celluleId, ligneId);
    return (c?c.nom:'?') + " — " + (l?l.nom:'?');
  }
  function addTx(type, data){
    const responsable = (auth.currentUser && auth.currentUser.email) || '?';
    state.transactions.unshift(Object.assign({ id: uid(), type, date: data.date || today(), responsable }, data));
  }
  function totalPalox(){ return state.lots.length; }
  const FIXED_PRODUCT_COLORS = [
    { test: n=> n.includes('semis') && n.includes('echalote'), color: '#8E6BA8' },   // échalote de semis — mauve
    { test: n=> n.includes('echalion'), color: '#3D6C96' },                          // échalion — bleu
    { test: n=> n.includes('roscoff'), color: '#C97B94' },                           // oignon de roscoff — rose
    { test: n=> n.includes('rouge'), color: '#A83232' },                             // oignon rouge — rouge
    { test: n=> n.includes('jaune'), color: '#B8933A' },                             // oignon jaune — jaune
    { test: n=> n.includes('echalote'), color: '#8C8577' }                           // échalote — gris
  ];
  function normalizeProduitKey(produit){
    return (produit||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function colorForProduit(produit){
    const key = normalizeProduitKey(produit);
    for(let i=0;i<FIXED_PRODUCT_COLORS.length;i++){ if(FIXED_PRODUCT_COLORS[i].test(key)) return FIXED_PRODUCT_COLORS[i].color; }
    let h=0; for(let i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }
    return COLOR_PALETTE[h % COLOR_PALETTE.length];
  }
  function groupByBatch(lots){
    const map = {}, order = [];
    lots.forEach(l=>{
      const key = l.batchId+'|'+l.celluleId+'|'+l.ligneId;
      if(!map[key]){
        map[key] = { batchId:l.batchId, celluleId:l.celluleId, ligneId:l.ligneId, produit:l.produit, lot:l.lot, lot2:l.lot2,
          parcelle:l.parcelle, calibre:l.calibre, traitement:l.traitement, poidsSorti:l.poidsSorti, dateEntree:l.dateEntree, commentaire:l.commentaire, paloxs:[] };
        order.push(key);
      }
      map[key].paloxs.push(l);
    });
    return order.map(k=>map[k]);
  }
  function batchesInLigne(celluleId, ligneId){ return groupByBatch(lotsInLigne(celluleId, ligneId)); }
  function paloxTotalPoids(p){
    if(p.poids==null && p.poidsLot2==null) return null;
    return (p.poids||0) + (p.poidsLot2||0);
  }
  function batchPoidsSummary(batch){
    const known = batch.paloxs.filter(p=>paloxTotalPoids(p)!=null);
    const total = known.reduce((s,p)=>s+paloxTotalPoids(p),0);
    const unknown = batch.paloxs.length - known.length;
    return { total, unknown };
  }
  function produitBreakdownForLigne(celluleId, ligneId){
    const counts = {}, order = [];
    lotsInLigne(celluleId, ligneId).forEach(l=>{
      if(counts[l.produit]==null){ counts[l.produit]=0; order.push(l.produit); }
      counts[l.produit]++;
    });
    return order.map(p=>({ produit:p, count:counts[p] }));
  }

  function batchCardHtml(batch, visibleIds){
    const visiblePaloxs = visibleIds ? batch.paloxs.filter(p=>visibleIds.has(p.id)) : batch.paloxs;
    const summary = batchPoidsSummary({ paloxs: visiblePaloxs });
    const poidsStr = summary.unknown>0 ?
      (fmt(summary.total)+' kg connus ('+summary.unknown+' palox sans poids renseigné)') :
      (fmt(summary.total)+' kg');
    const rows = batch.paloxs.map((p,idx)=>{
      if(visibleIds && !visibleIds.has(p.id)) return '';
      let poidsLabel;
      if(p.poidsLot2!=null){
        const tot = paloxTotalPoids(p);
        poidsLabel = (p.poids!=null? fmt(p.poids):'?')+' kg (lot '+escapeHtml(batch.lot||'1')+') + '+fmt(p.poidsLot2)+' kg (lot '+escapeHtml(batch.lot2||'2')+')'+(tot!=null?' = '+fmt(tot)+' kg':'');
      } else {
        poidsLabel = p.poids!=null? fmt(p.poids)+' kg':'poids inconnu';
      }
      return '<label class="palox-item"><input type="checkbox" data-palox="'+p.id+'"> Palox '+(idx+1)+' — '+poidsLabel+'</label>';
    }).join('');
    return '<div class="lot-card" style="border-left-color:'+colorForProduit(batch.produit)+'" data-batch="'+batch.batchId+'" data-cellule="'+batch.celluleId+'" data-ligne="'+batch.ligneId+'" data-produit="'+escapeHtml((batch.produit||'').toLowerCase())+'">'+
      '<div class="lp-title">'+escapeHtml(batch.produit)+(batch.poidsSorti?'<span class="badge-poids-sorti">Poids sorti</span>':'')+'</div>'+
      '<div class="lp-meta">Lot <span>'+escapeHtml(batch.lot||'—')+(batch.lot2? ' + '+escapeHtml(batch.lot2):'')+'</span>'+
        (batch.parcelle? ' · Parcelle <span>'+escapeHtml(batch.parcelle)+'</span>':'')+
        (batch.calibre? ' · Calibre <span>'+escapeHtml(batch.calibre)+'</span>':'')+
        (batch.traitement? ' · Antigerme':'')+
        '<br>entré le '+fmtDate(batch.dateEntree)+
        (batch.commentaire? '<br>« '+escapeHtml(batch.commentaire)+' »':'')+
      '</div>'+
      (visibleIds ? '<div class="filter-bar" style="margin-bottom:8px;">'+visiblePaloxs.length+' palox isolé(s) par la recherche</div>' : '')+
      (canManageStock() ? '<label class="palox-item palox-select-all"><input type="checkbox" data-select-all="'+batch.batchId+'"> Tout sélectionner</label>' : '')+
      '<div class="palox-list">'+rows+'</div>'+
      '<div class="batch-summary">'+visiblePaloxs.length+' palox · '+poidsStr+'</div>'+
      (canManageStock() ? (
        '<div class="lot-actions">'+
          '<button class="btn btn-sm btn-warn" data-act="sortie" data-batch="'+batch.batchId+'">Sortir la sélection</button>'+
          '<button class="btn btn-sm btn-blue" data-act="deplacer" data-batch="'+batch.batchId+'">Déplacer la sélection</button>'+
          '<button class="btn btn-sm btn-copper" data-act="modifier" data-batch="'+batch.batchId+'">Modifier la sélection</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="supprimer" data-batch="'+batch.batchId+'">Supprimer la sélection</button>'+
        '</div>'+
        '<div class="inline-form" id="form-sortie-'+batch.batchId+'"></div>'+
        '<div class="inline-form" id="form-deplacer-'+batch.batchId+'"></div>'+
        '<div class="inline-form" id="form-modifier-'+batch.batchId+'"></div>'
      ) : '')+
    '</div>';
  }
  function ligneDetailBatchesHtml(celluleId, ligneId, filterProduit, searchQuery){
    let batches = batchesInLigne(celluleId, ligneId);
    if(filterProduit){
      const norm = normalizeProduitKey(filterProduit);
      batches = batches.filter(b => normalizeProduitKey(b.produit)===norm);
    }
    const allTokens = (searchQuery||'').toLowerCase().trim().split(/\s+/).filter(t => t && t!=='kg');
    const weightTokens = allTokens.filter(t => /^\d+([.,]\d+)?$/.test(t));
    const textTokens = allTokens.filter(t => !/^\d+([.,]\d+)?$/.test(t));
    const paloxMatchesWeights = (p) => weightTokens.every(t =>
      (p.poids!=null && String(p.poids).includes(t)) || (p.poidsLot2!=null && String(p.poidsLot2).includes(t))
    );
    if(allTokens.length){
      batches = batches.filter(b=>{
        const haystack = [b.produit,b.lot,b.lot2,b.parcelle,b.calibre,(b.traitement?'antigerme':''),b.commentaire].map(f=>(f||'').toLowerCase()).join(' ');
        const textOk = textTokens.every(t => haystack.includes(t));
        const weightOk = weightTokens.length===0 || b.paloxs.some(paloxMatchesWeights);
        return textOk && weightOk;
      });
    }
    if(batches.length===0){
      return '<p style="color:var(--ink-soft);font-size:13.5px;">'+
        (allTokens.length ? 'Aucun résultat pour « '+escapeHtml(searchQuery)+' ».' : filterProduit? 'Aucun palox de « '+escapeHtml(filterProduit)+' » ici pour le moment.' : 'Aucun palox ici pour le moment.')+
      '</p>';
    }
    return batches.map(b=>{
      const visibleIds = weightTokens.length ? new Set(b.paloxs.filter(paloxMatchesWeights).map(p=>p.id)) : null;
      return batchCardHtml(b, visibleIds);
    }).join('');
  }

  function refreshPaloxWeightInputs(row, fixedCount){
    const nbInput = row.querySelector('[data-f="nbPalox"]');
    const lot2Input = row.querySelector('[data-f="lot2"]');
    const lotInput = row.querySelector('[data-f="lot"]');

    const existing = readPaloxWeightsState(weightsEl);
    const count = fixedCount!=null ? fixedCount : Math.min(500, Math.max(1, Math.round(parseFloat(nbInput.value)||1)));

    const lot1Label = lotInput ? lotInput.value.trim() : '';

  function formSortieSelection(ids){
    const paloxs = ids.map(paloxById).filter(Boolean);
    const known = paloxs.filter(p=>paloxTotalPoids(p)!=null);
    const total = known.reduce((s,p)=>s+paloxTotalPoids(p),0);
