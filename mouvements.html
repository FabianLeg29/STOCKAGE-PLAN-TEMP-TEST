    .mod-bar{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}.mod-bar .mod-t{font-size:14px}

    header.top h1{font-size:20px}
  }

<script>
(function(){
  "use strict";
  const firebaseConfig = {
    apiKey: "AIzaSyCE7V6RSx1akfJsFymsedaKe-uZPSrjps4",
    authDomain: "stockage-plan-temp-test.firebaseapp.com",
    projectId: "stockage-plan-temp-test",
    storageBucket: "stockage-plan-temp-test.firebasestorage.app",
    messagingSenderId: "1020932560553",
    appId: "1:1020932560553:web:02fad075d7ba49f65d7bb8"
  };
  firebase.initializeApp(firebaseConfig);
  // Base de TEST : bandeau d'avertissement, affiché seulement avec la configuration du projet de test
  (function(){ if(firebaseConfig.projectId!=='stockage-plan-temp-test') return; document.title='[TEST] '+document.title; var b=document.createElement('div'); b.id='bandeauTest'; b.setAttribute('role','note'); b.style.cssText='background:#B3261E;color:#fff;font:600 14px/1.35 Inter,Arial,sans-serif;text-align:center;padding:8px 12px;overflow-wrap:anywhere'; b.innerHTML='⚠ Version de TEST : les données ne sont pas réelles, ne pas s\'en servir pour le travail. Application réelle : <a href="https://fabianleg29.github.io/Plan_stockage_allium/" style="color:#fff;text-decoration:underline">fabianleg29.github.io/Plan_stockage_allium</a>'; document.body.insertBefore(b, document.body.firstChild); })();
  const auth = firebase.auth();
  const db = firebase.firestore();
  // Cache local Firestore : affichage immédiat des données déjà vues, mises à jour ensuite par le serveur.
  db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn("Cache local indisponible", e && e.code));
  async function lireFiche(ref){
    let c = null; try{ c = await ref.get({ source: "cache" }); }catch(e){}
    if (c && c.exists){
      const cle = x => [x.role || "", x.roleReleves || "", x.roleMouvements || ""].join("|");
      ref.get({ source: "server" }).then(s => { if (!s.exists || cle(s.data()) !== cle(c.data())) location.reload(); }).catch(() => {});
      return c;
    }
    return ref.get();
  }

  // Collections du module (jamais planStockage/main ni les relevés) :
  //   mouvements         : un document par mouvement (chargement vers un prestataire)
  //   prestation/config  : listes proposées à la saisie (gérées dans Administration)
  // planStockage/main est seulement LU, si le compte y a accès, pour proposer les calibres de la famille du produit.
  const MVT = db.collection("mouvements");
  const CONFIG_REF = db.collection("prestation").doc("config");
  const PRODUITS = [["Ail","Ail"],["Oignon","Oignon"],["Echalote","Échalote"]];
  const CONFIG_DEFAUT = {
    prestataires: ["SAS CONGAR", "EARL FERME DE KERIDER"],
    varietes: { Ail: ["AIL BLANC", "AIL VIOLET", "AIL ROSE"],
      Oignon: ["Oignon de Roscoff AOP", "Oignon Rosé de Bretagne", "Oignon Rosé", "Oignon Rouge", "Oignon Jaune", "Oignon Doux"],
      Echalote: ["Echalote traditionnelle longue", "Echalote traditionnelle 1/2 longue"] },
    origines: ["FRANCE", "ESPAGNE", "ARGENTINE"],
    conditionnements: ["TRESSE", "TUBE", "NETTOYE MAINS", "LITE"],
    responsables: ["MAXIME KERANGUEVEN", "ROMAIN GUILLERM", "NICOLAS GUEGUEN"]
  };
  function normConfig(d){
    d = d || {}; const l = (a, def) => Array.isArray(a) ? a.filter(x => String(x || "").trim()) : def.slice();
    const v = d.varietes || {};
    return { prestataires: l(d.prestataires, CONFIG_DEFAUT.prestataires),
      varietes: { Ail: l(v.Ail, CONFIG_DEFAUT.varietes.Ail), Oignon: l(v.Oignon, CONFIG_DEFAUT.varietes.Oignon), Echalote: l(v.Echalote, CONFIG_DEFAUT.varietes.Echalote) },
      origines: l(d.origines, CONFIG_DEFAUT.origines), conditionnements: l(d.conditionnements, CONFIG_DEFAUT.conditionnements), responsables: l(d.responsables, CONFIG_DEFAUT.responsables) };
  }

  let me = null, roleMvt = "none", rolePlan = "viewer";
  let config = normConfig(null), configLoaded = false;
  let calibresPlan = null;   // { calibres, calibreFamilles } si le plan est lisible
  let tab = "saisie";
  let cleResp = "";
  const S = { date: aujourdhui(), recolte: null, recolteAuto: "", prestataire: "", prestAutre: "", produit: "", variete: "", varAutre: "", lot: "", origine: "", origAutre: "",
    calibre: "", pesees: [""], conditionnement: "", condAutre: "", responsable: "", respAutre: "", commentaire: "" };
  const H = { du: debutMois(), au: aujourdhui(), prestataire: "", produit: "", lot: "", lotExact: false, docs: null, err: "", unsub: null, edit: null,
    vue: "synthese", ouverts: new Set(), retour: null, focusLot: null, recolte: "" };

  // ---------- utilitaires ----------
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function aujourdhui(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function debutMois(){ return aujourdhui().slice(0, 8) + "01"; }
  function frDate(j){ const p = String(j || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(j || ""); }
  function kg(n){ return n == null || !isFinite(n) ? "–" : (Math.round(n * 100) / 100).toLocaleString("fr-FR"); }
  function cle(s){ return String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function libProduit(p){ const x = PRODUITS.find(q => q[0] === p); return x ? x[1] : (p || ""); }
  // Pesées : « 1086 + 1097 », « 1086/1097 », « 1 086,5 » … -> [1086, 1097] (null si illisible)
  function lirePesees(txt){
    const parts = String(txt == null ? "" : txt).split(/[+;\/\n]/).map(x => x.replace(/\s|kg/gi, "").replace(",", ".")).filter(x => x !== "");
    if (!parts.length) return null;
    const v = parts.map(Number);
    return v.every(n => isFinite(n) && n > 0) ? v : null;
  }
  // Calibre « 7080 » -> « 70/80 » (comme dans le plan) ; « +70 » inchangé
  function calibreNorm(s){ s = String(s || "").trim().replace(/\s*\/\s*/g, "/"); return /^\d{4}$/.test(s) ? s.slice(0, 2) + "/" + s.slice(2) : s; }
  // Récolte : désignée par l'année où elle commence (juin). Les deux récoltes se chevauchent de juin à fin juillet :
  // pendant cette période l'opérateur choisit la récolte ; le reste de l'année, elle se déduit de la date.
  const MOIS_DEBUT_RECOLTE = 6, MOIS_FIN_CHEVAUCHEMENT = 7;
  function recolteParDefaut(j){ const y = +String(j).slice(0, 4), m = +String(j).slice(5, 7); return m >= MOIS_DEBUT_RECOLTE ? y : y - 1; }
  function enChevauchement(j){ const m = +String(j).slice(5, 7); return m >= MOIS_DEBUT_RECOLTE && m <= MOIS_FIN_CHEVAUCHEMENT; }
  function recoltesPossibles(j){ const r = recolteParDefaut(j); return enChevauchement(j) ? [r - 1, r] : [r]; }
  // Mouvement sans récolte enregistrée : hors chevauchement, la date suffit ; pendant le chevauchement, on reprend la
  // récolte connue du même lot (autres chargements) ; sinon null = « à confirmer ».
  let indexRecoltes = new Map();
  function cleLot(m){ return (m.produit || "") + "|" + cle(m.lot); }
  function indexer(docs){
    const idx = new Map();
    docs.forEach(m => { if (m.recolte) idx.set(cleLot(m), m.recolte); });
    docs.forEach(m => { if (!m.recolte && !enChevauchement(m.date) && !idx.has(cleLot(m))) idx.set(cleLot(m), recolteParDefaut(m.date)); });
    indexRecoltes = idx;
  }
  function recolteDe(m){ return m.recolte || (enChevauchement(m.date) ? indexRecoltes.get(cleLot(m)) || null : recolteParDefaut(m.date)); }
  function libRecolte(r){ return r ? "Récolte " + r : "Récolte à confirmer"; }
  function total(v){ return Math.round(v.reduce((a, b) => a + b, 0) * 1000) / 1000; }
  function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 3200); }
  function banner(m){ const b = document.getElementById("banner"); b.textContent = m; b.classList.toggle("hidden", !m); }
  function errMsg(e){ return e && e.code === "permission-denied" ? "Action refusée par les règles Firebase (droits insuffisants)." : "Enregistrement impossible : " + ((e && e.message) || "erreur inconnue") + "."; }
  function telecharger(nom, data, type){ const b = new Blob([data], { type }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nom; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  function peutSaisir(){ return roleMvt === "editor" || roleMvt === "admin"; }
  function estAdmin(){ return roleMvt === "admin" || rolePlan === "admin"; }
  // Modification / suppression : l'auteur pendant 24 h (rôle Gestion ou Admin), ou un admin à tout moment
  function peutGerer(m){
    if (estAdmin()) return true;
    if (!peutSaisir() || !me || m.uid !== me.uid || !m.creeLe || typeof m.creeLe.toMillis !== "function") return false;
    return Date.now() - m.creeLe.toMillis() < 24 * 3600 * 1000;
  }
  function choixHtml(attr, liste, actuel, avecAutre){
    return '<div class="chips">' + liste.map(v => '<button type="button" class="chip" data-' + attr + '="' + esc(v) + '" aria-pressed="' + (actuel === v) + '">' + esc(v) + '</button>').join("") +
      (avecAutre ? '<button type="button" class="chip" data-' + attr + '="__autre" aria-pressed="' + (actuel === "__autre") + '">Autre</button>' : "") + "</div>";
  }
  function valeurChoix(v, autre){ return v === "__autre" ? String(autre || "").trim() : v; }

  // ---------- Saisie ----------
  function famillePlan(p){ return p === "Ail" ? "Ail" : p === "Oignon" ? "Oignon" : p === "Echalote" ? "Echalote" : ""; }
  function calibresProposes(){
    if (!calibresPlan) return [];
    const f = famillePlan(S.produit), fam = calibresPlan.calibreFamilles || {};
    return (calibresPlan.calibres || []).filter(c => !f || !fam[c] || !fam[c].length || fam[c].indexOf(f) >= 0).sort((a, b) => a.localeCompare(b, "fr"));
  }
  function renderSaisie(){
    const v = document.getElementById("view");

          ? '<h2 style="margin-top:14px">Récolte <span class="req">*</span></h2><p class="hint">Période de chevauchement (juin – juillet) : indiquez de quelle récolte vient la marchandise.</p><div class="chips">' +
            poss.map((r, i) => '<button type="button" class="chip" data-rec="' + r + '" aria-pressed="' + (S.recolte === r) + '">Récolte ' + r + (i ? ' (nouvelle)' : ' (ancienne)') + '</button>').join("") + '</div>' +

        (S.prestataire === "__autre" ? '<input class="autre" type="text" id="sPrestAutre" value="' + esc(S.prestAutre) + '" placeholder="Nom du prestataire">' : "") + '</div>' +

        (S.produit ? '<h2 style="margin-top:14px">Variété ' + esc(libProduit(S.produit).toLowerCase()) + (S.produit === "Ail" ? ' <span class="req">*</span>' : "") + '</h2>' + choixHtml("variete", vars, S.variete, true) +
          (S.variete === "__autre" ? '<input class="autre" type="text" id="sVarAutre" value="' + esc(S.varAutre) + '" placeholder="Variété">' : "") : "") + '</div>' +
      '<div class="card"><h2>Détail marchandise</h2><div class="row2"><div><h2>Lot <span class="req">*</span></h2><input type="text" id="sLot" value="' + esc(S.lot) + '" autocomplete="off" autocapitalize="characters"></div>' +
        '<div><h2>Calibre</h2><input type="text" id="sCal" list="lCal" value="' + esc(S.calibre) + '" autocomplete="off" placeholder="ex. 70/80"><datalist id="lCal">' + cal.map(c => '<option value="' + esc(c) + '">').join("") + '</datalist></div></div>' +
        '<h2 style="margin-top:14px">Origine <span class="req">*</span></h2>' + choixHtml("origine", config.origines, S.origine, true) +
        (S.origine === "__autre" ? '<input class="autre" type="text" id="sOrigAutre" value="' + esc(S.origAutre) + '" placeholder="Origine">' : "") + '</div>' +
      '<div class="card"><h2>Quantité (kg) <span class="req">*</span></h2><p class="hint">Une ligne par pesée : le total est calculé automatiquement.</p><div class="pesees">' + pes + '</div>' +
        '<button type="button" class="btn-link" id="addPesee">+ Ajouter une pesée</button><div class="total" id="sTotal"></div></div>' +
      '<div class="card"><h2>Conditionnement prévu</h2>' + choixHtml("cond", config.conditionnements, S.conditionnement, true) +
        (S.conditionnement === "__autre" ? '<input class="autre" type="text" id="sCondAutre" value="' + esc(S.condAutre) + '" placeholder="Conditionnement">' : "") + '</div>' +
      '<div class="card"><h2>Remarques</h2><textarea id="sCom">' + esc(S.commentaire) + '</textarea></div>' +
      '<button type="button" class="btn btn-main" id="sSave">Enregistrer le mouvement</button><p class="err hidden" id="sErr"></p>';
    majTotal();
    const on = (sel, ev, f) => v.querySelectorAll(sel).forEach(e => e.addEventListener(ev, () => f(e)));

      if (r && recoltesPossibles(S.date).indexOf(r) >= 0 && S.recolte !== r){ S.recolte = r; S.recolteAuto = "Récolte " + r + " reprise des chargements précédents du lot " + S.lot.trim().toUpperCase() + "."; renderSaisie(); }

    on("#sOrigAutre", "input", e => { S.origAutre = e.value; });
    on("#sCondAutre", "input", e => { S.condAutre = e.value; });
    on("#sLot", "input", e => { S.lot = e.value; });

  function majTotal(){
    const t = document.getElementById("sTotal"); if (!t) return;
    const v = S.pesees.filter(x => String(x).trim() !== "");
    const n = v.map(x => lirePesees(x));
    if (!v.length){ t.textContent = ""; return; }
    if (n.some(x => !x)){ t.textContent = "Pesée illisible : saisissez un nombre (ex. 1086 ou 1086,5)."; t.style.color = "var(--warn)"; return; }
    t.style.color = ""; t.textContent = "Total : " + kg(total([].concat.apply([], n))) + " kg" + (v.length > 1 ? " (" + v.length + " pesées)" : "");
  }
  async function enregistrer(){
    const err = document.getElementById("sErr"), btn = document.getElementById("sSave");
    const show = m => { err.textContent = m; err.classList.remove("hidden"); };
    err.classList.add("hidden");
    const prestataire = valeurChoix(S.prestataire, S.prestAutre), variete = valeurChoix(S.variete, S.varAutre);
    const origine = valeurChoix(S.origine, S.origAutre), conditionnement = valeurChoix(S.conditionnement, S.condAutre);
    const remplies = S.pesees.filter(x => String(x).trim() !== ""), lues = remplies.map(lirePesees);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(S.date)) return show("Indiquez la date de chargement.");
    if (!prestataire) return show("Choisissez le prestataire.");
    if (!S.produit) return show("Choisissez le produit.");
    if (S.produit === "Ail" && !variete) return show("Choisissez la variété d'ail.");
    if (!S.lot.trim()) return show("Indiquez le numéro de lot.");
    if (!S.recolte) return show("Choisissez la récolte (période de chevauchement juin – juillet).");
    if (!origine) return show("Choisissez l'origine.");
    if (!remplies.length) return show("Saisissez au moins une pesée (kg).");
    if (lues.some(x => !x)) return show("Une pesée est illisible : saisissez un nombre (ex. 1086 ou 1086,5).");
    const pesees = [].concat.apply([], lues);
    const doc = { date: S.date, recolte: S.recolte, prestataire, produit: S.produit, variete, lot: S.lot.trim().toUpperCase(), origine, calibre: calibreNorm(S.calibre),
      pesees, quantite: total(pesees), conditionnement, responsable: S.responsable.trim(), commentaire: S.commentaire.trim(),
      uid: me.uid, creeLe: firebase.firestore.FieldValue.serverTimestamp() };
    btn.disabled = true;
    try{
      await MVT.add(doc);
      try{ localStorage.setItem(cleResp, S.responsable.trim()); }catch(e){}
      toast("Mouvement enregistré : " + doc.lot + " – " + kg(doc.quantite) + " kg");
      // On garde la date, le prestataire, le produit, l'origine et le responsable (souvent identiques sur un même chargement)
      Object.assign(S, { lot: "", calibre: "", pesees: [""], commentaire: "" });
      renderSaisie(); window.scrollTo(0, 0);
    }catch(e){ show(errMsg(e)); btn.disabled = false; }
  }

  // ---------- Historique ----------
  function ecouterHist(){
    if (H.unsub) H.unsub();
    H.docs = null; H.err = "";
    H.unsub = MVT.where("date", ">=", H.du).where("date", "<=", H.au).orderBy("date", "desc").limit(5000).onSnapshot(s => {
      H.docs = s.docs.map(d => Object.assign({ _id: d.id }, d.data())); H.err = ""; indexer(H.docs);
      if (tab === "hist" && !saisieHistEnCours()) drawHist();
    }, e => { console.warn(e); H.docs = []; H.err = e && e.code === "permission-denied" ? "Lecture refusée : votre compte n'a pas accès à l'historique des mouvements." : "Lecture impossible : " + ((e && e.message) || ""); if (tab === "hist") drawHist(); });
  }
  function saisieHistEnCours(){ const a = document.activeElement; return !!(a && a.closest && a.closest("#hEdit")); }
  function filtres(){
    const l = cle(H.lot);
    return (H.docs || []).filter(m => (!H.recolte || (H.recolte === "?" ? !recolteDe(m) : recolteDe(m) === +H.recolte)) && (!H.prestataire || m.prestataire === H.prestataire) && (!H.produit || m.produit === H.produit) && (!l || (H.lotExact ? cle(m.lot) === l : cle(m.lot).indexOf(l) >= 0)))
      .sort((a, b) => a.date === b.date ? ((b.creeLe && b.creeLe.toMillis ? b.creeLe.toMillis() : 0) - (a.creeLe && a.creeLe.toMillis ? a.creeLe.toMillis() : 0)) : (a.date < b.date ? 1 : -1));
  }

      if (/^\d{4}$/.test(H.recolte)){ const r = +H.recolte, fin = (r + 1) + "-07-31"; H.du = r + "-06-01"; H.au = fin < aujourdhui() ? fin : aujourdhui(); ecouterHist(); }

    v.querySelectorAll("[data-vue]").forEach(b => b.addEventListener("click", () => { if (b.dataset.vue === "synthese") revenirSynthese(); else { H.vue = "liste"; H.retour = null; renderHist(); } }));
    const r = document.getElementById("hRetour"); if (r) r.addEventListener("click", revenirSynthese);
    const tt = document.getElementById("hTout"); if (tt) tt.addEventListener("click", () => { const g = groupes(filtres()); const tous = g.every(p => p.produits.every(x => H.ouverts.has(x.cle))); H.ouverts = new Set(tous ? [] : [].concat.apply([], g.map(p => p.produits.map(x => x.cle)))); drawHist(); });
    document.getElementById("hXlsx").addEventListener("click", exporter);
    drawHist();

      (() => { const n = l.filter(m => !recolteDe(m)).length; return n && H.recolte !== "?" ? ' <span class="tag warn">' + n + ' à récolte à confirmer</span>' + (estAdmin() ? ' <span class="hint">(à attribuer lot par lot dans la synthèse)</span>' : "") : ""; })();

    if (H.vue === "synthese") return drawSynthese(t, l);

      l.map(m => '<tr' + (m.import ? ' class="imp"' : "") + '><td data-l="Date">' + frDate(m.date) + (m.import ? '<span class="tag" title="Importé de la Google Sheet">Sheet</span>' : "") + (m.modifications && m.modifications.length ? '<span class="tag" title="Modifié">Modifié</span>' : "") + '</td>' +
        '<td data-l="Récolte">' + (recolteDe(m) ? recolteDe(m) + (m.recolte ? "" : ' <small class="hint">(déduite)</small>') : '<span class="tag warn">à confirmer</span>') + '</td>' +
        '<td data-l="Prestataire">' + esc(m.prestataire) + '</td><td data-l="Produit">' + esc(libProduit(m.produit)) + '</td><td data-l="Variété">' + esc(m.variete || "") + '</td><td data-l="Lot"><b>' + esc(m.lot) + '</b></td>' +
        '<td data-l="Origine">' + esc(m.origine || "") + '</td><td data-l="Calibre">' + esc(calibreNorm(m.calibre)) + '</td>' +

        '<td data-l="Conditionnement">' + esc(m.conditionnement || "") + '</td><td data-l="Responsable">' + esc(m.responsable || "") + (m.commentaire ? '<br><small class="hint">' + esc(m.commentaire) + '</small>' : "") + '</td>' +

  // ---------- Synthèse : prestataire > produit > lot ----------
  function plage(a, b){ return a === b ? frDate(a) : frDate(a) + " → " + frDate(b); }
  function groupes(l){
    const pr = new Map();
    l.forEach(m => {
      const p = m.prestataire || "(sans prestataire)";
      if (!pr.has(p)) pr.set(p, new Map());
      const pd = pr.get(p); if (!pd.has(m.produit)) pd.set(m.produit, new Map());
      const lots = pd.get(m.produit), k = m.lot || "(sans lot)";
      if (!lots.has(k)) lots.set(k, { lot: k, produit: m.produit, n: 0, kg: 0, varietes: new Set(), calibres: new Set(), recoltes: new Set(), du: m.date, au: m.date });
      const x = lots.get(k); x.n++; x.kg += m.quantite || 0; x.recoltes.add(recolteDe(m) || "?");
      if (m.variete) x.varietes.add(m.variete); if (m.calibre) x.calibres.add(calibreNorm(m.calibre));
      if (m.date < x.du) x.du = m.date; if (m.date > x.au) x.au = m.date;
    });
    const ordre = PRODUITS.map(p => p[0]);
    return Array.from(pr.entries()).map(([p, pd]) => {
      const produits = Array.from(pd.entries()).sort((a, b) => ordre.indexOf(a[0]) - ordre.indexOf(b[0])).map(([prod, lots]) => {
        const ls = Array.from(lots.values()).map(x => Object.assign(x, { kg: Math.round(x.kg * 1000) / 1000 })).sort((a, b) => b.kg - a.kg);
        return { produit: prod, cle: p + "|" + prod, lots: ls, n: ls.reduce((a, x) => a + x.n, 0), kg: Math.round(ls.reduce((a, x) => a + x.kg, 0) * 1000) / 1000 };
      });
      return { prestataire: p, produits, n: produits.reduce((a, x) => a + x.n, 0), kg: Math.round(produits.reduce((a, x) => a + x.kg, 0) * 1000) / 1000 };
    }).sort((a, b) => b.kg - a.kg);
  }
  function drawSynthese(t, l){
    const g = groupes(l), tot = total(l.map(m => m.quantite || 0));
    let h = '<table class="sy"><thead><tr><th>Prestataire / produit / lot</th><th class="num"><span class="lg">Mouvements</span><span class="sm">Mvts</span></th><th class="num c-lots">Lots</th><th class="num">Quantité</th></tr></thead><tbody>';
    g.forEach(p => {
      h += '<tr class="pr"><th>' + esc(p.prestataire) + '</th><th class="num">' + p.n + '</th><th class="num c-lots">' + p.produits.reduce((a, x) => a + x.lots.length, 0) + '</th><th class="num">' + kg(p.kg) + ' kg</th></tr>';
      p.produits.forEach(x => {
        const ouvert = H.ouverts.has(x.cle);
        h += '<tr class="pd" tabindex="0" role="button" aria-expanded="' + ouvert + '" data-k="' + esc(x.cle) + '"><td><span class="chev" aria-hidden="true">' + (ouvert ? "▾" : "▸") + '</span>' + esc(libProduit(x.produit)) +
          ' <small>' + Math.round(x.kg / (p.kg || 1) * 100) + ' %</small></td><td class="num">' + x.n + '</td><td class="num c-lots">' + x.lots.length + '</td><td class="num"><b>' + kg(x.kg) + ' kg</b></td></tr>';
        if (ouvert) x.lots.forEach(o => {
          h += '<tr class="lt' + (H.focusLot === p.prestataire + "|" + x.produit + "|" + o.lot ? " focus" : "") + '" tabindex="0" role="button" data-lp="' + esc(p.prestataire) + '" data-lprod="' + esc(x.produit) + '" data-lot="' + esc(o.lot) + '" title="Voir les mouvements de ce lot">' +
            '<td><b>' + esc(o.lot) + '</b>' + recolteLotHtml(o) + '<small>' + esc([Array.from(o.varietes).join(", "), Array.from(o.calibres).sort().join(", "), plage(o.du, o.au)].filter(Boolean).join(" · ")) + '</small></td>' +
            '<td class="num">' + o.n + '</td><td class="num c-lots"></td><td class="num">' + kg(o.kg) + ' kg</td></tr>';
        });
      });
    });
    h += '</tbody><tfoot><tr><th>Total</th><th class="num">' + l.length + '</th><th class="num c-lots">' + g.reduce((a, p) => a + p.produits.reduce((b, x) => b + x.lots.length, 0), 0) + '</th><th class="num">' + kg(tot) + ' kg</th></tr></tfoot></table>' +
      '<p class="hint" style="margin-top:8px">Touchez un produit pour voir le détail par lot, puis un lot pour voir ses mouvements.</p>';
    t.innerHTML = h;
    const act = (sel, f) => t.querySelectorAll(sel).forEach(e => { e.addEventListener("click", () => f(e)); e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); f(e); } }); });
    act("tr.pd", e => { const k = e.dataset.k; if (H.ouverts.has(k)) H.ouverts.delete(k); else H.ouverts.add(k); drawHist(); });
    t.querySelectorAll("[data-attrib]").forEach(sel => { sel.addEventListener("click", ev => ev.stopPropagation()); sel.addEventListener("keydown", ev => ev.stopPropagation()); sel.addEventListener("change", () => attribuerRecolte(sel.dataset.attrib, sel.dataset.aprod, +sel.value)); });
    act("tr.lt", e => {
      H.retour = { prestataire: H.prestataire, produit: H.produit, lot: H.lot, lotExact: H.lotExact, y: window.scrollY };
      H.focusLot = e.dataset.lp + "|" + e.dataset.lprod + "|" + e.dataset.lot;
      H.prestataire = e.dataset.lp; H.produit = e.dataset.lprod; H.lot = e.dataset.lot; H.lotExact = true; H.vue = "liste";
      renderHist(); window.scrollTo(0, 0);
    });
  }
  function recolteLotHtml(o){
    const r = Array.from(o.recoltes), conf = r.indexOf("?") >= 0, txt = r.filter(x => x !== "?").sort().map(x => "Récolte " + x).join(", ");
    let h = ' <span class="tag' + (conf ? ' warn' : '') + '">' + (txt ? txt + (conf ? " + à confirmer" : "") : "Récolte à confirmer") + '</span>';
    // Admin : attribuer la récolte à tout le lot (un lot appartient à une seule récolte)
    if (estAdmin() && (conf || r.length > 1 || enChevauchement(o.du) || enChevauchement(o.au))){
      const poss = Array.from(new Set(recoltesPossibles(o.du).concat(recoltesPossibles(o.au)))).sort();
      h += ' <select class="attrib" data-attrib="' + esc(o.lot) + '" data-aprod="' + esc(o.produit) + '" aria-label="Attribuer une récolte au lot ' + esc(o.lot) + '"><option value="">Attribuer…</option>' +
        poss.map(x => '<option value="' + x + '">Récolte ' + x + '</option>').join("") + '</select>';
    }
    return h;
  }
  async function attribuerRecolte(lot, produit, r){
    if (!r) return;
    const cibles = (H.docs || []).filter(m => m.produit === produit && cle(m.lot) === cle(lot) && m.recolte !== r);
    if (!cibles.length){ toast("Rien à changer."); return; }
    if (!confirm("Attribuer la récolte " + r + " aux " + cibles.length + " mouvement" + (cibles.length > 1 ? "s" : "") + " du lot " + lot + " (" + libProduit(produit) + ") sur la période affichée ?")){ drawHist(); return; }
    const le = new Date().toISOString();
    try{
      for (let i = 0; i < cibles.length; i += 400){
        const b = db.batch();
        cibles.slice(i, i + 400).forEach(m => b.update(MVT.doc(m._id), { recolte: r, modifications: firebase.firestore.FieldValue.arrayUnion({ le, par: me.email, raison: "Récolte attribuée au lot " + lot, avant: { recolte: m.recolte || "" } }) }));
        await b.commit();
      }
      toast("Récolte " + r + " attribuée au lot " + lot + ".");
    }catch(e){ alert(errMsg(e)); drawHist(); }
  }
  function revenirSynthese(){
    const r = H.retour; H.vue = "synthese";
    if (r){ H.prestataire = r.prestataire; H.produit = r.produit; H.lot = r.lot; H.lotExact = r.lotExact; }
    H.retour = null; renderHist();
    if (r) requestAnimationFrame(() => { const f = document.querySelector("tr.lt.focus"); if (f) f.scrollIntoView({ block: "center" }); else window.scrollTo(0, r.y); });
  }
  function drawEdit(){
    const box = document.getElementById("hEditBox"); if (!box) return;
    const m = H.edit && (H.docs || []).find(x => x._id === H.edit);
    if (!m){ box.innerHTML = ""; return; }
    if (document.getElementById("hEdit") && document.getElementById("hEdit").dataset.id === m._id) return;
    const dl = (id, l) => '<datalist id="' + id + '">' + l.map(x => '<option value="' + esc(x) + '">').join("") + "</datalist>";
    box.innerHTML = '<div class="card edit" id="hEdit" data-id="' + esc(m._id) + '"><h2>Modifier le mouvement du ' + frDate(m.date) + ' – lot ' + esc(m.lot) + '</h2>' +
      '<div class="row2"><label>Récolte<select id="eRec"><option value="">À confirmer</option>' + Array.from(new Set(recoltesPossibles(m.date).concat(m.recolte ? [m.recolte] : []))).sort().map(r => '<option value="' + r + '"' + (recolteDe(m) === r ? " selected" : "") + '>Récolte ' + r + '</option>').join("") + '</select></label><span></span></div>' +
      '<div class="row2"><label>Date de chargement<input type="date" id="eDate" value="' + esc(m.date) + '"></label><label>Prestataire<input type="text" id="ePresta" list="eLP" value="' + esc(m.prestataire) + '">' + dl("eLP", config.prestataires) + '</label></div>' +
      '<div class="row2"><label>Produit<select id="eProd">' + PRODUITS.map(p => '<option value="' + p[0] + '"' + (m.produit === p[0] ? " selected" : "") + '>' + p[1] + '</option>').join("") + '</select></label><label>Variété<input type="text" id="eVar" list="eLV" value="' + esc(m.variete || "") + '">' + dl("eLV", [].concat(config.varietes.Ail, config.varietes.Oignon, config.varietes.Echalote)) + '</label></div>' +
      '<div class="row2"><label>Lot<input type="text" id="eLot" value="' + esc(m.lot) + '"></label><label>Origine<input type="text" id="eOrig" list="eLO" value="' + esc(m.origine || "") + '">' + dl("eLO", config.origines) + '</label></div>' +
      '<div class="row2"><label>Calibre<input type="text" id="eCal" value="' + esc(m.calibre || "") + '"></label><label>Pesées (kg, séparées par + ou /)<input type="text" id="ePes" inputmode="decimal" value="' + esc((m.pesees || [m.quantite]).map(x => String(x).replace(".", ",")).join(" + ")) + '"></label></div>' +
      '<div class="row2"><label>Conditionnement<input type="text" id="eCond" list="eLC" value="' + esc(m.conditionnement || "") + '">' + dl("eLC", config.conditionnements) + '</label><label>Responsable<input type="text" id="eResp" list="eLR" value="' + esc(m.responsable || "") + '">' + dl("eLR", config.responsables) + '</label></div>' +
      '<label>Remarques<textarea id="eCom">' + esc(m.commentaire || "") + '</textarea></label>' +
      '<label style="margin-top:10px">Raison de la modification (obligatoire)<input type="text" id="eRaison"></label>' +
      '<div class="actions"><button type="button" class="btn btn-main" id="eSave" style="width:auto">Enregistrer la modification</button><button type="button" class="btn btn-sec" id="eNon">Annuler</button></div><p class="err hidden" id="eErr"></p></div>';
    document.getElementById("eNon").addEventListener("click", () => { H.edit = null; drawEdit(); });
    document.getElementById("eSave").addEventListener("click", () => modifier(m));
  }
  const CHAMPS = ["recolte", "date", "prestataire", "produit", "variete", "lot", "origine", "calibre", "pesees", "quantite", "conditionnement", "responsable", "commentaire"];
  async function modifier(m){
    const err = document.getElementById("eErr"), show = x => { err.textContent = x; err.classList.remove("hidden"); };
    const g = id => document.getElementById(id).value.trim();
    const pes = lirePesees(g("ePes"));
    const n = { recolte: +g("eRec") || null, date: g("eDate"), prestataire: g("ePresta"), produit: g("eProd"), variete: g("eVar"), lot: g("eLot").toUpperCase(), origine: g("eOrig"), calibre: calibreNorm(g("eCal")),
      pesees: pes, quantite: pes ? total(pes) : null, conditionnement: g("eCond"), responsable: g("eResp"), commentaire: g("eCom") };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(n.date)) return show("Date de chargement invalide.");
    if (!n.prestataire || !n.lot || !n.origine) return show("Prestataire, lot et origine sont obligatoires.");
    if (!pes) return show("Pesées illisibles : saisissez des nombres séparés par + (ex. 1086 + 1097).");
    const raison = g("eRaison"); if (!raison) return show("Indiquez la raison de la modification.");
    const avant = {}, maj = {};
    CHAMPS.forEach(k => { if (JSON.stringify(m[k] == null ? "" : m[k]) !== JSON.stringify(n[k] == null ? "" : n[k])){ avant[k] = m[k] == null ? "" : m[k]; maj[k] = n[k]; } });
    if (!Object.keys(maj).length) return show("Aucune modification.");
    maj.modifications = firebase.firestore.FieldValue.arrayUnion({ le: new Date().toISOString(), par: me.email, raison, avant });
    try{ await MVT.doc(m._id).update(maj); H.edit = null; toast("Mouvement modifié."); drawEdit(); }
    catch(e){ show(errMsg(e)); }
  }
  async function supprimer(id){
    const m = (H.docs || []).find(x => x._id === id); if (!m) return;
    if (!confirm("Supprimer définitivement le mouvement du " + frDate(m.date) + " (lot " + m.lot + ", " + kg(m.quantite) + " kg) ?")) return;
    try{ await MVT.doc(id).delete(); toast("Mouvement supprimé."); }catch(e){ alert(errMsg(e)); }
  }
  function exporter(){
    const l = filtres().slice().reverse();
    if (!window.XlsxReleves || !window.XlsxReleves.tableau){ toast("Export Excel indisponible"); return; }
    const h = s => ({ v: s, s: 5 });
    const lignes = [[{ v: "MOUVEMENTS ALLIUMS PRESTATION – E14.3", s: 4 }], [(H.recolte && H.recolte !== "?" ? "Récolte " + H.recolte + " – " : H.recolte === "?" ? "Récolte à confirmer – " : "") + "Période : du " + frDate(H.du) + " au " + frDate(H.au) +
      (H.prestataire ? " – prestataire : " + H.prestataire : "") + (H.produit ? " – produit : " + libProduit(H.produit) : "") + (H.lot ? " – lot : " + H.lot : "")], [],
      ["Date de chargement", "Récolte", "Prestataire", "Produit", "Variété", "Lot", "Origine", "Calibre", "Quantité (kg)", "Détail des pesées", "Conditionnement prévu", "Responsable", "Remarques", "Saisi le", "Modifications"].map(h)];
    l.forEach(m => lignes.push([{ v: window.XlsxReleves.dateExcel(m.date), s: 8 }, recolteDe(m) ? { v: recolteDe(m), s: 0 } : "à confirmer", m.prestataire, libProduit(m.produit), m.variete || "", m.lot, m.origine || "", calibreNorm(m.calibre), { v: m.quantite, s: 2 },
      (m.pesees || []).map(x => String(x).replace(".", ",")).join(" + "), m.conditionnement || "", m.responsable || "", m.commentaire || "",
      m.import && m.import.horodateur ? m.import.horodateur + " (Google Sheet)" : (m.creeLe && m.creeLe.toDate ? m.creeLe.toDate().toLocaleString("fr-FR") : ""),
      (m.modifications || []).map(x => new Date(x.le).toLocaleString("fr-FR") + " par " + (x.par || "?") + " : " + (x.raison || "")).join(" ; ")]));
    lignes.push([]);
    lignes.push([{ v: "TOTAL", s: 1 }, "", "", "", "", l.length + " mouvement" + (l.length > 1 ? "s" : ""), "", "", { v: total(l.map(m => m.quantite || 0)), s: 2 }]);
    PRODUITS.forEach(p => { const q = l.filter(m => m.produit === p[0]); if (q.length) lignes.push(["", "", "", p[1], "", q.length + " mouvement" + (q.length > 1 ? "s" : ""), "", "", { v: total(q.map(m => m.quantite || 0)), s: 2 }]); });
    const periode = lignes[1];
    const g = groupes(l);
    const syn = [[{ v: "SYNTHÈSE PAR PRESTATAIRE ET PRODUIT", s: 4 }], periode, [], ["Prestataire", "Produit", "Mouvements", "Lots", "Quantité (kg)"].map(h)];
    g.forEach(p => { p.produits.forEach(x => syn.push([p.prestataire, libProduit(x.produit), { v: x.n, s: 6 }, { v: x.lots.length, s: 6 }, { v: x.kg, s: 2 }]));
      syn.push([{ v: "Total " + p.prestataire, s: 1 }, "", { v: p.n, s: 6 }, { v: p.produits.reduce((a, x) => a + x.lots.length, 0), s: 6 }, { v: p.kg, s: 2 }]); syn.push([]); });
    syn.push([{ v: "TOTAL", s: 1 }, "", { v: l.length, s: 6 }, "", { v: total(l.map(m => m.quantite || 0)), s: 2 }]);
    const parLot = [[{ v: "DÉTAIL PAR LOT", s: 4 }], periode, [], ["Prestataire", "Produit", "Lot", "Récolte", "Variété(s)", "Calibre(s)", "Mouvements", "Quantité (kg)", "Premier chargement", "Dernier chargement"].map(h)];
    g.forEach(p => p.produits.forEach(x => x.lots.forEach(o => parLot.push([p.prestataire, libProduit(x.produit), o.lot, Array.from(o.recoltes).sort().map(r => r === "?" ? "à confirmer" : r).join(", "), Array.from(o.varietes).join(", "), Array.from(o.calibres).sort().join(", "),
      { v: o.n, s: 6 }, { v: o.kg, s: 2 }, { v: window.XlsxReleves.dateExcel(o.du), s: 8 }, { v: window.XlsxReleves.dateExcel(o.au), s: 8 }]))));
    const data = window.XlsxReleves.tableau([
      { nom: "Synthèse", lignes: syn, largeurs: [30, 12, 13, 8, 15], gel: [0, 4] },
      { nom: "Par lot", lignes: parLot, largeurs: [26, 11, 14, 14, 28, 16, 12, 14, 14, 14], gel: [0, 4] },
      { nom: "Mouvements", lignes, largeurs: [12, 10, 24, 10, 28, 14, 12, 10, 13, 22, 18, 22, 30, 20, 40], gel: [0, 4] }], { titre: "Mouvements alliums prestation E14.3" });
    telecharger("E14.3_Mouvements_alliums_prestation_" + H.du + "_au_" + H.au + ".xlsx", data, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  // ---------- navigation ----------
  function setTab(t){
    tab = t; document.body.classList.toggle("hist", t === "hist");
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    render(); window.scrollTo(0, 0);
  }
  function render(){ if (tab === "saisie") renderSaisie(); else renderHist(); }
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  function bloquer(titre, texte){ document.getElementById("tabs").classList.add("hidden"); document.getElementById("view").innerHTML = '<div class="card"><h2>' + esc(titre) + '</h2><p class="hint">' + esc(texte) + '</p><a class="btn btn-sec" style="display:inline-flex;align-items:center;text-decoration:none" href="index.html">Retour à l\'accueil</a></div>'; }

  function demarrer(){
    if (!peutSaisir()){ tab = "hist"; document.body.classList.add("hist"); document.querySelector('#tabs [data-tab="saisie"]').classList.add("hidden"); document.getElementById("tabs").style.gridTemplateColumns = "1fr"; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === "hist"))); }
    render();
    CONFIG_REF.onSnapshot(s => { config = normConfig(s.exists ? s.data() : null); configLoaded = true; if (tab === "saisie") renderSaisie(); }, e => { console.warn(e); banner("Listes de saisie illisibles : listes par défaut affichées."); });
    ecouterHist();
    // Calibres du plan (lecture seule, si le compte a accès au plan) : proposés selon la famille du produit
    const lirePlan = s => { if (s && s.exists){ try{ const p = JSON.parse(s.data().data || "{}"); calibresPlan = { calibres: p.calibres || [], calibreFamilles: p.calibreFamilles || {} }; if (tab === "saisie" && document.getElementById("lCal")) document.getElementById("lCal").innerHTML = calibresProposes().map(c => '<option value="' + esc(c) + '">').join(""); }catch(e){} } };
    db.collection("planStockage").doc("main").get({ source: "cache" }).then(lirePlan).catch(() => {})
      .then(() => db.collection("planStockage").doc("main").get()).then(lirePlan).catch(() => {});
  }

  let compteRefuse = false;
  auth.onAuthStateChanged(async user => {
    if (!user){ if (!compteRefuse) location.replace("index.html"); return; }
    me = { uid: user.uid, email: user.email || "" };
    let u = {};
    try{
      const d = await lireFiche(db.collection("users").doc(user.uid));
      if (!d.exists){ compteRefuse = true; bloquer("Compte non autorisé", "Compte non autorisé, contactez un administrateur."); await auth.signOut(); location.replace("index.html#non-autorise"); return; }
      u = d.data();
      roleMvt = ["viewer", "editor", "admin"].indexOf(u.roleMouvements) >= 0 ? u.roleMouvements : "none";
      rolePlan = (u.role === "admin" || u.role === "editor") ? u.role : "viewer";
    }catch(e){ console.warn(e); }
    // Responsable par défaut : la dernière valeur saisie sur ce poste par ce compte, sinon le nom du compte
    cleResp = "ll-responsable-" + user.uid;
    let r = ""; try{ r = localStorage.getItem(cleResp) || ""; }catch(e){}
    S.responsable = r || u.nom || String(user.email || "").split("@")[0];
    if (roleMvt === "none" && rolePlan !== "admin"){ bloquer("Accès non autorisé", "Votre compte n'a pas accès au module mouvements prestation. Demandez l'accès à un admin."); return; }
    demarrer();
  });
})();
</script>
