  :root{
    --bg: #E3DECF;
    --panel: #FBF9F3;
    --panel-2: #F1ECDE;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --line: #D2C9B4;
    --copper: #A85C2E;
    --copper-soft: #E6C9AE;
    --green: #4E6647;
    --green-soft: #DCE4D2;
    --warn: #A13B2F;
    --warn-soft: #F1D6CC;
    --blue: #3E5C76;
    --blue-soft: #D9E2EA;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(43,38,32,0.06), 0 4px 14px rgba(43,38,32,0.06);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  .wrap{ max-width: 1320px; margin: 0 auto; padding: 18px 14px 60px; }

  header.app-header{ display:flex; align-items:center; justify-content:space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:36px; height:36px; flex-shrink:0; }
  .brand h1{ font-family:'Fraunces', serif; font-weight:600; font-size: 20px; margin:0; letter-spacing:-0.01em; }
  .brand p{ margin:2px 0 0; color: var(--ink-soft); font-size: 12px; }
  .header-stats{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .stat-pill{ background: var(--panel); border:1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .stat-pill b{ font-family:'IBM Plex Mono', monospace; color: var(--ink); font-size: 12.5px; font-weight:600; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--copper); }
  .dot.green{ background: var(--green); }
  .refresh-btn{ background: var(--panel); border:1px solid var(--line); border-radius: 999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--ink-soft); }
  .refresh-btn.spin svg{ animation: spin .6s linear; }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  nav.tabs{ display:flex; gap:4px; margin-bottom: 16px; background: var(--panel-2); padding: 5px; border-radius: 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ font-family:'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 9px 14px; border:none; background: transparent; color: var(--ink-soft); border-radius: 8px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  nav.tabs button:hover{ color: var(--ink); }
  nav.tabs button.active{ background: var(--panel); color: var(--copper); box-shadow: var(--shadow); }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2{ font-family:'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0 0 4px; }
  .card .sub{ color: var(--ink-soft); font-size: 12.5px; margin: 0 0 14px; }

  .cellule-tabs{ display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .cellule-tabs button{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; padding:8px 12px; border-radius:7px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .cellule-tabs button.active{ background: var(--copper); border-color: var(--copper); color:#fff; }
  .cellule-tabs button .n{ opacity:.75; font-weight:500; }

  .stockage-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  .ligne-list{ display:flex; flex-direction:column; gap:10px; }
  .ligne-list-item{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; background:#fff; transition: border-color .15s ease; }
  .ligne-list-item:hover{ border-color: var(--copper); }
  .ligne-list-item .lli-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .ligne-list-item h3{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; margin:0; }
  .ligne-list-item .lli-count{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .fill-track{ height:12px; border-radius:6px; background: var(--panel-2); overflow:hidden; display:flex; }
  .fill-seg{ height:100%; flex-shrink:0; }
  .lli-produits{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .produit-chip{ font-family:'Inter', sans-serif; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; border:none; cursor:pointer; }
  .produit-chip:hover{ filter: brightness(1.1); }
  .lli-empty{ font-size:12px; color:var(--ink-soft); margin-top:8px; font-style:italic; }

  .grid-form{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid-form.wide-3{ grid-template-columns: repeat(3,1fr); }
  .grid-form.two{ grid-template-columns: repeat(2,1fr); }
  @media (max-width: 760px){ .grid-form, .grid-form.wide-3, .grid-form.two{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px){ .grid-form, .grid-form.wide-3, .grid-form.two{ grid-template-columns: 1fr; } }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size: 11.5px; font-weight:600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  label.field input, label.field select{ font-family:'Inter', sans-serif; font-size: 16px; font-weight: 500; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 10px; text-transform: none; letter-spacing: normal; }
  label.field input:focus, label.field select:focus{ outline:none; border-color: var(--copper); }
  label.field.span-2{ grid-column: span 2; }
  label.field.span-full{ grid-column: 1/-1; }
  @media (max-width:480px){ label.field.span-2{ grid-column: span 1; } }
  label.field .hint{ font-size:11px; text-transform:none; letter-spacing:normal; font-weight:500; color:var(--ink-soft); margin-top:2px; }

  .btn{ font-family:'Inter', sans-serif; font-weight: 700; font-size: 13.5px; cursor:pointer; border:none; border-radius: 8px; padding: 11px 18px; }
  .btn:active{ transform: scale(0.98); }
  .btn-copper{ background: var(--copper); color: #fff; }
  .btn-green{ background: var(--green); color: #fff; }
  .btn-warn{ background: var(--warn); color: #fff; }
  .btn-blue{ background: var(--blue); color: #fff; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }

  .overlay-bg{ display:none; position:fixed; inset:0; background: rgba(43,38,32,0.4); z-index:40; }

  .detail-panel{ position:fixed; top:0; right:0; height:100vh; height:100dvh; width:min(560px, 100vw); background: var(--panel); box-shadow: -8px 0 30px rgba(0,0,0,0.15); z-index:41; transform: translateX(100%); transition: transform .2s ease; overflow-y:auto; }

  .palox-weights .pw-item input[type=number]{ width:100%; font-family:'IBM Plex Mono'; font-size:12.5px; padding:6px 6px; border:1px solid var(--line); border-radius:6px; }

  .divider-label{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; font-weight:600; color: var(--ink-soft); text-transform:uppercase; letter-spacing: 0.08em; margin: 14px 0 10px; display:flex; align-items:center; gap:10px; }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin: 0 -16px; padding: 0 16px; }

  .config-cellule .cfg-head input:focus{ outline:1.5px solid var(--copper); background:#fff; }

  .consult-total span:first-child{ color: var(--ink-soft); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.04em; }

</style>

<body>
<div class="demo-banner">
  Aperçu de démonstration — les données ne sont pas sauvegardées (elles se réinitialisent si tu recharges la page)
  <div class="role-switch">
    <button data-demo-role="admin">Vue Admin</button>
    <button data-demo-role="editor" class="active">Vue Gestion</button>
    <button data-demo-role="viewer">Vue Consultation</button>
  </div>
</div>

<div class="wrap" id="mainWrap">
  <header class="app-header">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="24" cy="30" rx="13" ry="15" fill="#A85C2E"/>
        <ellipse cx="24" cy="30" rx="13" ry="15" fill="url(#g)" opacity="0.5"/>
        <path d="M24 15C22 9 20 6 17 3" stroke="#4E6647" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M24 15C25.5 9 27 6 30 3" stroke="#4E6647" stroke-width="2.5" stroke-linecap="round"/>
        <defs><linearGradient id="g" x1="11" y1="15" x2="37" y2="45"><stop stop-color="#D98B54"/><stop offset="1" stop-color="#8B4423"/></linearGradient></defs>
      </svg>
      <div>
        <h1>Plan de stockage</h1>
        <p>Partagé en temps réel · cellules et lignes</p>
      </div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="stockage" class="active">Stockage</button>
    <button data-tab="recherche">Recherche</button>
    <button data-tab="global">Stock global</button>
    <button data-tab="historique">Historique</button>
    <button data-tab="cellules" id="tabCellules">Cellules</button>
    <button data-tab="comptes" id="tabComptes">Comptes</button>
  </nav>

  <div id="app"><div class="loading">Chargement du plan…</div></div>
</div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="detail-panel" id="detailPanel"></div>

<script>
(function(){
  // Version d'aperçu : pas de Firebase, les données vivent uniquement dans cet onglet.
  let currentRole = 'editor';
  function canManageStock(){ return currentRole==='editor' || currentRole==='admin'; }
  function isAdmin(){ return currentRole==='admin'; }
  const demoAccounts = [
    { uid: 'demo-1', email: 'toi@lalegumiere.com', role: 'admin' },
    { uid: 'demo-2', email: 'chef-entrepot@lalegumiere.com', role: 'editor' },
    { uid: 'demo-3', email: 'commercial@lalegumiere.com', role: 'viewer' },
    { uid: 'demo-4', email: 'saisonnier@lalegumiere.com', role: 'editor' }
  ];

  // Chaque entrée de state.lots représente UN palox physique (pas un lot agrégé).
  // Plusieurs palox entrés ensemble partagent le même batchId, pour l'affichage groupé "par lot".
  let state = { cellules: [], lots: [], transactions: [] };
  let loaded = false;
  let currentTab = 'stockage';
  let currentCelluleId = null;
  let globalByCellule = false;
  const COLOR_PALETTE = ['#A85C2E','#4E6647','#3E5C76','#8B5FBF','#B0793E','#5C7A6E','#7A4B4B','#5A6B8C','#946846','#3F7161'];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){ const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}); }
  function fmt(n){ return (Math.round(n*100)/100).toString(); }
  function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function isPanelOpen(){ return document.getElementById('detailPanel').classList.contains('open'); }

  function applyIncomingState(raw){
    if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = { cellules:[], lots:[], transactions:[] }; } }
    migrate();
    if(!currentCelluleId || !getCellule(currentCelluleId)) currentCelluleId = state.cellules[0] ? state.cellules[0].id : null;
  }
  function seedDemoStock(){
    const c1 = state.cellules[0], c2 = state.cellules[1];
    function addBatch(celluleId, ligneId, produit, lotNum, count, poidsUnitaire, joursAvant, calibre, lot2){
      const batchId = uid();
      const d = new Date(); d.setDate(d.getDate()-(joursAvant||0));
      const dateStr = d.toISOString().slice(0,10);
      for(let i=0;i<count;i++){
        state.lots.push({ id: uid(), celluleId, ligneId, batchId, produit, lot: lotNum, lot2: lot2||'', parcelle:'', calibre: calibre||'', traitement:'', poids: poidsUnitaire, dateEntree: dateStr, commentaire:'' });
      }
    }
    addBatch(c1.id, c1.lignes[0].id, 'ECHALOTE', 'L167GB03', 14, 22, 3, '30/40');
    addBatch(c1.id, c1.lignes[0].id, 'ECHALION', 'L070EC12', 10, 20, 2, '40/60');
    addBatch(c1.id, c1.lignes[0].id, 'ECHALOTE DE SEMIS', 'L090ES01', 6, 19, 1, '30/40', 'L090ES02');
    addBatch(c1.id, c1.lignes[1].id, 'OIGNON ROUGE', 'L045RB12', 20, 21, 5, '60/80');
    addBatch(c1.id, c1.lignes[1].id, 'OIGNON JAUNE', 'L032OJ08', 16, 24.5, 1, '40/60');
    addBatch(c2.id, c2.lignes[0].id, 'OIGNON DE ROSCOFF', 'L011OR02', 9, 23, 0, '60/80');
    addBatch(c2.id, c2.lignes[0].id, 'ECHALOTE', 'L167GB04', 8, 22.5, 0, '30/40');
    const mixteBatch = uid();
    state.lots.push({ id: uid(), celluleId: c1.id, ligneId: c1.lignes[0].id, batchId: mixteBatch, produit: 'ECHALOTE', lot: 'L200MX01', lot2: 'L200MX02', parcelle:'', calibre:'30/40', traitement:'', poids: 14, poidsLot2: 6, dateEntree: today(), commentaire: 'palox mixte de démo' });
  }
  function startDemo(){
    seedDefault();
    applyIncomingState(null);
    seedDemoStock();
    loaded = true;
    render();
  }
  async function refetchState(){ /* aperçu : rien à resynchroniser, tout est local */ }
  let saveStatusTimer = null;
  function setSaveStatus(status){
    const el = document.getElementById('saveStatus');
    if(!el) return;
    clearTimeout(saveStatusTimer);
    if(status==='saving'){ el.textContent = 'Sauvegarde…'; el.style.color = 'var(--ink-soft)'; el.style.display='inline'; }
    else if(status==='ok'){ el.textContent = '✓ Sauvegardé'; el.style.color = 'var(--green)'; el.style.display='inline'; saveStatusTimer = setTimeout(()=>{ el.style.display='none'; }, 2000); }
  }
  async function saveState(){
    setSaveStatus('saving');
    await new Promise(r=>setTimeout(r, 200));
    setSaveStatus('ok');
  }
  function exportBackup(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sauvegarde-plan-stockage-'+today()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function importBackup(file){
    if(!canManageStock()){ alert('Réservé aux comptes de gestion.'); return; }
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.cellules){ alert('Fichier invalide : ce n\'est pas une sauvegarde reconnue.'); return; }
        if(!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
        state = parsed;
        migrate();
        await saveState();
        renderHeaderStats();
        renderTab(currentTab);
      }catch(e){ alert('Impossible de lire ce fichier : '+e.message); }
    };
    reader.readAsText(file);
  }
  async function manualRefresh(){
    const btn = document.getElementById('refreshBtn');
    if(btn) btn.classList.add('spin');
    const statusEl = document.getElementById('saveStatus');
    const hadPendingError = statusEl && statusEl.textContent.indexOf('⚠')===0;
    await refetchState();
    if(hadPendingError) saveState();
    setTimeout(()=>{ if(btn) btn.classList.remove('spin'); }, 500);
  }

  function migrate(){
    // Anciens modèles : ligne { positions, hauteurParPosition }, lot { position, hauteurDebut, nbPalox, poids total }.
    // Nouveau modèle : ligne { capacite }, lot = UN palox individuel { poids unitaire, batchId }.
    state.cellules.forEach(c=>{
      c.lignes.forEach(l=>{
        if(l.capacite==null){
          if(Array.isArray(l.hauteurParPosition)) l.capacite = l.hauteurParPosition.reduce((a,b)=>a+b,0) || 50;
          else l.capacite = 50;
        }
        delete l.positions; delete l.hauteurParPosition; delete l.hauteurMax;
      });
    });
    const expanded = [];
    state.lots.forEach(l=>{
      delete l.position; delete l.hauteurDebut;
      if(l.nbPalox!=null){
        const count = Math.max(1, Math.round(l.nbPalox));
        const perUnit = l.poids!=null ? l.poids/count : null;
        const batchId = l.batchId || l.id || uid();
        for(let i=0;i<count;i++){
          expanded.push({ id: i===0 ? (l.id||uid()) : uid(), celluleId: l.celluleId, ligneId: l.ligneId, batchId,
            produit: l.produit, lot: l.lot, parcelle: l.parcelle, calibre: l.calibre, traitement: l.traitement,
            poids: perUnit, dateEntree: l.dateEntree, commentaire: l.commentaire });
        }
      } else {
        if(!l.batchId) l.batchId = l.id;
        expanded.push(l);
      }
    });
    state.lots = expanded;
  }

  function seedDefault(){
    function ligne(nom, capacite){ return { id: uid(), nom, capacite }; }
    function cellule(nom, lignes){ return { id: uid(), nom, lignes }; }
    state.cellules = [
      cellule("Cellule 1", [ligne("Ligne 1",50), ligne("Ligne 2",50), ligne("Ligne 3",50)]),
      cellule("Cellule 2", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 3", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 4 LBP", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 5 LBP", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 6 LBP", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 7 LBP Colle Carotte", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Frigo 8 Cocaign", [ligne("Casiers",140)])
    ];
  }

  function getCellule(id){ return state.cellules.find(c=>c.id===id); }
  function getLigne(celluleId, ligneId){ const c = getCellule(celluleId); return c ? c.lignes.find(l=>l.id===ligneId) : null; }
  function lotsInLigne(celluleId, ligneId){ return state.lots.filter(l=>l.celluleId===celluleId && l.ligneId===ligneId); }
  function ligneOccupied(celluleId, ligneId){ return lotsInLigne(celluleId, ligneId).length; }
  function lignePercent(celluleId, ligneId){
    const l = getLigne(celluleId, ligneId);
    if(!l || !l.capacite) return 0;
    return (ligneOccupied(celluleId, ligneId) / l.capacite) * 100;
  }
  function paloxById(id){ return state.lots.find(l=>l.id===id); }
  function caseLabel(celluleId, ligneId){
    const c = getCellule(celluleId), l = getLigne(celluleId, ligneId);
    return (c?c.nom:'?') + " — " + (l?l.nom:'?');
  }
  function addTx(type, data){ state.transactions.unshift(Object.assign({ id: uid(), type, date: data.date || today() }, data)); }
  function totalPalox(){ return state.lots.length; }
  const FIXED_PRODUCT_COLORS = [
    { test: n=> n.includes('semis') && n.includes('echalote'), color: '#8E6BA8' },   // échalote de semis — mauve
    { test: n=> n.includes('echalion'), color: '#3D6C96' },                          // échalion — bleu
    { test: n=> n.includes('roscoff'), color: '#C97B94' },                           // oignon de roscoff — rose
    { test: n=> n.includes('rouge'), color: '#A83232' },                             // oignon rouge — rouge
    { test: n=> n.includes('jaune'), color: '#B8933A' },                             // oignon jaune — jaune
    { test: n=> n.includes('echalote'), color: '#8C8577' }                           // échalote — gris
  ];
  function normalizeProduitKey(produit){
    return (produit||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function colorForProduit(produit){
    const key = normalizeProduitKey(produit);
    for(let i=0;i<FIXED_PRODUCT_COLORS.length;i++){ if(FIXED_PRODUCT_COLORS[i].test(key)) return FIXED_PRODUCT_COLORS[i].color; }
    let h=0; for(let i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }
    return COLOR_PALETTE[h % COLOR_PALETTE.length];
  }
  function groupByBatch(lots){
    const map = {}, order = [];
    lots.forEach(l=>{
      const key = l.batchId+'|'+l.celluleId+'|'+l.ligneId;
      if(!map[key]){
        map[key] = { batchId:l.batchId, celluleId:l.celluleId, ligneId:l.ligneId, produit:l.produit, lot:l.lot, lot2:l.lot2,
          parcelle:l.parcelle, calibre:l.calibre, traitement:l.traitement, dateEntree:l.dateEntree, commentaire:l.commentaire, paloxs:[] };
        order.push(key);
      }
      map[key].paloxs.push(l);
    });
    return order.map(k=>map[k]);
  }
  function batchesInLigne(celluleId, ligneId){ return groupByBatch(lotsInLigne(celluleId, ligneId)); }
  function paloxTotalPoids(p){
    if(p.poids==null && p.poidsLot2==null) return null;
    return (p.poids||0) + (p.poidsLot2||0);
  }
  function batchPoidsSummary(batch){
    const known = batch.paloxs.filter(p=>paloxTotalPoids(p)!=null);
    const total = known.reduce((s,p)=>s+paloxTotalPoids(p),0);
    const unknown = batch.paloxs.length - known.length;
    return { total, unknown };
  }
  function produitBreakdownForLigne(celluleId, ligneId){
    const counts = {}, order = [];
    lotsInLigne(celluleId, ligneId).forEach(l=>{
      if(counts[l.produit]==null){ counts[l.produit]=0; order.push(l.produit); }
      counts[l.produit]++;
    });
    return order.map(p=>({ produit:p, count:counts[p] }));
  }

      (fmt(summary.total)+' kg');

      let poidsLabel;

      '<div class="palox-list">'+rows+'</div>'+

      (canManageStock() ? (
        '<div class="lot-actions">'+
          '<button class="btn btn-sm btn-warn" data-act="sortie" data-batch="'+batch.batchId+'">Sortir la sélection</button>'+

  function openLigneDetail(celluleId, ligneId, filterProduit){
    let batches = batchesInLigne(celluleId, ligneId);
    if(filterProduit){
      const norm = normalizeProduitKey(filterProduit);
      batches = batches.filter(b => normalizeProduitKey(b.produit)===norm);
    }
    const label = caseLabel(celluleId, ligneId);
    const l = getLigne(celluleId, ligneId);
    const occ = ligneOccupied(celluleId, ligneId);

    let lotsHtml = batches.length===0
      ? '<p style="color:var(--ink-soft);font-size:13.5px;">'+(filterProduit? 'Aucun palox de « '+escapeHtml(filterProduit)+' » ici pour le moment.' : 'Aucun palox ici pour le moment.')+'</p>'
      : batches.map(batchCardHtml).join('');

    const filterBarHtml = filterProduit ?
      '<div class="filter-bar">Filtré sur <b>'+escapeHtml(filterProduit)+'</b><button type="button" class="btn btn-ghost btn-sm" id="clearFilter">✕ Voir toute la ligne</button></div>' : '';

    const addSectionHtml = canManageStock() ?
        '<p style="font-size:12px;color:var(--ink-soft);">'+(l.capacite-occ)+' palox restants dans cette ligne. Pour ajouter du stock, utilise le bouton « + Entrée » dans l\'onglet Stockage.</p>'
      : '<div class="readonly-note">Consultation seule — contacte un compte de gestion pour modifier cette ligne.</div>';

    const panel = document.getElementById('detailPanel');
    panel.innerHTML =
      '<div class="detail-header"><button class="detail-close" id="closeDetail">×</button><h3>'+escapeHtml(label)+'</h3><p>'+occ+' / '+l.capacite+' palox · '+Math.round(lignePercent(celluleId,ligneId))+'% plein</p></div>'+
      '<div class="detail-body">'+
        filterBarHtml+
        lotsHtml+
        addSectionHtml+
      '</div>';
    panel.classList.add('open');
    document.getElementById('overlayBg').classList.add('open');
    panel.dataset.mode = 'ligne';
    panel.dataset.cellule = celluleId; panel.dataset.ligne = ligneId;
    panel.dataset.filterProduit = filterProduit || '';
    bindDetailEvents();

    const clearBtn = document.getElementById('clearFilter');
    if(clearBtn) clearBtn.addEventListener('click', ()=> openLigneDetail(celluleId, ligneId));
  }
  function closeDetail(){

  function paloxWeightInputsHtml(count, existing, hasLot2, lot1Label, lot2Label){
    existing = existing || [];
    let html = '';
    for(let i=0;i<count;i++){
      const data = existing[i] || {};
      html += '<div class="pw-item">'+
        '<span>'+(count>1? 'Palox '+(i+1) : 'Poids')+'</span>'+

        (hasLot2 ? '<input type="number" min="0" step="0.01" data-f="poidsLot2Individuel" data-idx="'+i+'" value="'+(data.poidsLot2!=null?data.poidsLot2:'')+'" placeholder="'+escapeHtml(lot2Label||'Lot 2')+' kg">' : '')+
      '</div>';
    }
    return html;
  }
  function resolvePaloxWeight(paloxState){
    paloxState = paloxState || {};
    const poids = paloxState.poids!=null ? parseFloat(paloxState.poids) : null;
    const poidsLot2 = paloxState.poidsLot2!=null ? parseFloat(paloxState.poidsLot2) : null;
    return { poids, poidsLot2 };

      const lot2Inp = item.querySelector('[data-f="poidsLot2Individuel"]');
      return {
        poids: poidsInp && poidsInp.value!==''? poidsInp.value : null,
        poidsLot2: lot2Inp && lot2Inp.value!==''? lot2Inp.value : null
      };

  function refreshPaloxWeightInputs(row, fixedCount){
    const nbInput = row.querySelector('[data-f="nbPalox"]');
    const lot2Input = row.querySelector('[data-f="lot2"]');
    const lotInput = row.querySelector('[data-f="lot"]');
    const weightsEl = row.querySelector('.palox-weights');
    if(!weightsEl || (fixedCount==null && !nbInput)) return;
    const existing = readPaloxWeightsState(weightsEl);
    const count = fixedCount!=null ? fixedCount : Math.min(500, Math.max(1, Math.round(parseFloat(nbInput.value)||1)));
    const hasLot2 = !!(lot2Input && lot2Input.value.trim());
    const lot1Label = lotInput ? lotInput.value.trim() : '';
    const lot2Label = lot2Input ? lot2Input.value.trim() : '';
    weightsEl.innerHTML = paloxWeightInputsHtml(count, existing, hasLot2, lot1Label, lot2Label);
  }

  function bindDetailEvents(){
    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    document.getElementById('overlayBg').addEventListener('click', closeDetail);

    document.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const batchId = btn.dataset.batch, act = btn.dataset.act;
        const card = btn.closest('.lot-card');
        const checked = Array.from(card.querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.dataset.palox);
        if(checked.length===0){
          alert('Sélectionne au moins un palox dans la liste ci-dessus.');
          return;
        }
        if(act==='supprimer'){
          if(!confirm('Supprimer définitivement '+checked.length+' palox sélectionné(s) ? Cette action ne peut pas être annulée.')) return;
          const idSet = new Set(checked);
          state.lots = state.lots.filter(l=>!idSet.has(l.id));
          await saveState();
          renderHeaderStats();
          openLigneDetail(document.getElementById('detailPanel').dataset.cellule, document.getElementById('detailPanel').dataset.ligne, document.getElementById('detailPanel').dataset.filterProduit || undefined);
          renderTab(currentTab);
          return;
        }
        const formEl = document.getElementById('form-'+act+'-'+batchId);
        if(act==='sortie') formEl.innerHTML = formSortieSelection(checked);
        else if(act==='deplacer') formEl.innerHTML = formDeplacerSelection(checked, card.dataset.cellule);
        else if(act==='modifier') formEl.innerHTML = formModifierSelection(checked);
        formEl.classList.add('open');
        formEl.dataset.selection = checked.join(',');
        bindSelectionFormEvents(formEl, act, card);
      });
    });
  }


  function bindSelectionFormEvents(formEl, act, card){
    const destCelSel = formEl.querySelector('[data-f="destCellule"]');
    if(destCelSel){
      destCelSel.addEventListener('change', ()=>{
        formEl.querySelector('[data-f="destLigne"]').innerHTML = ligneOptionsHtml(destCelSel.value);
      });
    }
    if(act==='modifier'){
      const row = formEl.querySelector('[data-modifier-row]');
      const selectionCount = (formEl.dataset.selection||'').split(',').filter(Boolean).length;
      formEl.addEventListener('input', (ev)=>{
        if(ev.target.matches('[data-f="lot2"]')) refreshPaloxWeightInputs(row, selectionCount);
      });
    }
    formEl.querySelector('[data-cancel-selection]').addEventListener('click', ()=>{
      formEl.classList.remove('open'); formEl.innerHTML='';
    });
    formEl.querySelector('[data-confirm-selection]').addEventListener('click', async ()=>{
      const ids = (formEl.dataset.selection||'').split(',').filter(Boolean);
      const paloxs = ids.map(paloxById).filter(Boolean);
      const msg = formEl.querySelector('#msg-selection');
      if(paloxs.length===0){ msg.textContent = '✗ Sélection invalide'; msg.className='msg err'; return; }
      const first = paloxs[0];
      const known = paloxs.filter(p=>paloxTotalPoids(p)!=null);
      const poidsTotal = known.length ? known.reduce((s,p)=>s+paloxTotalPoids(p),0) : null;

      if(act==='sortie'){
        const date = formEl.querySelector('[data-f="date"]').value;
        const comment = formEl.querySelector('[data-f="comment"]').value;
        addTx('sortie', { quantite: paloxs.length, poids: poidsTotal, produit: first.produit, lot: first.lot, date, commentaire: comment, label: caseLabel(first.celluleId, first.ligneId) });
        const idSet = new Set(ids);
        state.lots = state.lots.filter(l=>!idSet.has(l.id));
      } else if(act==='deplacer'){
        const date = formEl.querySelector('[data-f="date"]').value;
        const comment = formEl.querySelector('[data-f="comment"]').value;
        const destCelluleId = formEl.querySelector('[data-f="destCellule"]').value;
        const destLigneId = formEl.querySelector('[data-f="destLigne"]').value;
        const destLigneObj = getLigne(destCelluleId, destLigneId);
        const isSameSpot = destCelluleId===first.celluleId && destLigneId===first.ligneId;
        const destOccupied = ligneOccupied(destCelluleId, destLigneId) - (isSameSpot ? paloxs.length : 0);
        if(destOccupied + paloxs.length > destLigneObj.capacite){
          msg.textContent = '✗ Ne rentre pas à destination ('+(destLigneObj.capacite-destOccupied)+' palox restants)';
          msg.className = 'msg err';
          return;
        }
        if(isSameSpot){ msg.textContent = '✗ La destination est identique à la source'; msg.className='msg err'; return; }
        const fromLabel = caseLabel(first.celluleId, first.ligneId);
        paloxs.forEach(p=>{ p.celluleId = destCelluleId; p.ligneId = destLigneId; });
        addTx('deplacement', { quantite: paloxs.length, poids: poidsTotal, produit: first.produit, lot: first.lot, date, commentaire: comment,
          fromLabel: fromLabel, toLabel: caseLabel(destCelluleId, destLigneId) });
      } else if(act==='modifier'){
        const row = formEl.querySelector('[data-modifier-row]');
        const get = (f)=> row.querySelector('[data-f="'+f+'"]').value;
        const produit = get('produit').trim();
        if(!produit){ msg.textContent = '✗ Le produit est obligatoire'; msg.className='msg err'; return; }
        const lotVal = get('lot').trim();
        const lot2Val = get('lot2').trim();
        const parcelle = get('parcelle').trim();
        const calibre = get('calibre').trim();
        const traitement = get('traitement').trim();
        const dateEntree = get('dateEntree');
        const commentaire = get('commentaire').trim();
        const weightsEl = row.querySelector('.palox-weights');
        const paloxStates = weightsEl ? readPaloxWeightsState(weightsEl) : [];
        const newBatchId = uid();
        const idSet = new Set(ids);
        state.lots = state.lots.filter(l=>!idSet.has(l.id));
        paloxs.forEach((p,idx)=>{
          const { poids: poidsUnit, poidsLot2: poidsLot2Unit } = resolvePaloxWeight(paloxStates[idx]);
          state.lots.push({ id: p.id, celluleId: p.celluleId, ligneId: p.ligneId, batchId: newBatchId,
            produit, lot: lotVal, lot2: lot2Val, parcelle, calibre, traitement, poids: poidsUnit, poidsLot2: poidsLot2Unit, dateEntree, commentaire });
        });
      }
      await saveState();
      renderHeaderStats();
      openLigneDetail(document.getElementById('detailPanel').dataset.cellule, document.getElementById('detailPanel').dataset.ligne, document.getElementById('detailPanel').dataset.filterProduit || undefined);
      renderTab(currentTab);
    });
  }

  function bindBulkEvents(){
    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    document.getElementById('overlayBg').addEventListener('click', closeDetail);

    const rowsEl = document.getElementById('bulkRows');

    document.getElementById('addBulkRow').addEventListener('click', ()=>{
      bulkRowCounter++;
      const wrap = document.createElement('div');
      wrap.innerHTML = bulkRowHtml(bulkRowCounter);
      const row = wrap.firstElementChild;
      rowsEl.appendChild(row);
      row.querySelector('[data-f="ligne"]').innerHTML = ligneOptionsHtml(row.querySelector('[data-f="cellule"]').value);
    });

    rowsEl.addEventListener('click', (ev)=>{
      if(ev.target.matches('[data-remove-row]')) ev.target.closest('.entree-row').remove();
    });
    rowsEl.addEventListener('input', (ev)=>{
      if(ev.target.matches('[data-f="nbPalox"]') || ev.target.matches('[data-f="lot"]') || ev.target.matches('[data-f="lot2"]')) refreshPaloxWeightInputs(ev.target.closest('.entree-row'));
    });
    rowsEl.addEventListener('change', (ev)=>{
      if(ev.target.matches('[data-f="cellule"]')){
        const row = ev.target.closest('.entree-row');
        row.querySelector('[data-f="ligne"]').innerHTML = ligneOptionsHtml(ev.target.value);
      }
    });

    document.getElementById('bulkForm').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const dateVal = document.querySelector('[name="bulkDate"]').value;
      const rows = Array.from(rowsEl.querySelectorAll('.entree-row'));
      const msg = document.getElementById('bulkMsg');
      let applied = 0, errors = [];

      rows.forEach((row, idx)=>{
        const celluleId = row.querySelector('[data-f="cellule"]').value;
        const ligneId = row.querySelector('[data-f="ligne"]').value;
        const produit = row.querySelector('[data-f="produit"]').value.trim();
        const nbPalox = parseFloat(row.querySelector('[data-f="nbPalox"]').value);
        const ligneObj = getLigne(celluleId, ligneId);
        if(!produit){ errors.push('Ligne #'+(idx+1)+' : produit manquant'); return; }
        if(!nbPalox || nbPalox<1){ errors.push('Ligne #'+(idx+1)+' : quantité invalide'); return; }
        const count = Math.round(nbPalox);
        const used = ligneOccupied(celluleId, ligneId);
        if(used + count > ligneObj.capacite){ errors.push('Ligne #'+(idx+1)+' ('+ligneObj.nom+') : ne rentre pas, '+(ligneObj.capacite-used)+' palox restants'); return; }
        const lotVal = row.querySelector('[data-f="lot"]').value.trim();
        const lot2Val = row.querySelector('[data-f="lot2"]').value.trim();
        const parcelle = row.querySelector('[data-f="parcelle"]').value.trim();
        const calibre = row.querySelector('[data-f="calibre"]').value.trim();
        const traitement = row.querySelector('[data-f="traitement"]').value.trim();
        const weightsEl = row.querySelector('.palox-weights');
        const paloxStates = weightsEl ? readPaloxWeightsState(weightsEl) : [];
        const commentaire = row.querySelector('[data-f="commentaire"]').value.trim();
        const batchId = uid();
        const poidsKnown = [];
        for(let n=0;n<count;n++){
          const { poids: poidsUnit, poidsLot2: poidsLot2Unit } = resolvePaloxWeight(paloxStates[n]);
          if(poidsUnit!=null || poidsLot2Unit!=null) poidsKnown.push((poidsUnit||0) + (poidsLot2Unit||0));
          state.lots.push({ id: uid(), celluleId, ligneId, batchId, produit, lot: lotVal, lot2: lot2Val, parcelle, calibre, traitement, poids: poidsUnit, poidsLot2: poidsLot2Unit, dateEntree: dateVal, commentaire });
        }
        const poidsTotal = poidsKnown.length ? poidsKnown.reduce((a,b)=>a+b,0) : null;
        addTx('entree', { quantite: count, poids: poidsTotal, produit, lot: lotVal, lot2: lot2Val, date: dateVal, commentaire, label: caseLabel(celluleId,ligneId) });
        applied++;
      });

      await saveState();
      renderHeaderStats();
      if(errors.length===0){
        closeDetail();
        renderTab(currentTab);
      } else {
        msg.innerHTML = (applied>0 ? '✓ '+applied+' ligne(s) appliquée(s).<br>':'')+'⚠ '+errors.join('<br>⚠ ');
        msg.className = 'msg err';
        renderTab(currentTab);
      }
    });
  }

  function searchResultsHtml(filters){
    filters = filters || {};
    const q = (filters.q||'').toLowerCase().trim();
    const lotText = (filters.lot||'').toLowerCase().trim();
    let batches = groupByBatch(state.lots);
    if(filters.celluleId) batches = batches.filter(b=>b.celluleId===filters.celluleId);
    if(filters.produit) batches = batches.filter(b=>b.produit===filters.produit);
    if(filters.calibre) batches = batches.filter(b=>b.calibre===filters.calibre);
    if(lotText) batches = batches.filter(b=>(b.lot||'').toLowerCase().includes(lotText) || (b.lot2||'').toLowerCase().includes(lotText));
    if(q) batches = batches.filter(b => [b.produit,b.lot,b.lot2,b.parcelle,b.calibre,b.traitement].some(f => (f||'').toLowerCase().includes(q)));
    const anyFilter = q || filters.celluleId || filters.produit || filters.calibre || lotText;
    const totalPaloxCount = batches.reduce((s,b)=>s+b.paloxs.length,0);
    const totalKnown = batches.reduce((s,b)=>s+batchPoidsSummary(b).total,0);
    const totalUnknown = batches.reduce((s,b)=>s+batchPoidsSummary(b).unknown,0);
    const totalHtml = '<div class="consult-total"><span>Total affiché</span><span>'+totalPaloxCount+' palox · '+fmt(totalKnown)+' kg'+(totalUnknown>0?' connus ('+totalUnknown+' palox sans poids)':'')+'</span></div>';
    if(batches.length===0) return emptyState(anyFilter? "Aucun résultat" : "Aucun palox enregistré", anyFilter? "Essaie d'élargir tes critères." : "Filtre par cellule, produit, calibre, lot — ou tape une recherche libre.")+totalHtml;
    const rows = batches.map(b=>{
      const summary = batchPoidsSummary(b);
      const poidsStr = summary.total>0 ? (fmt(summary.total)+' kg'+(summary.unknown>0?' (partiel)':'')) : '—';
      return '<tr><td>'+escapeHtml(b.produit)+'</td><td class="mono">'+escapeHtml(b.lot||'—')+(b.lot2? ' + '+escapeHtml(b.lot2):'')+'</td>'+
        '<td>'+escapeHtml(b.parcelle||'—')+'</td><td>'+escapeHtml(b.calibre||'—')+'</td><td>'+escapeHtml(b.traitement||'—')+'</td>'+
        '<td class="mono">'+b.paloxs.length+'</td>'+
        '<td class="mono">'+poidsStr+'</td>'+
        '<td>'+escapeHtml(caseLabel(b.celluleId,b.ligneId))+'</td></tr>';
    }).join('');
    return '<div class="table-scroll"><table class="data"><thead><tr><th>Produit</th><th>Lot</th><th>Parcelle</th><th>Calibre</th><th>Traitement</th><th>Palox</th><th>Poids</th><th>Emplacement</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+totalHtml;
  }

  // ---------- STOCK GLOBAL ----------
  function globalStockGroups(byCellule){
    const map = {}, order = [];
    state.lots.forEach(l=>{
      const key = (byCellule ? l.celluleId+'|' : '') + l.produit + '|' + (l.calibre||'');
      if(!map[key]){
        map[key] = { celluleId: byCellule ? l.celluleId : null, produit: l.produit, calibre: l.calibre||'', count:0, poidsConnu:0, inconnu:0 };
        order.push(key);
      }
      map[key].count++;
      const tot = paloxTotalPoids(l);
      if(tot!=null) map[key].poidsConnu += tot; else map[key].inconnu++;
    });
    return order.map(k=>map[k]).sort((a,b)=>{
      if(byCellule){
        const nomA = getCellule(a.celluleId).nom, nomB = getCellule(b.celluleId).nom;
        if(nomA!==nomB) return nomA.localeCompare(nomB,'fr');
      }
      if(a.produit!==b.produit) return a.produit.localeCompare(b.produit,'fr');
      return (a.calibre||'').localeCompare(b.calibre||'','fr');
    });
  }

    const tableRows = rows.map(r=>{
      const isSelf = r.uid===selfUid;
      return '<tr><td>'+escapeHtml(r.email)+(isSelf? ' <span class="mono" style="color:var(--ink-soft);">(toi)</span>':'')+'</td>'+
        '<td><select data-role-select="'+r.uid+'" '+(isSelf?'disabled':'')+'>'+roleOpts(r.role)+'</select></td>'+
        '<td><span class="msg" id="msg-role-'+r.uid+'"></span></td></tr>';
    }).join('');
    el.innerHTML = '<div class="table-scroll"><table class="data"><thead><tr><th>Email</th><th>Rôle</th><th></th></tr></thead><tbody>'+tableRows+'</tbody></table></div>'+
      '<p class="sub" style="margin-top:10px;">Tu ne peux pas changer ton propre rôle depuis cette liste, pour éviter de te bloquer toi-même par erreur.</p>';
    document.querySelectorAll('[data-role-select]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const uid = sel.dataset.roleSelect;
        const acc = demoAccounts.find(a=>a.uid===uid);
        if(acc) acc.role = sel.value;
        const msg = document.getElementById('msg-role-'+uid);
        if(msg){ msg.textContent = '✓ mis à jour (démo, non persisté)'; msg.className = 'msg ok'; }
      });
    });
  }
  function bindTabEvents(tab){
    if(tab==='stockage'){
      document.querySelectorAll('#stockageCelluleTabs button').forEach(b=>{
        b.addEventListener('click', ()=>{ currentCelluleId = b.dataset.cellule; renderTab('stockage'); });
      });
      document.querySelectorAll('.ligne-list-item').forEach(row=>{
        row.addEventListener('click', ()=>{ openLigneDetail(row.dataset.cellule, row.dataset.ligne); });
      });
      document.querySelectorAll('[data-produit-jump]').forEach(btn=>{
        btn.addEventListener('click', (ev)=>{
          ev.stopPropagation();
          const [cId,lId,prod] = btn.dataset.produitJump.split('|');
          openLigneDetail(cId, lId, decodeURIComponent(prod));
        });
      });
      const bulkBtn = document.getElementById('openBulkEntree');
      if(bulkBtn) bulkBtn.addEventListener('click', openBulkEntreePanel);
    }
    if(tab==='recherche'){
      document.getElementById('searchInput').addEventListener('input', refreshSearchResults);
      document.getElementById('filterCellule').addEventListener('change', refreshSearchResults);
      document.getElementById('filterProduit').addEventListener('change', refreshSearchResults);
      document.getElementById('filterCalibre').addEventListener('change', refreshSearchResults);
      document.getElementById('filterLot').addEventListener('input', refreshSearchResults);
    }
    if(tab==='global'){
      document.querySelectorAll('[data-global-mode]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          globalByCellule = btn.dataset.globalMode==='cellule';
          renderTab('global');
        });
      });
    }
    if(tab==='cellules'){
      document.getElementById('exportBackupBtn').addEventListener('click', exportBackup);
      document.getElementById('importBackupInput').addEventListener('change', (ev)=>{
        if(ev.target.files && ev.target.files[0]) importBackup(ev.target.files[0]);
      });
      document.querySelectorAll('[data-cellule-nom]').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          getCellule(inp.dataset.celluleNom).nom = inp.value.trim() || 'Sans nom';
          await saveState(); renderTab('cellules');
        });
      });
      document.querySelectorAll('[data-ligne-nom]').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const [cId, lId] = inp.dataset.ligneNom.split('|');
          getLigne(cId,lId).nom = inp.value.trim() || 'Sans nom';
          await saveState(); renderTab('cellules');
        });
      });
      document.querySelectorAll('[data-ligne-cap]').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const [cId, lId] = inp.dataset.ligneCap.split('|');
          const newVal = Math.max(1, parseInt(inp.value)||1);
          const occ = ligneOccupied(cId, lId);
          if(newVal < occ){ alert('Impossible : cette ligne contient déjà '+occ+' palox.'); renderTab('cellules'); return; }
          getLigne(cId,lId).capacite = newVal;
          await saveState(); renderTab('cellules');
        });
      });
      document.querySelectorAll('[data-add-ligne]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const c = getCellule(btn.dataset.addLigne);
          c.lignes.push({ id: uid(), nom: 'Nouvelle ligne', capacite: 50 });
          await saveState(); renderTab('cellules');
        });
      });
      document.querySelectorAll('[data-del-ligne]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const [cId, lId] = btn.dataset.delLigne.split('|');
          if(state.lots.some(x=>x.celluleId===cId && x.ligneId===lId)){ alert('Cette ligne contient encore du stock, elle ne peut pas être supprimée.'); return; }
          if(!confirm('Supprimer cette ligne ?')) return;
          const c = getCellule(cId);
          c.lignes = c.lignes.filter(l=>l.id!==lId);
          await saveState(); renderTab('cellules');
        });
      });
      document.querySelectorAll('[data-del-cellule]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const cId = btn.dataset.delCellule;
          if(state.lots.some(x=>x.celluleId===cId)){ alert('Cette cellule contient encore du stock, elle ne peut pas être supprimée.'); return; }
          if(!confirm('Supprimer cette cellule ?')) return;
          state.cellules = state.cellules.filter(c=>c.id!==cId);
          if(currentCelluleId===cId) currentCelluleId = state.cellules[0] ? state.cellules[0].id : null;
          await saveState(); renderTab('cellules'); renderHeaderStats();
        });
      });
      document.getElementById('addCellule').addEventListener('click', async ()=>{
        const nom = prompt('Nom de la nouvelle cellule :', 'Nouvelle cellule');
        if(!nom) return;
        state.cellules.push({ id: uid(), nom: nom.trim(), lignes: [{ id: uid(), nom: 'Ligne 1', capacite: 50 }] });
        await saveState(); renderTab('cellules'); renderHeaderStats();
      });
    }
    if(tab==='comptes'){
      loadComptesList();
    }
  }

  document.getElementById('tabs').addEventListener('click', (ev)=>{
    const btn = ev.target.closest('button[data-tab]');
    if(btn) renderTab(btn.dataset.tab);
  });

  document.querySelectorAll('.role-switch [data-demo-role]').forEach(b=>{
    b.addEventListener('click', ()=>{
      currentRole = b.dataset.demoRole;
      renderHeaderStats();
      renderTab(currentTab);
    });
  });

  startDemo();
})();
</script>
</body>
</html>
