<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Légumière — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E3DECF; --panel: #FBF9F3; --ink: #2B2620; --ink-soft: #6B6355; --line: #D2C9B4;
    --copper: #963E88; --wave-1: #B23C92; --wave-2: #5B2A66; --warn: #A13B2F;
    --radius: 10px; --shadow: 0 1px 2px rgba(43,38,32,0.06), 0 4px 14px rgba(43,38,32,0.06);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; font-size:15px; line-height:1.5; min-height:100vh; }
  .hidden{ display:none !important; }

  /* Connexion (même présentation que le plan de stockage) */
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 24px; width:100%; max-width:360px; }
  .brand{ display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:4px; }
  .brand svg{ width:36px; height:36px; flex-shrink:0; }
  .brand-logo{ height:40px; width:auto; object-fit:contain; flex-shrink:0; }
  .login-card .brand{ flex-direction:column; gap:6px; text-align:center; }
  .login-card .brand-logo{ height:auto; width:100%; max-width:240px; border-radius:10px; }
  .brand h1{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; margin:0; letter-spacing:-0.01em; }
  .brand p{ margin:2px 0 0; color:var(--ink-soft); font-size:12px; }
  .brand-wave{ display:block; width:100%; height:14px; margin:2px 0 18px; }
  .login-card form{ display:flex; flex-direction:column; gap:12px; }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; }
  label.field input{ font-family:'Inter', sans-serif; font-size:16px; font-weight:500; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:10px; min-height:44px; text-transform:none; letter-spacing:normal; }
  label.field input:focus{ outline:none; border-color:var(--copper); }
  .btn{ font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; border:none; border-radius:8px; padding:11px 18px; min-height:44px; }
  .btn-copper{ background:var(--copper); color:#fff; width:100%; margin-top:4px; }
  .msg{ font-size:13px; font-weight:600; }
  .msg.err{ color:var(--warn); }

  /* Accueil */
  .home{ min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:28px; padding:24px 16px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); }
  .home > :first-child{ margin-top:auto; } .home > :last-child{ margin-bottom:auto; }
  .home h1{ font-family:'Fraunces', Georgia, serif; font-size:30px; font-weight:600; margin:0; text-align:center; }
  .home p.who{ margin:4px 0 0; color:var(--ink-soft); font-size:14px; text-align:center; overflow-wrap:anywhere; }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:18px; width:100%; max-width:1100px; }
  .tile{ text-align:left; border-radius:18px; padding:26px 24px; min-height:200px; display:flex; flex-direction:column; gap:10px; font-family:inherit; text-decoration:none; cursor:pointer; }
  a.tile:hover{ transform:translateY(-2px); }
  .tile:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .tile .ic{ width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .tile b{ font-size:22px; }
  .tile span.d{ font-size:14px; line-height:1.45; }
  .tile span.go{ margin-top:auto; font-weight:600; font-size:14px; }
  .tile.plan{ background:#FBF9F3; border:2px solid #963E88; color:#2B2620; }
  .tile.plan .ic{ background:#EAD7E6; } .tile.plan span.d{ color:#5C554A; } .tile.plan span.go{ color:#963E88; }
  .tile.rel{ background:#EEF3F3; border:2px solid #1F5C63; color:#13323A; }
  .tile.rel .ic{ background:#D3E8E9; } .tile.rel span.d{ color:#3E555B; } .tile.rel span.go{ color:#1F5C63; }
  .tile.adm{ background:#fff; border:2px solid #2B2620; color:#2B2620; }
  .tile.adm .ic{ background:#ECE8DE; } .tile.adm span.d{ color:#5C554A; } .tile.adm span.go{ color:#2B2620; }
  .tile.off{ opacity:.5; cursor:not-allowed; }
  .tile.off span.go{ color:#6B6355; }
  .badge{ display:inline-block; align-self:flex-start; padding:4px 8px; border-radius:7px; background:#F1D6CC; color:#6E1F17; font-size:12px; font-weight:700; }
  .foot{ font-size:13px; color:var(--ink-soft); text-align:center; max-width:620px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .logout{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); border-radius:8px; padding:0 16px; min-height:44px; font:600 14px 'Inter', sans-serif; cursor:pointer; }
  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-family:'Fraunces', serif; font-size:16px; }
  @media (max-width:640px){
    .tiles{ grid-template-columns:1fr; }
    .home{ justify-content:flex-start; } .home h1{ font-size:24px; }
    .tile{ min-height:0; padding:18px; } .tile b{ font-size:19px; }
  }
</style>
</head>

<main class="home hidden" id="homeScreen" aria-label="Choix de l'application"></main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';
  const firebaseConfig = {
    apiKey: "AIzaSyCE7V6RSx1akfJsFymsedaKe-uZPSrjps4",
    authDomain: "stockage-plan-temp-test.firebaseapp.com",
    projectId: "stockage-plan-temp-test",
    storageBucket: "stockage-plan-temp-test.firebasestorage.app",
    messagingSenderId: "1020932560553",
    appId: "1:1020932560553:web:02fad075d7ba49f65d7bb8"
  };
  firebase.initializeApp(firebaseConfig);
  // Base de TEST : bandeau d'avertissement, affiché seulement avec la configuration du projet de test
  (function(){ if(firebaseConfig.projectId!=='stockage-plan-temp-test') return; document.title='[TEST] '+document.title; var b=document.createElement('div'); b.id='bandeauTest'; b.setAttribute('role','note'); b.style.cssText='background:#B3261E;color:#fff;font:600 14px/1.35 Inter,Arial,sans-serif;text-align:center;padding:8px 12px;overflow-wrap:anywhere'; b.innerHTML='⚠ Version de TEST : les données ne sont pas réelles, ne pas s\'en servir pour le travail. Application réelle : <a href="https://fabianleg29.github.io/Plan_stockage_allium/" style="color:#fff;text-decoration:underline">fabianleg29.github.io/Plan_stockage_allium</a>'; document.body.insertBefore(b, document.body.firstChild); })();
  const auth = firebase.auth();
  const db = firebase.firestore();
  // Cache local Firestore (IndexedDB) : les données déjà vues sur ce poste (rôle, réglages, relevés) s'affichent
  // tout de suite au changement de page, puis sont mises à jour par le serveur. Vidé à la déconnexion (accueil).
  db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('Cache local indisponible', e && e.code));
  // Fiche users lue d'abord dans le cache local (immédiat), puis vérifiée auprès du serveur :
  // si le rôle a changé ou si la fiche n'existe plus, la page se recharge avec les bonnes valeurs.
  async function lireFiche(ref){
    let c = null; try{ c = await ref.get({ source: 'cache' }); }catch(e){}
    if (c && c.exists){
      const cle = x => [x.role || '', x.roleReleves || ''].join('|');
      ref.get({ source: 'server' }).then(s => { if (!s.exists || cle(s.data()) !== cle(c.data())) location.reload(); }).catch(() => {});
      return c;
    }
    return ref.get();
  }

  // Version de l'application : à changer à chaque mise à jour, pour que les liens de l'accueil
  // ouvrent la nouvelle version des modules au lieu d'une copie gardée en cache par le navigateur.
  const VERSION = '2026-10-20.7';
  const COMPTE_NON_AUTORISE = 'Compte non autorisé, contactez un administrateur';
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function show(id){ ['loadingScreen', 'loginScreen', 'homeScreen'].forEach(x => document.getElementById(x).classList.toggle('hidden', x !== id)); }
  function ajoutMois(d, n){ const x = new Date(d); x.setMonth(x.getMonth() + n); return x; }

  const ICONES = {
    plan: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#963E88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>',
    rel: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5C63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>',
    adm: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B2620" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 11h4M19 9v4"/></svg>'
  };

  function renderHome(user, role, roleReleves){
    const okR = roleReleves !== 'none', okP = role !== 'none';
    const okA = role === 'admin' || roleReleves === 'admin';
    const bloque = '<span class="go">Accès non autorisé – à demander à un admin</span>';
    const el = document.getElementById('homeScreen');
    el.innerHTML = '<div><h1>Que voulez-vous faire ?</h1><p class="who">Connecté : ' + esc(user.email || '') + ' – La Légumière</p></div>' +
      '<div class="tiles">' +
        (okP
          ? '<a class="tile plan" href="plan.html?v=' + VERSION + '"><span class="ic">' + ICONES.plan + '</span><b>Plan de stockage</b>' +
            '<span class="d">Échalotes et oignons : cellules, lignes, palox. Entrées, sorties, déplacements, recherche et stock global.</span><span class="go">Ouvrir le plan</span></a>'
          : '<div class="tile plan off" aria-disabled="true"><span class="ic">' + ICONES.plan + '</span><b>Plan de stockage</b>' +
            '<span class="d">Échalotes et oignons : cellules, lignes, palox. Entrées, sorties, déplacements, recherche et stock global.</span>' + bloque + '</div>') +
        (okR
          ? '<a class="tile rel" href="releves.html?v=' + VERSION + '"><span class="ic">' + ICONES.rel + '</span><b>Relevés des températures</b>' +
            '<span class="d">Tournée des chambres froides (T° et hygrométrie), contrôles à cœur des produits, historique du mois et export STOC E12.1.</span><span class="go">Ouvrir les relevés</span></a>'
          : '<div class="tile rel off" aria-disabled="true"><span class="ic">' + ICONES.rel + '</span><b>Relevés des températures</b>' +
            '<span class="d">Tournée des chambres froides (T° et hygrométrie), contrôles à cœur des produits, historique du mois et export STOC E12.1.</span>' + bloque + '</div>') +
        (okA
          ? '<a class="tile adm" href="admin.html?v=' + VERSION + '"><span class="ic">' + ICONES.adm + '</span><b>Administration</b>' +
            '<span class="d">Comptes et accès, réglages du plan de stockage et des relevés, archives et durées de conservation.</span><span id="archBadge"></span><span class="go">Ouvrir l\'administration</span></a>'
          : '') +
      '</div>' +
      '<div class="foot"><span>Un seul compte. Chaque module s\'ouvre selon les accès donnés à votre compte ; les comptes et réglages se gèrent dans Administration. On revient ici avec le bouton « Accueil ».</span>' +
        '<button type="button" class="logout" id="logoutBtn">Déconnexion</button></div>';
    // Déconnexion : on vide aussi le cache local du poste (poste partagé)
    document.getElementById('logoutBtn').addEventListener('click', async () => { await auth.signOut(); try{ await db.terminate(); await db.clearPersistence(); }catch(e){ console.warn(e); } location.reload(); });
    show('homeScreen');
    if (okA) verifierArchivage(role, roleReleves);
  }

  // Rappel « Archivage à faire » : lecture seule, en tâche de fond. Une lecture refusée n'affiche simplement rien.
  async function verifierArchivage(role, roleReleves){
    try{
      const cs = await db.collection('parametres').doc('conservation').get();
      const c = Object.assign({ relArchiveApresMois: 13, planArchiveApresMois: 0 }, cs.exists ? cs.data() : {});
      let afaire = false;
      if (c.relArchiveApresMois > 0){
        const lim = ajoutMois(new Date(), -c.relArchiveApresMois).toISOString();
        const q = await db.collection('releves').where('at', '<', lim).limit(1).get();
        if (!q.empty) afaire = true;
      }
      if (!afaire && role === 'admin' && c.planArchiveApresMois > 0){
        const lim = ajoutMois(new Date(), -c.planArchiveApresMois).toISOString().slice(0, 10);
        const snap = await db.collection('planStockage').doc('main').get();
        const p = snap.exists ? JSON.parse(snap.data().data || '{}') : {};
        if ((p.transactions || []).some(t => String(t.date || '') < lim)) afaire = true;
      }
      const b = document.getElementById('archBadge');
      if (b && afaire){ b.className = 'badge'; b.textContent = 'Archivage à faire'; }
    }catch(e){ console.warn('Rappel d\'archivage indisponible', e); }
  }

  document.getElementById('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = '';
    try{
      await auth.signInWithEmailAndPassword(email, password);
    }catch(e){
      msg.textContent = 'Connexion impossible : email ou mot de passe incorrect.';
    }
  });

  auth.onAuthStateChanged(async (user) => {
    if (!user){
      document.getElementById('loginPassword').value = '';
      // Arrivée depuis une autre page après refus d'un compte sans fiche users
      if (location.hash === '#non-autorise'){ document.getElementById('loginMsg').textContent = COMPTE_NON_AUTORISE; history.replaceState(null, '', location.pathname); }
      show('loginScreen');
      return;
    }
    show('loadingScreen');
    let role = 'viewer', roleReleves = 'none';
    try{
      const d = await lireFiche(db.collection('users').doc(user.uid));
      if (!d.exists){
        // Compte créé dans Authentication mais sans fiche users : refusé puis déconnecté
        await auth.signOut();
        document.getElementById('loginMsg').textContent = COMPTE_NON_AUTORISE;
        return;
      }
      const u = d.data();
      role = ['none', 'viewer', 'editor', 'admin'].indexOf(u.role) >= 0 ? u.role : 'viewer';
      roleReleves = ['viewer', 'editor', 'admin'].indexOf(u.roleReleves) >= 0 ? u.roleReleves : 'none';
    }catch(e){ console.warn('Lecture du rôle impossible', e); }
    renderHome(user, role, roleReleves);
  });
})();
</script>
</body>
</html>
