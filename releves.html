<script>
(function(){
  "use strict";
  const firebaseConfig = {
    apiKey: "AIzaSyCE7V6RSx1akfJsFymsedaKe-uZPSrjps4",
    authDomain: "stockage-plan-temp-test.firebaseapp.com",
    projectId: "stockage-plan-temp-test",
    storageBucket: "stockage-plan-temp-test.firebasestorage.app",
    messagingSenderId: "1020932560553",
    appId: "1:1020932560553:web:02fad075d7ba49f65d7bb8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const fdb = firebase.firestore();

  // Collections du module relevés (jamais planStockage/main) :
  //   temperatures/config : chambres et produits du contrôle à cœur (réglages, gérés dans Administration)
  //   releves             : un document par relevé, création seule, jamais modifié
  //   archives            : lue seulement pour signaler un mois archivé (lecture refusée = message simple)
  const RELEVES = fdb.collection("releves");
  const CONFIG_REF = fdb.collection("temperatures").doc("config");
  // Famille de chaque chambre : « legumes » (frigos légumes) ou « alliums » (cellules alliums).
  // Réglée par l'admin ; si le champ manque (anciens réglages), déduite du nom.
  const FRIGOS_LEGUMES=["lp1","lp2","lp3","lbp","zone prepa","cellule carotte"];
  function cleNom(n){ return String(n||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
  function familleParDefaut(nom){ return FRIGOS_LEGUMES.indexOf(cleNom(nom))>=0?"legumes":"alliums"; }
  function familleDe(f){ return f.famille==="legumes"||f.famille==="alliums"?f.famille:familleParDefaut(f.nom); }
  // Ordre d'affichage et de tournée : frigos légumes, puis cellules alliums (ordre des réglages conservé dans chaque groupe)
  function normaliserFrigos(l){ const x=l.map(f=>Object.assign({},f,{famille:familleDe(f)})); return x.filter(f=>f.famille==="legumes").concat(x.filter(f=>f.famille==="alliums")); }
  const FAMILLES=[["legumes","Frigos légumes"],["alliums","Cellules alliums"]];
  // Chambres de la fiche STOC E12.1, utilisées si temperatures/config n'existe pas encore
  const CHAMBRES_STOC = [["LP1",3,5],["LP2",6,12],["LP3",3,6],["LBP",2,4],["Zone prépa",6,14],
    ["Cellule 1",-0.5,1.5],["Cellule 2",-0.5,1.5],["Cellule 3",-0.5,1.5],["Cellule 4",-0.5,1.5],["Cellule 5",-0.5,1.5],
    ["Cellule 6",-0.5,1.5],["Cellule 7",0,1.5],["Cellule 8",0,1.5],["Cellule ail",-5,0],["Cellule carotte",0,1.5]]
    .map(c=>({ nom:c[0], famille:familleParDefaut(c[0]), min:c[1], max:c[2], hrMin:null, hrMax:null }));

  let roleReleves = "none", rolePlan = "viewer";
  let config = { frigos: [], produits: [], motifs: [] };
  let configLoaded = false;
  let currentMonthDocs = [];
  let histDocs = null, histUnsub = null, histErr = false, curErr = false;
  const archInfo = {}; // mois -> archive trouvée | false (aucune / lecture non autorisée)
  let tab = "frigo";
  let operateur = "";
  try { operateur = localStorage.getItem("ll-operateur") || ""; } catch(e){}
  const savedToday = new Set();

  const F = { lieu:null, etat:"service", temp:"", hr:"", choix:null, action:"", comment:"" };
  const P = { cellule:null, produit:null, lot:"", mesures:[""], choix:null, action:"", comment:"", filtre:"" };
  const H = { mois: monthKey(new Date()), type:"all", ko:false, vue:"tableau", focus:null, chambres:null, choixOuvert:false, edit:null };
  // Chambres affichées dans l'historique (null = toutes) : mémorisé sur le poste
  try { const c=JSON.parse(localStorage.getItem("ll-hist-chambres")||"null"); if(Array.isArray(c)) H.chambres=c; } catch(e){}

  const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function monthLabel(mk){ const [y,m]=mk.split("-"); return MOIS[+m-1]+" "+y; }
  function monthBounds(mk){ const [y,m]=mk.split("-").map(Number); return [new Date(y,m-1,1).toISOString(), new Date(y,m,1).toISOString()]; }
  function num(v){ if(v===null||v===undefined) return NaN; const n=parseFloat(String(v).replace(",",".").trim()); return Number.isFinite(n)?n:NaN; }
  function fin(n){ return Number.isFinite(n); }
  function fmtT(n){ return fin(n)?n.toFixed(1).replace(".",","):"–"; }
  function fmtH(n){ return fin(n)?Math.round(n)+" %":"–"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
  function hm(iso){ return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
  function isToday(iso){ return new Date(iso).toDateString()===new Date().toDateString(); }
  function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
  function banner(msg,info){ const b=document.getElementById("banner"); if(msg){b.textContent=msg;b.classList.toggle("info",!!info);b.classList.remove("hidden");} else b.classList.add("hidden"); }
  function saveOp(v){ operateur=v; try{localStorage.setItem("ll-operateur",v);}catch(e){} }
  function parseHr(v){ let n=num(v); if(fin(n)&&n>0&&n<=1.5) n=n*100; return n; }
  async function withRetry(fn){
    try { return await fn(); }
    catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); return await fn(); } throw e; }
  }
  function errMsg(e){
    if(!e) return "Erreur inconnue.";
    if(e.code==="permission-denied") return "Enregistrement refusé : votre rôle ne permet pas d'enregistrer des relevés.";
    if(e.code==="unauthenticated") return "Session expirée : revenez à l'accueil pour vous reconnecter.";
    if(e.code==="resource-exhausted") return "Quota Firebase atteint. Réessayez plus tard ou contactez l'administrateur.";
    if(e.code==="unavailable") return "Connexion indisponible. Vérifiez le réseau puis réessayez.";
    return "Enregistrement impossible ("+(e.code||"erreur")+").";
  }
  function lectureMsg(e){
    if(e&&e.code==="permission-denied") return "Lecture non autorisée pour votre compte. Demandez l'accès à un admin.";
    if(e&&e.code==="unavailable") return "Connexion indisponible : les données affichées peuvent ne pas être à jour.";
    return "Lecture des relevés impossible pour le moment"+(e&&e.code?" ("+e.code+")":"")+". Rechargez la page.";
  }
  function inRange(t,min,max){ if(!fin(t)) return null; if(fin(min)&&t<min) return false; if(fin(max)&&t>max) return false; return true; }
  function rangeTxt(min,max,u){ u=u||"°C"; const f=u==="%"?(x=>Math.round(x)):fmtT; const a=fin(min),b=fin(max);
    if(a&&b) return "entre "+f(min)+" et "+f(max)+" "+u; if(b) return "≤ "+f(max)+" "+u; if(a) return "≥ "+f(min)+" "+u; return "aucune limite définie"; }
  function rangeShort(min,max,u){ u=u||"°C"; const f=u==="%"?(x=>Math.round(x)):fmtT; const a=fin(min),b=fin(max);
    if(a&&b) return f(min)+" à "+f(max)+" "+u; if(b) return "≤ "+f(max)+" "+u; if(a) return "≥ "+f(min)+" "+u; return ""; }
  function fnum(x){ return x==null||x==="" ? NaN : num(x); }
  function telecharger(nom,data,type){ const b=new Blob([data],{type:type}), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nom; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }

  function opField(){
    return '<div class="card"><label class="f" for="op">Opérateur</label><input id="op" type="text" autocomplete="name" placeholder="Votre nom" value="'+esc(operateur)+'"></div>';
  }
  function bindOp(){ const o=document.getElementById("op"); if(o) o.addEventListener("input",e=>saveOp(e.target.value)); }

  function tempBlock(id,min,max,value){
    return '<div class="readout">'+
      '<button class="step" type="button" data-step="-0.1" data-for="'+id+'" aria-label="Baisser de 0,1">−</button>'+
      '<div class="tinput" id="'+id+'-box"><input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" placeholder="0,0" value="'+esc(value)+'" aria-label="Température en degrés"></div>'+
      '<button class="step" type="button" data-step="0.1" data-for="'+id+'" aria-label="Monter de 0,1">+</button></div>'+
      '<div class="scale" id="'+id+'-scale"><div class="zone"></div><div class="mark"></div></div>'+
      '<div class="scale-l"><span id="'+id+'-lo"></span><span>Cible : '+rangeTxt(min,max)+'</span><span id="'+id+'-hi"></span></div>';
  }
  function paintTemp(id,min,max){
    const inp=document.getElementById(id); if(!inp) return null;
    const t=num(inp.value), box=document.getElementById(id+"-box"), ok=inRange(t,min,max);
    box.classList.toggle("ok",ok===true); box.classList.toggle("ko",ok===false);
    const lo=(fin(min)?min:(fin(max)?max-8:-5))-4, hi=(fin(max)?max:(fin(min)?min+8:15))+4;
    const pct=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
    const sc=document.getElementById(id+"-scale"), zone=sc.querySelector(".zone"), mark=sc.querySelector(".mark");
    const zl=fin(min)?pct(min):0, zr=fin(max)?pct(max):100;
    zone.style.left=zl+"%"; zone.style.width=(zr-zl)+"%";
    if(fin(t)){ mark.style.display="block"; mark.style.left=pct(t)+"%"; } else mark.style.display="none";
    document.getElementById(id+"-lo").textContent=fmtT(lo)+"°";
    document.getElementById(id+"-hi").textContent=fmtT(hi)+"°";
    return ok;
  }
  function bindSteps(){
    document.querySelectorAll(".step").forEach(b=>b.addEventListener("click",()=>{
      const inp=document.getElementById(b.dataset.for); let t=num(inp.value); if(!fin(t)) t=0;
      t=Math.round((t+parseFloat(b.dataset.step))*10)/10; inp.value=fmtT(t); inp.dispatchEvent(new Event("input"));
    }));
  }
  function noConfig(what){
    return '<div class="card"><h2>Aucun '+what+' paramétré</h2><p class="hint">Un admin doit compléter la liste depuis l\'accueil, rubrique Administration.</p></div>';
  }
  function lastFrigo(lieu){ let l=null; for(const d of currentMonthDocs){ if(d.type==="frigo"&&d.lieu===lieu&&(!l||d.at>l.at)) l=d; } return l; }
  function doneToday(nom){ if(savedToday.has(nom)) return true; const l=lastFrigo(nom); return !!(l&&isToday(l.at)); }

  // ---------- Gestion des relevés (modification / suppression) ----------
  // Compte Gestion : ses propres relevés pendant 24 h. Admin relevés (ou admin du plan) : tous les relevés.
  // Chaque relevé garde son auteur (uid) et sa date de création serveur (creeLe), contrôlés par les règles Firestore.
  function auteur(){ const u=auth.currentUser; return { uid:u?u.uid:"", creeLe:firebase.firestore.FieldValue.serverTimestamp() }; }
  function estAdminRel(){ return roleReleves==="admin"||rolePlan==="admin"; }
  function peutGerer(d){
    if(estAdminRel()) return true;
    const u=auth.currentUser;
    return roleReleves==="editor"&&!!u&&d.uid===u.uid&&(Date.now()-new Date(d.at).getTime())<24*3600*1000;
  }
  function nul(x){ return x===undefined?null:x; }

  // ---------- Statut d'un relevé ----------
  // conforme : dans la cible ; normal : hors cible avec un motif accepté (pas d'action corrective, pas de contre-mesure) ;
  // ecart : hors cible sans motif accepté (action corrective obligatoire, puis contre-mesure). Anciens relevés sans
  // champ statut : déduit de conforme. Le champ conforme vaut false uniquement pour un écart.
  const MOTIFS_DEFAUT=["Dégivrage en cours","Chargement récent (produit en descente en température)","Porte ouverte (manutention)","Chambre en remise en route","Autre (préciser en remarque)"];
  function statutDe(d){ if(d.etat==="arret") return "arret"; if(d.statut==="conforme"||d.statut==="normal"||d.statut==="ecart") return d.statut; return d.conforme===false?"ecart":"conforme"; }
  function libelleStatut(st){ return ({conforme:"Conforme",normal:"Hors cible – normal",ecart:"Écart",arret:"Arrêt"})[st]; }
  function estAutre(m){ return /^autre/i.test(String(m||"").trim()); }
  // Contre-mesure à faire : écart du jour qui n'a pas été suivi d'un autre relevé (même chambre ; ou même cellule, produit et lot).
  // La mesure initiale (l'écart) est enregistrée d'abord, puis la contre-mesure est un nouveau relevé rattaché par contreMesureDe.
  function cleCM(d){ return d.type==="frigo"?"f|"+d.lieu:"p|"+d.lieu+"|"+d.produit+"|"+(d.lot||""); }
  function contreMesuresEnAttente(){ const dernier={}; for(const d of currentMonthDocs){ if(!isToday(d.at)) continue; const k=cleCM(d); if(!dernier[k]||d.at>dernier[k].at) dernier[k]=d; } return Object.values(dernier).filter(d=>statutDe(d)==="ecart").sort((a,b)=>a.at<b.at?-1:1); }
  function cmPour(type,lieu,produit,lot){ return contreMesuresEnAttente().find(d=>d.type===type&&d.lieu===lieu&&(type==="frigo"||(d.produit===produit&&(d.lot||"")===(lot||"")))); }
  function cmTexte(){ return '<span class="cm">Contre-mesure à faire</span>'; }
  function cmCarte(d){ return '<div class="card cmcard" id="cmcard"><h2>Contre-mesure</h2><p class="hint" style="margin:0 0 6px">Mesure initiale enregistrée à '+hm(d.at)+' : '+(d.temps||[d.temp]).map(fmtT).join(" / ")+' °C, écart'+(d.action?' (action : '+esc(d.action)+')':'')+'.</p>'+
    '<p class="hint" style="margin:0">Refaites la mesure et enregistrez-la ci-dessous : elle sera enregistrée à part et rattachée à cette mesure initiale.</p>'+
    '<button type="button" class="secondary" id="cmplustard" style="margin-top:10px">Faire la contre-mesure plus tard</button></div>'; }
  // Bloc « Hors cible : pourquoi ? » : un motif (situation normale) ou « Écart »
  function blocHorsCible(pre,choix){
    return '<div class="card hidden" id="'+pre+'-hc"><h2>Hors cible : pourquoi ?</h2><p class="hint">Situation normale : choisissez le motif (pas d\'action corrective, le prochain relevé se fera à la tournée suivante). Sinon, choisissez « Écart ».</p><div class="motifs">'+
      config.motifs.map((m,i)=>'<button type="button" class="pick mot" data-'+pre+'mot="'+i+'" aria-pressed="'+(choix===m)+'">'+esc(m)+'</button>').join("")+
      '<button type="button" class="pick mot ecart" data-'+pre+'mot="ecart" aria-pressed="'+(choix==="ecart")+'">Écart : action corrective</button></div></div>';
  }
  function lierHorsCible(pre,etat,update){
    document.querySelectorAll("[data-"+pre+"mot]").forEach(b=>b.addEventListener("click",()=>{
      const k=b.getAttribute("data-"+pre+"mot"); etat.choix=k==="ecart"?"ecart":config.motifs[+k];
      document.querySelectorAll("[data-"+pre+"mot]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); update();
    }));
  }

  // ---------- Frigos ----------
  function renderFrigo(){
    const v=document.getElementById("view");
    if(!configLoaded){ v.innerHTML='<p class="empty">Chargement…</p>'; return; }
    if(!config.frigos.length){ v.innerHTML=opField()+noConfig("frigo"); bindOp(); return; }
    const fr=config.frigos.find(f=>f.nom===F.lieu);
    const nbDone=config.frigos.filter(f=>doneToday(f.nom)).length;
    let h=opField();
    const nbCM=contreMesuresEnAttente().filter(d=>d.type==="frigo").length;
    h+='<div class="card"><h2>Chambre froide contrôlée</h2><p class="hint">'+nbDone+' sur '+config.frigos.length+' relevées aujourd\'hui.'+(nbCM?' <b class="cmtxt">'+nbCM+' contre-mesure'+(nbCM>1?"s":"")+' à faire.</b>':'')+'</p>';
    for(const [fam,titre] of FAMILLES){
      const liste=config.frigos.filter(f=>f.famille===fam); if(!liste.length) continue;
      h+='<h3 class="grp">'+titre+' <span>'+liste.filter(f=>doneToday(f.nom)).length+' / '+liste.length+'</span></h3><div class="grid">';
    for(const f of liste){
      const l=lastFrigo(f.nom);
      let sub;
      if(l&&isToday(l.at)) sub='<span class="done">Fait à '+hm(l.at)+(l.etat==="arret"?" (arrêt)":l.temp!=null?" : "+fmtT(l.temp)+" °C":"")+'</span>';
      else if(savedToday.has(f.nom)) sub='<span class="done">Fait</span>';
      else sub='<span>À relever – cible '+esc(rangeShort(fnum(f.min),fnum(f.max)))+'</span>';
      if(l&&isToday(l.at)&&statutDe(l)==="normal") sub+='<span class="nmtxt">Hors cible – normal</span>';
      const cmf=cmPour("frigo",f.nom); if(cmf) sub+=cmTexte();
      h+='<button type="button" class="pick" data-lieu="'+esc(f.nom)+'" aria-pressed="'+(F.lieu===f.nom)+'"><b>'+esc(f.nom)+'</b>'+sub+'</button>';
    }
      h+='</div>';
    }
    h+='</div>';
    if(fr){
      const hrMin=fnum(fr.hrMin), hrMax=fnum(fr.hrMax);
      const cm=cmPour("frigo",fr.nom); if(cm) h+=cmCarte(cm);
      h+='<div class="card"><h2>État de la chambre</h2><div class="etat">'+
        ['service','vide','arret'].map(e=>'<button type="button" data-etat="'+e+'" aria-pressed="'+(F.etat===e)+'">'+({service:"En service",vide:"Vide",arret:"À l'arrêt"})[e]+'</button>').join("")+'</div></div>';
      h+='<div id="mesures-f"><div class="card"><h2>Température</h2>'+tempBlock("tf",fnum(fr.min),fnum(fr.max),F.temp)+'<div class="status" id="tf-st"></div></div>';
      h+='<div class="card"><label class="f" for="hrf">Hygrométrie (facultatif)</label><p class="hint">'+(fin(hrMin)||fin(hrMax)?'Cible : '+rangeTxt(hrMin,hrMax,"%")+'.':'Humidité relative affichée par l\'hygromètre.')+'</p>'+
        '<div class="hr" id="hrf-box"><input id="hrf" type="text" inputmode="decimal" autocomplete="off" placeholder="–" value="'+esc(F.hr)+'" aria-label="Hygrométrie en pourcentage"><span>%</span></div><div class="status" id="hr-st"></div></div></div>';
      h+=blocHorsCible("f",F.choix);
      h+='<div class="card hidden" id="f-act"><label class="f" for="fa">Action corrective</label><p class="hint">Obligatoire en cas d\'écart : ce qui a été fait et qui a été prévenu.</p><textarea id="fa">'+esc(F.action)+'</textarea></div>';
      h+='<div class="card"><label class="f" for="fc">Remarques (facultatif)</label><textarea id="fc">'+esc(F.comment)+'</textarea></div>';
      h+='<button class="primary" type="button" id="fsave">Enregistrer le relevé</button><p class="err hidden" id="ferr"></p>';
    }
    v.innerHTML=h; bindOp();
    v.querySelectorAll(".pick[data-lieu]").forEach(b=>b.addEventListener("click",()=>{ if(F.lieu!==b.dataset.lieu){F.temp="";F.hr="";F.choix=null;F.action="";F.comment="";F.etat="service";} F.lieu=b.dataset.lieu; renderFrigo(); document.querySelector(".etat")&&document.querySelector(".etat").scrollIntoView({block:"start",behavior:"smooth"}); }));
    if(!fr) return;
    const min=fnum(fr.min), max=fnum(fr.max), hrMin=fnum(fr.hrMin), hrMax=fnum(fr.hrMax);
    const update=()=>{
      const arret=F.etat==="arret";
      document.getElementById("mesures-f").classList.toggle("hidden",arret);
      const ok=paintTemp("tf",min,max), st=document.getElementById("tf-st");
      st.className="status"+(ok===true?" ok":ok===false?" ko":""); st.textContent=ok===true?"Température conforme":ok===false?"Température hors cible":"";
      const hv=parseHr(F.hr), hok=inRange(hv,hrMin,hrMax), hb=document.getElementById("hrf-box"), hs=document.getElementById("hr-st");
      const hasHrLim=fin(hrMin)||fin(hrMax);
      hb.classList.toggle("ok",hasHrLim&&hok===true); hb.classList.toggle("ko",hasHrLim&&hok===false);
      hs.className="status"+(hasHrLim&&hok===false?" ko":""); hs.textContent=hasHrLim&&hok===false?"Hygrométrie hors cible":"";
      const horsCible=!arret&&(ok===false||(hasHrLim&&hok===false));
      document.getElementById("f-hc").classList.toggle("hidden",!horsCible);
      document.getElementById("f-act").classList.toggle("hidden",!(horsCible&&F.choix==="ecart"));
    };
    document.getElementById("tf").addEventListener("input",e=>{F.temp=e.target.value; update();});
    document.getElementById("hrf").addEventListener("input",e=>{F.hr=e.target.value; update();});
    bindSteps();
    v.querySelectorAll("[data-etat]").forEach(b=>b.addEventListener("click",()=>{ F.etat=b.dataset.etat; v.querySelectorAll("[data-etat]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); update(); }));
    lierHorsCible("f",F,update);
    const pt=document.getElementById("cmplustard"); if(pt) pt.addEventListener("click",()=>{ allerSuivante(fr.nom); renderFrigo(); window.scrollTo(0,0); });
    document.getElementById("fa").addEventListener("input",e=>F.action=e.target.value);
    document.getElementById("fc").addEventListener("input",e=>F.comment=e.target.value);
    document.getElementById("fsave").addEventListener("click",()=>saveFrigo(fr));
    update();
  }

  function allerSuivante(nom){
    const idx=config.frigos.findIndex(f=>f.nom===nom);
    const order=config.frigos.slice(idx+1).concat(config.frigos.slice(0,idx));
    const next=order.find(f=>!doneToday(f.nom));
    F.temp=""; F.hr=""; F.choix=null; F.action=""; F.comment=""; F.etat="service"; F.lieu=next?next.nom:null;
    return next;
  }
  // garde l'écart qui vient d'être enregistré dans la liste du jour, même avant le retour de Firestore
  function memoriser(id,doc){ if(!currentMonthDocs.some(x=>x._id===id)) currentMonthDocs.unshift(Object.assign({_id:id},doc)); }
  async function saveFrigo(fr){
    const err=document.getElementById("ferr"), btn=document.getElementById("fsave");
    const show=m=>{err.textContent=m;err.classList.remove("hidden");};
    err.classList.add("hidden");
    const min=fnum(fr.min), max=fnum(fr.max), hrMin=fnum(fr.hrMin), hrMax=fnum(fr.hrMax);
    const arret=F.etat==="arret";
    const t=num(F.temp), hrTxt=String(F.hr).trim(), hv=parseHr(F.hr);
    if(!operateur.trim()) return show("Indiquez le nom de l'opérateur.");
    if(!arret&&!fin(t)) return show("Saisissez la température relevée.");
    if(!arret&&hrTxt&&(!fin(hv)||hv<0||hv>100)) return show("L'hygrométrie doit être un pourcentage entre 0 et 100.");
    const tOk=arret?null:inRange(t,min,max);
    const hOk=arret||!hrTxt?null:inRange(hv,hrMin,hrMax);
    const horsCible=!arret&&(tOk===false||hOk===false);
    if(horsCible&&!F.choix) return show("Mesure hors cible : choisissez le motif, ou « Écart ».");
    const statut=!horsCible?"conforme":(F.choix==="ecart"?"ecart":"normal");
    const motif=statut==="normal"?F.choix:"";
    if(statut==="ecart"&&!F.action.trim()) return show("Décrivez l'action corrective.");
    if(statut==="normal"&&estAutre(motif)&&!F.comment.trim()) return show("Motif « Autre » : précisez-le dans les remarques.");
    const conforme=statut!=="ecart";
    const cm=cmPour("frigo",fr.nom);
    const now=new Date();
    const doc={ type:"frigo", lieu:fr.nom, etat:F.etat, produit:"", lot:"",
      temp:arret?null:t, temps:arret?[]:[t], hr:(!arret&&hrTxt)?Math.round(hv*10)/10:null,
      min:fin(min)?min:null, max:fin(max)?max:null, hrMin:fin(hrMin)?hrMin:null, hrMax:fin(hrMax)?hrMax:null,
      tempConforme:tOk!==false, hrConforme:hOk!==false, conforme, statut, motif, contreMesureDe:cm?cm._id:"",
      action:statut==="ecart"?F.action.trim():"", commentaire:F.comment.trim(), operateur:operateur.trim(), at:now.toISOString(), mois:monthKey(now), ...auteur() };
    btn.disabled=true;
    try{
      const ref=RELEVES.doc();
      await withRetry(()=>ref.set(doc));
      memoriser(ref.id,doc);
      savedToday.add(fr.nom);
      if(statut==="ecart"){
        // Mesure initiale enregistrée : on reste sur la chambre pour saisir la contre-mesure
        F.temp=""; F.hr=""; F.choix=null; F.action=""; F.comment=""; F.etat="service";
        toast("Écart enregistré. Saisissez maintenant la contre-mesure.");
        renderFrigo(); const c=document.getElementById("cmcard"); if(c) c.scrollIntoView({block:"start"});
        return;
      }
      const next=allerSuivante(fr.nom);
      toast((cm?"Contre-mesure enregistrée":statut==="normal"?"Relevé enregistré (hors cible – normal)":"Relevé enregistré")+(next?" – suivant : "+next.nom:" – tournée terminée"));
      renderFrigo();
      const tgt=next?document.querySelector(".etat"):null; if(tgt) tgt.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
    }catch(e){ show(errMsg(e)); btn.disabled=false; }
  }

  // ---------- Produits (contrôle à cœur) ----------
  function renderProduit(){
    const v=document.getElementById("view");
    if(!configLoaded){ v.innerHTML='<p class="empty">Chargement…</p>'; return; }
    if(!config.frigos.length){ v.innerHTML=opField()+noConfig("frigo ou cellule"); bindOp(); return; }
    if(!config.produits.length){ v.innerHTML=opField()+noConfig("produit"); bindOp(); return; }
    // Contrôle à cœur : seules les cellules de la famille Alliums sont proposées (réglage admin)
    const cellules=config.frigos.filter(f=>f.famille==="alliums");
    if(!cellules.length){ v.innerHTML=opField()+noConfig("cellule allium"); bindOp(); return; }
    if(P.cellule&&!cellules.some(f=>f.nom===P.cellule)) P.cellule=null;
    const pr=config.produits.find(p=>p.nom===P.produit);
    let h=opField();
    const cmsP=contreMesuresEnAttente().filter(d=>d.type==="produit");
    if(cmsP.length) h+='<div class="card cmcard"><h2>Contre-mesures à faire</h2>'+cmsP.map((d,i)=>'<button type="button" class="pick" data-cmp="'+i+'"><b>'+esc(d.produit)+' – '+esc(d.lieu)+'</b><span>'+(d.lot?'Lot '+esc(d.lot)+' – ':'')+'écart à '+hm(d.at)+' ('+(d.temps||[d.temp]).map(fmtT).join(" / ")+' °C)</span>'+cmTexte()+'</button>').join("")+'</div>';
    h+='<div class="card"><h2>Cellule alliums</h2><p class="hint">Seules les cellules alliums sont proposées pour le contrôle à cœur.</p><div class="grid">';
    for(const f of cellules) h+='<button type="button" class="pick" data-cel="'+esc(f.nom)+'" aria-pressed="'+(P.cellule===f.nom)+'"><b>'+esc(f.nom)+'</b></button>';
    h+='</div></div>';
    if(P.cellule){
      h+='<div class="card"><h2>Produit contrôlé</h2>';
      if(config.produits.length>8) h+='<input type="text" id="pfil" placeholder="Rechercher un produit" aria-label="Rechercher un produit" value="'+esc(P.filtre)+'" style="margin-bottom:10px">';
      h+='<div class="grid" id="pgrid"></div></div>';
    }
    if(P.cellule&&pr){
      h+='<div class="card"><label class="f" for="plot">N° de lot ou commande (facultatif)</label><input id="plot" type="text" value="'+esc(P.lot)+'"></div>';
      h+='<div class="card"><h2>Températures à cœur</h2><p class="hint">Cible pour ce produit : '+rangeTxt(fnum(pr.min),fnum(pr.max))+'.</p><div id="mes"></div><button type="button" class="link" id="addm">Ajouter une mesure</button><div class="status" id="p-st"></div></div>';
      const cmP=cmPour("produit",P.cellule,pr.nom,P.lot.trim()); if(cmP) h+=cmCarte(cmP);
      h+=blocHorsCible("p",P.choix);
      h+='<div class="card hidden" id="p-act"><label class="f" for="pa">Action corrective</label><p class="hint">Obligatoire en cas d\'écart : produit isolé, bloqué, refroidi, responsable prévenu…</p><textarea id="pa">'+esc(P.action)+'</textarea></div>';
      h+='<div class="card"><label class="f" for="pc">Remarques (facultatif)</label><textarea id="pc">'+esc(P.comment)+'</textarea></div>';
      h+='<button class="primary" type="button" id="psave">Enregistrer le contrôle</button><p class="err hidden" id="perr"></p>';
    }
    v.innerHTML=h; bindOp();
    v.querySelectorAll("[data-cel]").forEach(b=>b.addEventListener("click",()=>{ P.cellule=b.dataset.cel; P.choix=null; renderProduit(); }));
    v.querySelectorAll("[data-cmp]").forEach(b=>b.addEventListener("click",()=>{ const d=cmsP[+b.dataset.cmp]; P.cellule=d.lieu; P.produit=d.produit; P.lot=d.lot||""; P.mesures=[""]; P.choix=null; P.action=""; P.comment=""; renderProduit(); const m=document.getElementById("mes"); if(m) m.scrollIntoView({block:"center"}); }));
    if(!P.cellule) return;
    const drawGrid=()=>{
      const q=P.filtre.trim().toLowerCase(), list=config.produits.filter(p=>!q||p.nom.toLowerCase().includes(q)), g=document.getElementById("pgrid");
      g.innerHTML=list.length?list.map(p=>'<button type="button" class="pick" data-prod="'+esc(p.nom)+'" aria-pressed="'+(P.produit===p.nom)+'"><b>'+esc(p.nom)+'</b><span>'+esc(rangeShort(fnum(p.min),fnum(p.max))||"Sans limite")+'</span></button>').join(""):'<p class="empty">Aucun produit ne correspond.</p>';
      g.querySelectorAll("[data-prod]").forEach(b=>b.addEventListener("click",()=>{ P.produit=b.dataset.prod; P.choix=null; renderProduit(); }));
    };
    drawGrid();
    const fil=document.getElementById("pfil"); if(fil) fil.addEventListener("input",e=>{P.filtre=e.target.value; drawGrid();});
    if(!pr) return;
    const min=fnum(pr.min), max=fnum(pr.max);
    const update=()=>{
      let anyKo=false, anyVal=false;
      P.mesures.forEach((m,i)=>{ const ok=paintTemp("pm"+i,min,max); if(ok===false) anyKo=true; if(ok!==null) anyVal=true; });
      const st=document.getElementById("p-st");
      st.className="status"+(anyKo?" ko":anyVal?" ok":""); st.textContent=anyKo?"Au moins une mesure hors cible":anyVal?"Mesures conformes":"";
      document.getElementById("p-hc").classList.toggle("hidden",!anyKo);
      document.getElementById("p-act").classList.toggle("hidden",!(anyKo&&P.choix==="ecart"));
    };
    const drawMes=()=>{
      const box=document.getElementById("mes");
      box.innerHTML=P.mesures.map((m,i)=>'<div class="mesure"><div class="mh"><b>Mesure '+(i+1)+'</b>'+(P.mesures.length>1?'<button type="button" class="link" data-rm="'+i+'">Retirer</button>':'')+'</div>'+tempBlock("pm"+i,min,max,m)+'</div>').join("");
      P.mesures.forEach((m,i)=>document.getElementById("pm"+i).addEventListener("input",e=>{P.mesures[i]=e.target.value; update();}));
      box.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{P.mesures.splice(+b.dataset.rm,1); drawMes();}));
      bindSteps(); document.getElementById("addm").classList.toggle("hidden",P.mesures.length>=5); update();
    };
    drawMes();
    document.getElementById("addm").addEventListener("click",()=>{P.mesures.push(""); drawMes();});
    lierHorsCible("p",P,update);
    const ptp=document.getElementById("cmplustard"); if(ptp) ptp.addEventListener("click",()=>{ P.produit=null; P.lot=""; P.mesures=[""]; P.choix=null; P.action=""; P.comment=""; renderProduit(); window.scrollTo(0,0); });
    document.getElementById("plot").addEventListener("input",e=>P.lot=e.target.value);
    document.getElementById("pa").addEventListener("input",e=>P.action=e.target.value);
    document.getElementById("pc").addEventListener("input",e=>P.comment=e.target.value);
    document.getElementById("psave").addEventListener("click",()=>saveProduit(pr));
  }
  async function saveProduit(pr){
    const err=document.getElementById("perr"), btn=document.getElementById("psave");
    const show=m=>{err.textContent=m;err.classList.remove("hidden");};
    err.classList.add("hidden");
    const min=fnum(pr.min), max=fnum(pr.max), temps=P.mesures.map(num).filter(fin);
    if(!operateur.trim()) return show("Indiquez le nom de l'opérateur.");
    if(!temps.length||temps.length!==P.mesures.length) return show("Saisissez chaque température à cœur, ou retirez les mesures vides.");
    const horsCible=!temps.every(t=>inRange(t,min,max)!==false);
    if(horsCible&&!P.choix) return show("Mesure hors cible : choisissez le motif, ou « Écart ».");
    const statut=!horsCible?"conforme":(P.choix==="ecart"?"ecart":"normal");
    const motif=statut==="normal"?P.choix:"";
    if(statut==="ecart"&&!P.action.trim()) return show("Décrivez l'action corrective.");
    if(statut==="normal"&&estAutre(motif)&&!P.comment.trim()) return show("Motif « Autre » : précisez-le dans les remarques.");
    const conforme=statut!=="ecart";
    const cm=cmPour("produit",P.cellule,pr.nom,P.lot.trim());
    const now=new Date();
    const doc={ type:"produit", lieu:P.cellule, etat:"", produit:pr.nom, lot:P.lot.trim(), temps, temp:Math.max(...temps), hr:null,
      min:fin(min)?min:null, max:fin(max)?max:null, hrMin:null, hrMax:null, tempConforme:!horsCible, conforme, statut, motif, contreMesureDe:cm?cm._id:"", action:statut==="ecart"?P.action.trim():"", commentaire:P.comment.trim(), operateur:operateur.trim(), at:now.toISOString(), mois:monthKey(now), ...auteur() };
    btn.disabled=true;
    try{
      const ref=RELEVES.doc();
      await withRetry(()=>ref.set(doc));
      memoriser(ref.id,doc);
      if(statut==="ecart"){
        // Mesure initiale enregistrée : même cellule, produit et lot, pour saisir la contre-mesure
        P.mesures=[""]; P.choix=null; P.action=""; P.comment="";
        toast("Écart enregistré. Saisissez maintenant la contre-mesure.");
        renderProduit(); const c=document.getElementById("cmcard"); if(c) c.scrollIntoView({block:"start"});
        return;
      }
      P.produit=null; P.lot=""; P.mesures=[""]; P.choix=null; P.action=""; P.comment="";
      toast(cm?"Contre-mesure enregistrée":statut==="normal"?"Contrôle enregistré (hors cible – normal)":"Contrôle enregistré"); renderProduit(); window.scrollTo(0,0);
    }catch(e){ show(errMsg(e)); btn.disabled=false; }
  }

  // ---------- Historique ----------
  function moisQuery(mk){ const [a,b]=monthBounds(mk); return RELEVES.where("at",">=",a).where("at","<",b).orderBy("at","desc").limit(3000); }
  function histSource(){ return H.mois===monthKey(new Date())?currentMonthDocs:(histDocs||[]); }
  function loadHistMonth(){
    if(histUnsub){ histUnsub(); histUnsub=null; }
    histDocs=null; histErr=false;
    if(H.mois===monthKey(new Date())) return;
    histUnsub=moisQuery(H.mois).onSnapshot(s=>{ histDocs=s.docs.map(d=>Object.assign({_id:d.id},d.data())); if(tab==="hist") drawHist(); },
      e=>{ console.warn(e); histDocs=[]; histErr=lectureMsg(e); if(tab==="hist") drawHist(); });
  }
  // Mois archivé ? La collection archives est réservée aux admins : si la lecture est refusée,
  // on affiche simplement le message générique, sans erreur.
  function chercherArchive(mk){
    if(archInfo[mk]!==undefined) return;
    archInfo[mk]=false;
    fdb.collection("archives").where("type","==","releves").where("mois","array-contains",mk).limit(1).get()
      .then(s=>{ if(!s.empty){ archInfo[mk]=s.docs[0].data(); if(tab==="hist"&&H.mois===mk) drawHist(); } })
      .catch(()=>{ /* lecture non autorisée pour ce rôle : rien à signaler */ });
  }
  function filteredHist(){ return histVisible().filter(d=>(H.type==="all"||d.type===H.type)&&(!H.ko||statutDe(d)==="ecart")).slice().sort((a,b)=>a.at<b.at?1:-1); }
  function chambresDuMois(docs){
    const names=config.frigos.map(f=>f.nom);
    for(const d of docs) if(d.type==="frigo"&&!names.includes(d.lieu)) names.push(d.lieu);
    return names.filter(chambreVisible);
  }
  // ---- choix des chambres affichées (tableau, liste et export)
  function chambreVisible(nom){ return !H.chambres||H.chambres.indexOf(nom)>=0; }
  function histVisible(){ return histSource().filter(d=>chambreVisible(d.lieu)); }
  function chambresConnues(){ const n=config.frigos.map(f=>f.nom); for(const d of histSource()) if(!n.includes(d.lieu)) n.push(d.lieu); return n; }
  function nomsFamille(fam){ return config.frigos.filter(f=>f.famille===fam).map(f=>f.nom); }
  function groupeActif(){
    if(!H.chambres) return "all";
    const meme=l=>l.length===H.chambres.length&&l.every(n=>H.chambres.indexOf(n)>=0);
    return meme(nomsFamille("legumes"))?"legumes":meme(nomsFamille("alliums"))?"alliums":"";
  }
  function choisirChambres(liste){
    H.chambres=liste&&liste.length===chambresConnues().length&&chambresConnues().every(n=>liste.indexOf(n)>=0)?null:liste;
    try{ if(H.chambres) localStorage.setItem("ll-hist-chambres",JSON.stringify(H.chambres)); else localStorage.removeItem("ll-hist-chambres"); }catch(e){}
    H.focus=null; renderHist();
  }
  // Liste déroulante : toutes, une famille, ou une seule chambre
  function blocChambres(){
    const toutes=chambresConnues(), g=groupeActif(), une=H.chambres&&H.chambres.length===1?H.chambres[0]:null;
    const opt=(v,l,sel)=>'<option value="'+esc(v)+'"'+(sel?" selected":"")+'>'+esc(l)+'</option>';
    const groupe=(titre,noms)=>noms.length?'<optgroup label="'+esc(titre)+'">'+noms.map(n=>opt("c:"+n,n,une===n)).join("")+'</optgroup>':'';
    const leg=nomsFamille("legumes"), all=nomsFamille("alliums"), autres=toutes.filter(n=>leg.indexOf(n)<0&&all.indexOf(n)<0);
    return '<div class="chsel"><label class="f" for="hch">Chambres affichées</label><select id="hch">'+
      opt("all","Toutes les chambres",g==="all")+opt("legumes","Tous les frigos légumes",g==="legumes")+opt("alliums","Toutes les cellules alliums",g==="alliums")+
      (g===""&&!une?opt("","Sélection personnalisée",true):'')+
      groupe("Frigos légumes",leg)+groupe("Cellules alliums",all)+groupe("Autres chambres",autres)+'</select></div>';
  }
  function grilleMois(docs){
    // dernier relevé frigo par jour et par chambre
    const g={};
    for(const d of docs){ if(d.type!=="frigo") continue; const day=new Date(d.at).getDate(); const k=day+"|"+d.lieu; g[k+"|n"]=(g[k+"|n"]||0)+1; if(statutDe(d)==="ecart") g[k+"|e"]=true; if(!g[k]||d.at>g[k].at) g[k]=d; }
    return g;
  }
  function renderHist(){
    const v=document.getElementById("view");
    v.innerHTML='<div class="card"><div class="seg"><button type="button" data-vue="tableau" aria-pressed="'+(H.vue==="tableau")+'">Tableau du mois (frigos)</button><button type="button" data-vue="liste" aria-pressed="'+(H.vue==="liste")+'">Liste détaillée</button></div>'+
      '<div class="filters"><div><label class="f" for="hm">Mois</label><input id="hm" type="month" value="'+H.mois+'"></div>'+
      '<div id="htype-w"><label class="f" for="ht">Type</label><select id="ht"><option value="all">Tous les contrôles</option><option value="frigo">Frigos</option><option value="produit">Produits à cœur</option></select></div></div>'+
      '<label class="chk" id="hk-w"><input type="checkbox" id="hk"'+(H.ko?" checked":"")+'> Afficher seulement les écarts</label>'+
      blocChambres()+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="secondary" id="hx">Exporter le mois (Excel + graphiques)</button></div></div>'+
      '<div class="card"><div id="hsum" class="hint"></div><div class="scroll" id="htab"></div></div>';
    document.getElementById("ht").value=H.type;
    v.querySelectorAll("[data-vue]").forEach(b=>b.addEventListener("click",()=>{H.vue=b.dataset.vue; if(H.vue==="tableau"){ H.focus=null; if(H.retourChambres!==undefined){ H.chambres=H.retourChambres; H.retourChambres=undefined; } } renderHist();}));
    document.getElementById("htype-w").classList.toggle("hidden",H.vue==="tableau");
    document.getElementById("hk-w").classList.toggle("hidden",H.vue==="tableau");
    document.getElementById("hm").addEventListener("change",e=>{ if(e.target.value){H.mois=e.target.value; H.focus=null; loadHistMonth(); drawHist();} });
    document.getElementById("ht").addEventListener("change",e=>{H.type=e.target.value; drawHist();});
    document.getElementById("hk").addEventListener("change",e=>{H.ko=e.target.checked; drawHist();});
    document.getElementById("hx").addEventListener("click",exportMois);
    document.getElementById("hch").addEventListener("change",e=>{ const k=e.target.value; if(!k) return; H.retourChambres=undefined; choisirChambres(k==="all"?null:k.indexOf("c:")===0?[k.slice(2)]:nomsFamille(k)); });
    drawHist();
  }
  function drawHist(){
    const tabEl=document.getElementById("htab"); if(!tabEl) return;
    const courant=H.mois===monthKey(new Date());
    if(!courant&&histDocs===null){ tabEl.innerHTML='<p class="empty">Chargement…</p>'; return; }
    const errLecture=courant?curErr:histErr;
    if(errLecture){ document.getElementById("hsum").textContent=monthLabel(H.mois)+" :"; tabEl.innerHTML='<p class="empty">'+esc(errLecture)+'</p>'; return; }
    if(H.chambres&&!H.chambres.length){ document.getElementById("hsum").textContent=monthLabel(H.mois)+" :"; tabEl.innerHTML='<p class="empty">Aucune chambre sélectionnée : cochez au moins une chambre.</p>'; return; }
    const all=histVisible(), ko=all.filter(d=>statutDe(d)==="ecart").length, nm=all.filter(d=>statutDe(d)==="normal").length;
    document.getElementById("hsum").textContent=monthLabel(H.mois)+" : "+all.length+" contrôle"+(all.length>1?"s":"")+", dont "+ko+" écart"+(ko>1?"s":"")+(nm?" et "+nm+" hors cible normal"+(nm>1?"s":""):"")+".";
    if(!all.length){
      chercherArchive(H.mois);
      const arch=archInfo[H.mois];
      if(arch){ tabEl.innerHTML='<p class="empty">Ce mois a été archivé le '+new Date(arch.creeLe).toLocaleDateString("fr-FR")+'. Il reste consultable et exportable dans Administration, rubrique Archives et conservation.</p>'; return; }
    }
    if(H.vue==="tableau") return drawMonthTable(tabEl,all);
    if(H.edit){ const d=histSource().find(x=>x._id===H.edit); if(d&&peutGerer(d)) return drawEdit(tabEl,d); H.edit=null; }
    const rows=filteredHist(), gestion=rows.some(peutGerer);
    if(!rows.length){ tabEl.innerHTML='<p class="empty">Aucun contrôle pour cette sélection. Les relevés apparaîtront ici dès leur enregistrement.</p>'; return; }
    // Liste détaillée : colonnes regroupées ; boutons Modifier / Supprimer dans la dernière colonne, fixée au bord droit
    // (ordinateur) ; sur téléphone, chaque relevé devient une fiche (voir CSS table.liste).
    tabEl.innerHTML='<table class="liste"><thead><tr><th>Date</th><th>Chambre / produit</th><th>T° (°C)</th><th>Résultat</th><th>Opérateur</th><th>Action / remarques</th>'+(gestion?'<th class="acts"></th>':'')+'</tr></thead><tbody>'+
      rows.map(d=>{ const st=statutDe(d), orig=d.contreMesureDe?all.find(x=>x._id===d.contreMesureDe):null, rem=esc(d.action)+(d.commentaire?(d.action?'<br>':'')+'<span class="hint">'+esc(d.commentaire)+'</span>':'')+derniereModif(d);
        return '<tr id="r-'+esc(d._id)+'" class="'+(st==="ecart"?"ko":st==="normal"?"nm":"")+(H.focus&&d._id===H.focus?" focus":"")+'">'+
        '<td class="dt">'+fmtDate(d.at)+'<br><span class="hint">'+(d.type==="frigo"?"Frigo":"À cœur")+'</span></td>'+
        '<td class="lieu"><b>'+esc(d.lieu)+'</b>'+(d.produit?'<br>'+esc(d.produit):'')+(d.lot?'<br><span class="hint">Lot '+esc(d.lot)+'</span>':'')+'</td>'+
        '<td class="t">'+(d.etat==="arret"?"–":(d.temps||[d.temp]).map(fmtT).join(" / "))+(d.hr!=null?'<br><span class="hint">'+fmtH(d.hr)+'</span>':'')+'</td>'+
        '<td><span class="tag '+(st==="ecart"?"ko":st==="normal"?"nm":"ok")+'">'+libelleStatut(st)+'</span>'+(d.motif?'<br><span class="hint">'+esc(d.motif)+'</span>':'')+(d.contreMesureDe?'<br><span class="hint">Contre-mesure'+(orig?' de l\'écart de '+hm(orig.at):'')+'</span>':'')+(d.etat==="vide"?'<br><span class="hint">Chambre vide</span>':'')+'</td>'+
        '<td data-l="Opérateur">'+esc(d.operateur)+'</td>'+
        '<td class="rem"'+(rem?' data-l="Action / remarques"':'')+'>'+rem+'</td>'+
        (gestion?'<td class="acts">'+(peutGerer(d)?'<button type="button" class="mini" data-hmod="'+esc(d._id)+'">Modifier</button><button type="button" class="mini del" data-hdel="'+esc(d._id)+'">Supprimer</button>':'')+'</td>':'')+
        '</tr>'; }).join("")+'</tbody></table>';
    tabEl.querySelectorAll("[data-hmod]").forEach(b=>b.addEventListener("click",()=>{ H.edit=b.dataset.hmod; drawHist(); window.scrollTo(0,document.getElementById("htab").getBoundingClientRect().top+window.scrollY-80); }));
    tabEl.querySelectorAll("[data-hdel]").forEach(b=>b.addEventListener("click",()=>supprimerReleve(rows.find(x=>x._id===b.dataset.hdel))));
    if(H.focus){
      const row=document.getElementById("r-"+H.focus);
      if(row){ requestAnimationFrame(()=>row.scrollIntoView({block:"center",behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})); }
      if(!document.getElementById("hback")){
        const b=document.createElement("button"); b.type="button"; b.className="secondary back"; b.id="hback"; b.textContent="Revenir au tableau du mois";
        b.addEventListener("click",()=>{ H.focus=null; H.vue="tableau"; if(H.retourChambres!==undefined){ H.chambres=H.retourChambres; H.retourChambres=undefined; } renderHist(); });
        tabEl.parentNode.insertBefore(b,tabEl);
      }
    }
  }
  function derniereModif(d){
    const m=Array.isArray(d.modifications)&&d.modifications.length?d.modifications[d.modifications.length-1]:null;
    return m?'<br><span class="hint modif">Modifié le '+fmtDate(m.le)+' par '+esc(m.par)+' : '+esc(m.raison)+(d.modifications.length>1?' ('+d.modifications.length+' modifications)':'')+'</span>':'';
  }
  async function supprimerReleve(d){
    if(!d) return;
    const t=d.etat==="arret"?"arrêt":(d.temps||[d.temp]).map(fmtT).join(" / ")+" °C";
    if(!confirm("Supprimer définitivement ce relevé ?\n\n"+fmtDate(d.at)+" – "+d.lieu+(d.produit?" – "+d.produit:"")+" – "+t+"\n\nCette action est irréversible.")) return;
    try{ await RELEVES.doc(d._id).delete(); toast("Relevé supprimé"); }
    catch(e){ toast(e&&e.code==="permission-denied"?"Suppression refusée : vos droits ne le permettent pas (relevé de plus de 24 h ou d'un autre opérateur).":"Suppression impossible ("+(e.code||"erreur")+")"); }
  }
  // Écran de modification d'un relevé : valeurs corrigées, statut recalculé, raison obligatoire, valeurs d'avant conservées
  function drawEdit(el,d){
    const frigo=d.type==="frigo", st=statutDe(d), motifs=config.motifs.slice();
    if(d.motif&&motifs.indexOf(d.motif)<0) motifs.push(d.motif);
    const E={ etat:d.etat||"service", choix:st==="ecart"?"ecart":st==="normal"?d.motif:"" };
    el.innerHTML='<div class="edit"><h2>Modifier le relevé</h2><p class="hint">'+fmtDate(d.at)+' – '+(frigo?"Frigo":"À cœur")+' – '+esc(d.lieu)+(d.produit?' – '+esc(d.produit):'')+' – opérateur : '+esc(d.operateur)+'. Cible : '+rangeTxt(fnum(d.min),fnum(d.max))+'.</p>'+
      (frigo?'<label class="f">État</label><div class="etat" style="margin-bottom:12px">'+['service','vide','arret'].map(e=>'<button type="button" data-eetat="'+e+'" aria-pressed="'+(E.etat===e)+'">'+({service:"En service",vide:"Vide",arret:"À l'arrêt"})[e]+'</button>').join("")+'</div>':'')+
      '<div id="e-mes"><label class="f" for="et">'+(frigo?'Température (°C)':'Températures à cœur (°C), séparées par « / »')+'</label><input id="et" type="text" inputmode="decimal" value="'+esc((d.temps&&d.temps.length?d.temps:(d.temp!=null?[d.temp]:[])).map(fmtT).join(" / "))+'">'+
      (frigo?'<label class="f" for="eh" style="margin-top:10px">Hygrométrie (%), facultatif</label><input id="eh" type="text" inputmode="decimal" value="'+esc(d.hr!=null?String(d.hr).replace(".",","):"")+'">':'')+'</div>'+
      (!frigo?'<label class="f" for="el" style="margin-top:10px">N° de lot ou commande</label><input id="el" type="text" value="'+esc(d.lot||"")+'">':'')+
      '<div id="e-hc" class="hidden" style="margin-top:10px"><label class="f" for="ech">Hors cible : motif ou écart</label><select id="ech"><option value="">— Choisir —</option>'+motifs.map((m,i)=>'<option value="m'+i+'"'+(E.choix===m?" selected":"")+'>'+esc(m)+'</option>').join("")+'<option value="ecart"'+(E.choix==="ecart"?" selected":"")+'>Écart : action corrective</option></select></div>'+
      '<div id="e-act" class="hidden" style="margin-top:10px"><label class="f" for="ea">Action corrective</label><textarea id="ea">'+esc(d.action||"")+'</textarea></div>'+
      '<label class="f" for="ec" style="margin-top:10px">Remarques</label><textarea id="ec">'+esc(d.commentaire||"")+'</textarea>'+
      '<label class="f" for="er" style="margin-top:10px">Raison de la modification (obligatoire)</label><input id="er" type="text" placeholder="Ex. : erreur de saisie, mauvaise chambre…">'+
      '<div class="edit-bts"><button type="button" class="primary" id="esave">Enregistrer la modification</button><button type="button" class="secondary" id="ecancel">Annuler</button></div><p class="err hidden" id="eerr"></p>'+
      (Array.isArray(d.modifications)&&d.modifications.length?'<p class="hint" style="margin-top:10px">Modifications précédentes : '+d.modifications.map(m=>fmtDate(m.le)+' par '+esc(m.par)+' ('+esc(m.raison)+')').join(" ; ")+'</p>':'')+'</div>';
    const g=id=>document.getElementById(id);
    const lire=()=>{
      const arret=frigo&&E.etat==="arret";
      const temps=arret?[]:String(g("et").value).split("/").map(x=>num(x));
      const hrTxt=frigo?String(g("eh").value).trim():"", hv=parseHr(hrTxt);
      const tOk=arret?null:(temps.every(fin)&&temps.length?temps.every(t=>inRange(t,fnum(d.min),fnum(d.max))!==false):null);
      const hOk=!frigo||arret||!hrTxt?null:inRange(hv,fnum(d.hrMin),fnum(d.hrMax));
      return { arret, temps, hrTxt, hv, tOk, hOk, horsCible:!arret&&(tOk===false||hOk===false) };
    };
    const maj=()=>{ const L=lire(); g("e-mes").classList.toggle("hidden",L.arret); g("e-hc").classList.toggle("hidden",!L.horsCible); g("e-act").classList.toggle("hidden",!(L.horsCible&&E.choix==="ecart")); };
    el.querySelectorAll("[data-eetat]").forEach(b=>b.addEventListener("click",()=>{ E.etat=b.dataset.eetat; el.querySelectorAll("[data-eetat]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); maj(); }));
    g("et").addEventListener("input",maj); if(frigo) g("eh").addEventListener("input",maj);
    g("ech").addEventListener("change",e=>{ const v=e.target.value; E.choix=v==="ecart"?"ecart":v?motifs[+v.slice(1)]:""; maj(); });
    g("ecancel").addEventListener("click",()=>{ H.edit=null; drawHist(); });
    g("esave").addEventListener("click",async()=>{
      const err=g("eerr"), show=m=>{ err.textContent=m; err.classList.remove("hidden"); }; err.classList.add("hidden");
      const L=lire(), raison=g("er").value.trim(), action=g("ea").value.trim(), commentaire=g("ec").value.trim();
      if(!L.arret&&(!L.temps.length||!L.temps.every(fin))) return show(frigo?"Saisissez la température.":"Saisissez chaque température à cœur, séparées par « / ».");
      if(frigo&&!L.arret&&L.hrTxt&&(!fin(L.hv)||L.hv<0||L.hv>100)) return show("L'hygrométrie doit être un pourcentage entre 0 et 100.");
      if(L.horsCible&&!E.choix) return show("Mesure hors cible : choisissez le motif, ou « Écart ».");
      const statut=!L.horsCible?"conforme":(E.choix==="ecart"?"ecart":"normal"), motif=statut==="normal"?E.choix:"";
      if(statut==="ecart"&&!action) return show("Décrivez l'action corrective.");
      if(statut==="normal"&&estAutre(motif)&&!commentaire) return show("Motif « Autre » : précisez-le dans les remarques.");
      if(!raison) return show("Indiquez la raison de la modification.");
      const u=auth.currentUser;
      const avant={ etat:nul(d.etat), temp:nul(d.temp), temps:nul(d.temps), hr:nul(d.hr), lot:nul(d.lot), statut:st, motif:nul(d.motif)||"", action:nul(d.action)||"", commentaire:nul(d.commentaire)||"" };
      const upd={ temp:L.arret?null:(frigo?L.temps[0]:Math.max(...L.temps)), temps:L.temps, conforme:statut!=="ecart", statut, motif, action:statut==="ecart"?action:"", commentaire,
        modifications:firebase.firestore.FieldValue.arrayUnion({ le:new Date().toISOString(), par:(u&&u.email)||"", raison, avant }) };
      if(frigo){ upd.etat=E.etat; upd.hr=(!L.arret&&L.hrTxt)?Math.round(L.hv*10)/10:null; upd.tempConforme=L.tOk!==false; upd.hrConforme=L.hOk!==false; }
      else { upd.lot=g("el").value.trim(); upd.tempConforme=L.tOk!==false; }
      g("esave").disabled=true;
      try{ await RELEVES.doc(d._id).update(upd); H.edit=null; H.focus=d._id; toast("Relevé modifié"); drawHist(); }
      catch(e){ show(e&&e.code==="permission-denied"?"Modification refusée : vos droits ne le permettent pas (relevé de plus de 24 h ou d'un autre opérateur).":errMsg(e)); g("esave").disabled=false; }
    });
    maj();
  }
  function drawMonthTable(el,docs){
    const chs=chambresDuMois(docs);
    if(!chs.length){ el.innerHTML='<p class="empty">Aucune chambre paramétrée.</p>'; return; }
    const [y,m]=H.mois.split("-").map(Number), nd=new Date(y,m,0).getDate(), g=grilleMois(docs);
    const cfg=n=>config.frigos.find(f=>f.nom===n)||{};
    let h='<table class="month"><thead><tr><th>Date</th>'+chs.map(n=>{const c=cfg(n); return '<th>'+esc(n)+'<small>'+esc(rangeShort(fnum(c.min),fnum(c.max)))+'</small></th>';}).join("")+'</tr></thead><tbody>';
    for(let d=1; d<=nd; d++){
      const dt=new Date(y,m-1,d), we=dt.getDay()===0||dt.getDay()===6;
      h+='<tr class="'+(we?"we":"")+'"><td>'+dt.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit"})+'</td>';
      for(const n of chs){
        const r=g[d+"|"+n];
        if(!r){ h+='<td></td>'; continue; }
        const ra=' data-rid="'+esc(r._id)+'" data-ch="'+esc(n)+'" tabindex="0" role="button" aria-label="'+esc(n)+', '+dt.toLocaleDateString("fr-FR")+' : voir le détail"';
        if(r.etat==="arret"){ h+='<td class="st"'+ra+' title="'+esc(r.operateur)+'">Arrêt</td>'; continue; }
        const st=statutDe(r), nb=g[d+"|"+n+"|n"]||1;
        const tip=hm(r.at)+" – "+r.operateur+(r.motif?" – Hors cible normal : "+r.motif:"")+(r.commentaire?" – "+r.commentaire:"")+(r.action?" – Action : "+r.action:"");
        h+='<td class="c'+(st==="ecart"?" ko":st==="normal"?" nm":"")+'"'+ra+' title="'+esc(tip)+'">'+fmtT(r.temp)+(r.hr!=null?'<small>'+fmtH(r.hr)+'</small>':'')+(r.etat==="vide"?'<small>Vide</small>':'')+(st==="normal"?'<small>Normal</small>':'')+(nb>1?'<small>'+nb+' mesures'+(g[d+"|"+n+"|e"]&&st!=="ecart"?', écart':'')+'</small>':'')+'</td>';
      }
      h+='</tr>';
    }
    el.innerHTML=h+'</tbody></table><p class="hint" style="margin-top:8px">Touchez une case pour ouvrir le relevé dans la liste détaillée. Rouge : écart. Orange : hors cible – normal (motif). Quand il y a plusieurs mesures dans la journée, la case montre la dernière.</p>';
    el.querySelectorAll("td[data-rid]").forEach(td=>{
      // ouvre la liste détaillée filtrée sur cette chambre (sans changer le choix mémorisé), ligne mise en évidence
      const go=()=>{ if(H.retourChambres===undefined) H.retourChambres=H.chambres; H.chambres=[td.dataset.ch]; H.focus=td.dataset.rid; H.vue="liste"; H.type="all"; H.ko=false; renderHist(); };
      td.addEventListener("click",go);
      td.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    });
  }
  function exportMois(){
    const docs=histVisible().slice().sort((a,b)=>a.at<b.at?-1:1);
    if(!window.XlsxReleves){ toast("Export Excel indisponible"); return; }
    if(H.chambres&&!H.chambres.length){ toast("Aucune chambre sélectionnée"); return; }
    try{
      const data=window.XlsxReleves.construire(docs, config.frigos.filter(f=>chambreVisible(f.nom)), { mois:H.mois, periode:monthLabel(H.mois) });
      telecharger("STOC_E12.1_Releve_T_chambres_froides_"+H.mois+".xlsx", data, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    }catch(e){ console.error(e); toast("Export impossible"); }
  }

  // ---------- navigation ----------
  function setTab(t){ tab=t; document.body.classList.toggle("hist",t==="hist"); document.querySelectorAll("nav.rtabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t))); render(); window.scrollTo(0,0); }
  function render(){ if(tab==="frigo") renderFrigo(); else if(tab==="produit") renderProduit(); else renderHist(); }
  document.querySelectorAll("nav.rtabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

  function bloquer(titre, texte){
    document.getElementById("rtabs").classList.add("hidden");
    document.getElementById("view").innerHTML='<div class="card"><h2>'+esc(titre)+'</h2><p class="hint">'+esc(texte)+'</p><a class="secondary" style="display:inline-flex;align-items:center;text-decoration:none" href="index.html">Retour à l\'accueil</a></div>';
  }

  function demarrer(){
    if(roleReleves==="viewer"){
      tab="hist"; document.body.classList.add("hist");
      document.getElementById("rtabs").classList.add("lecture");
      document.querySelectorAll("nav.rtabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab==="hist")));
      banner("Rôle Consultation : historique en lecture seule. La saisie des relevés est réservée aux rôles Gestion et Admin.",true);
    }
    render();
    const peutConfigurer = roleReleves==="admin" || rolePlan==="admin";
    CONFIG_REF.onSnapshot(s=>{
      const d=s.exists?s.data():null;
      if(!d){
        // Première utilisation : chambres de la fiche STOC E12.1. Un admin enregistre cette liste de départ.
        config={ frigos:normaliserFrigos(CHAMBRES_STOC), produits:[], motifs:MOTIFS_DEFAUT.slice() };
        if(peutConfigurer) CONFIG_REF.set({ frigos:CHAMBRES_STOC, produits:[], motifs:MOTIFS_DEFAUT }).catch(e=>console.warn("Initialisation des réglages impossible",e));
      } else {
        config={ frigos:normaliserFrigos(Array.isArray(d.frigos)?d.frigos:[]), produits:Array.isArray(d.produits)?d.produits:[],
          motifs:Array.isArray(d.motifs)&&d.motifs.length?d.motifs:MOTIFS_DEFAUT.slice() };
      }
      configLoaded=true; render();
    },e=>{ console.warn(e); config={ frigos:normaliserFrigos(CHAMBRES_STOC), produits:[], motifs:MOTIFS_DEFAUT.slice() }; configLoaded=true; banner("Réglages des relevés illisibles : liste des chambres par défaut affichée. "+lectureMsg(e)); render(); });
    moisQuery(monthKey(new Date())).onSnapshot(s=>{
      curErr=false;
      currentMonthDocs=s.docs.map(d=>Object.assign({_id:d.id},d.data()));
      if(tab==="hist") drawHist(); else if(tab==="frigo"&&!F.lieu) renderFrigo();
    },e=>{ console.warn(e); curErr=lectureMsg(e); currentMonthDocs=[]; if(tab==="hist") drawHist(); });
  }

  let compteRefuse=false;
  auth.onAuthStateChanged(async user=>{
    if(!user){ if(!compteRefuse) location.replace("index.html"); return; }
    try{
      const d=await fdb.collection("users").doc(user.uid).get();
      // Compte sans fiche users : refusé, déconnexion et retour à l'accueil avec le message
      if(!d.exists){ compteRefuse=true; bloquer("Compte non autorisé","Compte non autorisé, contactez un administrateur."); await auth.signOut(); location.replace("index.html#non-autorise"); return; }
      const u=d.data();
      roleReleves=["viewer","editor","admin"].indexOf(u.roleReleves)>=0?u.roleReleves:"none";
      rolePlan=(u.role==="admin"||u.role==="editor")?u.role:"viewer";
    }catch(e){ console.warn(e); }
    if(roleReleves==="none"){ bloquer("Accès non autorisé","Votre compte n'a pas accès au module relevés. Demandez l'accès à un admin."); return; }
    demarrer();
  });
})();
</script>
