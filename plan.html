<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plan de stockage — Échalotes &amp; Oignons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E3DECF;
    --panel: #FBF9F3;
    --panel-2: #F1ECDE;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --line: #D2C9B4;
    --copper: #963E88;
    --copper-soft: #EAD7E6;
    --wave-1: #B23C92;
    --wave-2: #5B2A66;
    --green: #4E6647;
    --green-soft: #DCE4D2;
    --warn: #A13B2F;
    --warn-soft: #F1D6CC;
    --blue: #3E5C76;
    --blue-soft: #D9E2EA;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(43,38,32,0.06), 0 4px 14px rgba(43,38,32,0.06);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  .wrap{ max-width: 1320px; margin: 0 auto; padding: 18px 14px 60px; }

  header.app-header{ display:flex; align-items:center; justify-content:space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:36px; height:36px; flex-shrink:0; }
  .brand h1{ font-family:'Fraunces', serif; font-weight:600; font-size: 20px; margin:0; letter-spacing:-0.01em; }
  .brand p{ margin:2px 0 0; color: var(--ink-soft); font-size: 12px; }
  .header-stats{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .stat-pill{ background: var(--panel); border:1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .stat-pill b{ font-family:'IBM Plex Mono', monospace; color: var(--ink); font-size: 12.5px; font-weight:600; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--copper); }
  .dot.green{ background: var(--green); }
  .refresh-btn{ background: var(--panel); border:1px solid var(--line); border-radius: 999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--ink-soft); }
  .refresh-btn.spin svg{ animation: spin .6s linear; }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  nav.tabs{ display:flex; gap:4px; margin-bottom: 16px; background: var(--panel-2); padding: 5px; border-radius: 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ font-family:'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 9px 14px; border:none; background: transparent; color: var(--ink-soft); border-radius: 8px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  nav.tabs button:hover{ color: var(--ink); }
  nav.tabs button.active{ background: var(--panel); color: var(--copper); box-shadow: var(--shadow); }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2{ font-family:'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0 0 4px; }
  .card .sub{ color: var(--ink-soft); font-size: 12.5px; margin: 0 0 14px; }

  .cellule-tabs{ display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .cellule-tabs button{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; padding:8px 12px; border-radius:7px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .cellule-tabs button.active{ background: var(--copper); border-color: var(--copper); color:#fff; }
  .cellule-tabs button .n{ opacity:.75; font-weight:500; }

  .stockage-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  .ligne-list{ display:flex; flex-direction:column; gap:10px; }
  .ligne-list-item{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; background:#fff; transition: border-color .15s ease; }
  .ligne-list-item:hover{ border-color: var(--copper); }
  .ligne-list-item .lli-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .ligne-list-item h3{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; margin:0; }
  .ligne-list-item .lli-count{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .fill-track{ height:12px; border-radius:6px; background: var(--panel-2); overflow:hidden; display:flex; }
  .fill-seg{ height:100%; flex-shrink:0; }
  .lli-produits{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .produit-chip{ font-family:'Inter', sans-serif; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; border:none; cursor:pointer; }
  .produit-chip:hover{ filter: brightness(1.1); }
  .lli-empty{ font-size:12px; color:var(--ink-soft); margin-top:8px; font-style:italic; }

  .grid-form{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid-form.wide-3{ grid-template-columns: repeat(3,1fr); }
  .grid-form.two{ grid-template-columns: repeat(2,1fr); }
  @media (max-width: 760px){ .grid-form, .grid-form.wide-3, .grid-form.two{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px){ .grid-form, .grid-form.wide-3, .grid-form.two{ grid-template-columns: 1fr; } }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size: 11.5px; font-weight:600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  label.field input, label.field select{ font-family:'Inter', sans-serif; font-size: 16px; font-weight: 500; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 10px; text-transform: none; letter-spacing: normal; }
  label.field input:focus, label.field select:focus{ outline:none; border-color: var(--copper); }
  label.field.span-2{ grid-column: span 2; }
  label.field.span-full{ grid-column: 1/-1; }
  @media (max-width:480px){ label.field.span-2{ grid-column: span 1; } }
  label.field .hint{ font-size:11px; text-transform:none; letter-spacing:normal; font-weight:500; color:var(--ink-soft); margin-top:2px; }
  label.field.checkbox-field{ flex-direction:row; align-items:center; gap:8px; }
  label.field.checkbox-field input[type=checkbox]{ width:18px; height:18px; padding:0; flex:none; }

  .btn{ font-family:'Inter', sans-serif; font-weight: 700; font-size: 13.5px; cursor:pointer; border:none; border-radius: 8px; padding: 11px 18px; }
  .btn:active{ transform: scale(0.98); }
  .btn-copper{ background: var(--copper); color: #fff; }
  .btn-green{ background: var(--green); color: #fff; }
  .btn-warn{ background: var(--warn); color: #fff; }
  .btn-blue{ background: var(--blue); color: #fff; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
  .btn-sm{ padding:8px 13px; font-size:12.5px; border-radius:6px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ margin-top: 14px; display:flex; align-items:center; gap: 10px; flex-wrap:wrap; }
  .msg{ font-size: 13px; font-weight: 600; }
  .msg.ok{ color: var(--green); }
  .msg.err{ color: var(--warn); }

  .overlay-bg{ display:none; position:fixed; inset:0; background: rgba(43,38,32,0.4); z-index:40; }
  .overlay-bg.open{ display:block; }
  .detail-panel{ position:fixed; top:0; right:0; height:100vh; height:100dvh; width:min(560px, 100vw); background: var(--panel); box-shadow: -8px 0 30px rgba(0,0,0,0.15); z-index:41; transform: translateX(100%); transition: transform .2s ease; overflow-y:auto; }
  .detail-panel.open{ transform: translateX(0); }
  .detail-header{ padding:16px 16px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; }
  .detail-header h3{ font-family:'Fraunces', serif; font-size:17px; margin:0 0 3px; padding-right:30px; }
  .detail-header p{ margin:0; color:var(--ink-soft); font-size:12px; font-family:'IBM Plex Mono', monospace; }
  .detail-close{ position:absolute; top:12px; right:12px; background:var(--panel-2); border:none; font-size:20px; width:34px; height:34px; border-radius:50%; cursor:pointer; color:var(--ink-soft); }
  .detail-body{ padding: 14px 16px 30px; }
  .lot-card{ background:var(--panel-2); border-radius:8px; padding:13px; margin-bottom:10px; border-left: 5px solid var(--copper); transition: outline .15s ease; }
  .lot-card .lp-title{ font-weight:700; font-size:14px; margin-bottom:2px; }
  .badge-poids-sorti{ display:inline-block; font-family:'Inter', sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:3px 9px; border-radius:999px; background:var(--copper-soft); color:var(--copper); margin-left:8px; vertical-align:2px; }
  .lot-card .lp-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .lot-card .lp-meta span{ font-family:'IBM Plex Mono', monospace; }
  .palox-list{ display:flex; flex-direction:column; gap:4px; margin:8px 0; }
  .palox-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px; border-radius:6px; background:#fff; }
  .palox-item input{ width:auto; margin:0; }
  .palox-select-all{ font-weight:700; color:var(--ink-soft); background:transparent; margin-bottom:4px; }
  .batch-summary{ font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600; }
  .lot-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .inline-form{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:none; }
  .inline-form.open{ display:block; }
  .entree-row{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:#fff; }
  .palox-weights{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .palox-weights .pw-item{ display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px; min-width:88px; }
  .palox-weights .pw-item > span{ font-size:9.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:.03em; }
  .palox-weights .pw-item input[type=number]{ width:100%; font-family:'IBM Plex Mono'; font-size:12.5px; padding:6px 6px; border:1px solid var(--line); border-radius:6px; }
  .selection-recap{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; background:var(--panel); border-radius:6px; padding:8px 10px; }

  .divider-label{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; font-weight:600; color: var(--ink-soft); text-transform:uppercase; letter-spacing: 0.08em; margin: 14px 0 10px; display:flex; align-items:center; gap:10px; }
  .divider-label::after{ content:''; flex:1; height:1px; background: var(--line); }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin: 0 -16px; padding: 0 16px; }
  table.data{ width:100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.data th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color: var(--ink-soft); padding: 8px 9px; border-bottom: 2px solid var(--line); white-space:nowrap; }
  table.data td{ padding: 9px 9px; border-bottom: 1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  table.data tr:last-child td{ border-bottom:none; }
  .mono{ font-family:'IBM Plex Mono', monospace; font-size: 12px; }
  .tag{ display:inline-block; padding: 3px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 700; text-transform:uppercase; letter-spacing:.02em; }
  .tag.entree{ background: var(--green-soft); color: var(--green); }
  .tag.sortie{ background: var(--warn-soft); color: var(--warn); }
  .tag.deplacement{ background: var(--copper-soft); color: var(--copper); }
  .tag.modification{ background: var(--blue-soft); color: var(--blue); }

  .search-box{ position:relative; margin-bottom:14px; }
  .search-box input{ width:100%; font-family:'Inter'; font-size:16px; padding:12px 14px 12px 40px; border-radius:9px; border:1.5px solid var(--line); background:#fff; }
  .search-box input:focus{ outline:none; border-color:var(--copper); }
  .search-box svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); }

  .empty-state{ text-align:center; padding: 24px 8px; color: var(--ink-soft); }
  .empty-state svg{ width:38px; height:38px; margin-bottom:8px; opacity:.6; }

  .config-cellule{ border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .config-cellule .cfg-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
  .config-cellule .cfg-head input{ font-family:'Fraunces'; font-weight:600; font-size:14.5px; border:none; background:transparent; padding:2px 4px; border-radius:4px; min-width:0; flex:1; }
  .config-cellule .cfg-head input:focus{ outline:1.5px solid var(--copper); background:#fff; }
  .ligne-row{ display:flex; align-items:center; gap:8px; padding:8px 0; font-size:12.5px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .ligne-row:last-of-type{ border-bottom:none; }
  .ligne-row input[type=text]{ font-family:'Inter'; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:160px; }
  .ligne-row input[type=number]{ font-family:'IBM Plex Mono'; font-size:12.5px; padding:6px 6px; border:1px solid var(--line); border-radius:6px; width:70px; }
  .del-btn{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px; text-decoration:underline; flex-shrink:0; }
  .del-btn:hover{ color: var(--warn); }
  .loading{ text-align:center; padding:60px 0; color: var(--ink-soft); font-family:'Fraunces'; font-size:16px; }

  .login-screen{ display:none; min-height:100vh; align-items:center; justify-content:center; padding: 20px; }
  .login-card{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; width: 100%; max-width: 360px; }
  .login-card .brand{ justify-content:center; margin-bottom: 4px; }
  .login-card form{ display:flex; flex-direction:column; gap:12px; }
  .login-card .btn{ width:100%; margin-top:4px; }
  .brand-wave{ display:block; width:100%; height:14px; margin:2px 0 18px; }
  header.app-header .brand-wave{ margin:10px 0 4px; }
  .role-badge{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding: 5px 10px; border-radius:999px; }
  .role-badge.editor{ background: var(--green-soft); color: var(--green); }
  .role-badge.viewer{ background: var(--blue-soft); color: var(--blue); }
  .role-badge.admin{ background: #8B5FBF; color: #fff; }
  .readonly-note{ background: var(--panel-2); border:1px dashed var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--ink-soft); }
  .filter-bar{ background: var(--copper-soft); border-radius:8px; padding:8px 12px; font-size:12.5px; color: var(--ink); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .consult-total{ background: var(--panel-2); border-radius:8px; padding:10px 14px; margin-top:12px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .consult-total span:first-child{ color: var(--ink-soft); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.04em; }
  table.data tr.totals-row td{ font-weight:700; border-top:2px solid var(--line); border-bottom:none; }
  .view-switch{ display:flex; gap:6px; margin-bottom:14px; }
  .view-switch button{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:7px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; }
  .view-switch button.active{ background: var(--copper); border-color: var(--copper); color:#fff; }
  .produit-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:1px; }
  /* Barre de module commune (plan, relevés, administration) : retour à l'accueil */
  .mod-bar{ position:sticky; top:0; z-index:39; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:56px; padding:8px 16px; padding-top:calc(8px + env(safe-area-inset-top,0px)); background:#2B2620; color:#fff; font-family:'Inter', system-ui, sans-serif; }
  .mod-bar .mod-t{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mod-bar .mod-dot{ width:12px; height:12px; border-radius:3px; flex:none; }
  .mod-home{ display:inline-flex; align-items:center; gap:8px; flex:none; background:#fff; color:#2B2620; border-radius:10px; padding:0 14px; min-height:44px; font:600 14px 'Inter', sans-serif; text-decoration:none; }
  .mod-home:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  @media (max-width:640px){ .mod-bar{ padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top,0px)); } .mod-bar .mod-t{ font-size:14px; } }
</style>
</head>
<body>
<div class="mod-bar"><span class="mod-t"><span class="mod-dot" style="background:#963E88"></span>Plan de stockage</span><a class="mod-home" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Accueil</a></div>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="18" cy="29" rx="11" ry="12" fill="url(#gOnionLogin)"/>
        <path d="M18 17C16.5 12 15 9 12 6" stroke="#4E6647" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="32" cy="27" rx="8.5" ry="14" fill="url(#gShallotLogin)"/>
        <path d="M32 13C31 8 30.5 5 29 2" stroke="#4E6647" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="gOnionLogin" x1="7" y1="17" x2="29" y2="41"><stop stop-color="#B23C92"/><stop offset="1" stop-color="#5B2A66"/></linearGradient>
          <linearGradient id="gShallotLogin" x1="23.5" y1="13" x2="40.5" y2="41"><stop stop-color="#8C8577"/><stop offset="1" stop-color="#5C564A"/></linearGradient>
        </defs>
      </svg>
      <div>
        <h1>Plan de stockage</h1>
        <p>Connexion requise</p>
      </div>
    </div>
    <svg class="brand-wave" viewBox="0 0 300 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 14 C40 22, 80 4, 130 12 C180 20, 220 2, 300 10" style="stroke:url(#waveGradLogin)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <defs><linearGradient id="waveGradLogin" x1="0" y1="0" x2="300" y2="0">
        <stop offset="0" style="stop-color:var(--wave-1)"/><stop offset="1" style="stop-color:var(--wave-2)"/>
      </linearGradient></defs>
    </svg>
    <form id="loginForm">
      <label class="field">Email<input type="email" id="loginEmail" autocomplete="username" required></label>
      <label class="field">Mot de passe<input type="password" id="loginPassword" autocomplete="current-password" required></label>
      <button class="btn btn-copper" type="submit">Se connecter</button>
      <span class="msg err" id="loginMsg"></span>
    </form>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <header class="app-header">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="18" cy="29" rx="11" ry="12" fill="url(#gOnionHeader)"/>
        <path d="M18 17C16.5 12 15 9 12 6" stroke="#4E6647" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="32" cy="27" rx="8.5" ry="14" fill="url(#gShallotHeader)"/>
        <path d="M32 13C31 8 30.5 5 29 2" stroke="#4E6647" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="gOnionHeader" x1="7" y1="17" x2="29" y2="41"><stop stop-color="#B23C92"/><stop offset="1" stop-color="#5B2A66"/></linearGradient>
          <linearGradient id="gShallotHeader" x1="23.5" y1="13" x2="40.5" y2="41"><stop stop-color="#8C8577"/><stop offset="1" stop-color="#5C564A"/></linearGradient>
        </defs>
      </svg>
      <div>
        <h1>Plan de stockage</h1>
        <p>Partagé en temps réel · cellules et lignes</p>
      </div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </header>
  <svg class="brand-wave" viewBox="0 0 300 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 14 C40 22, 80 4, 130 12 C180 20, 220 2, 300 10" style="stroke:url(#waveGradHeader)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <defs><linearGradient id="waveGradHeader" x1="0" y1="0" x2="300" y2="0">
      <stop offset="0" style="stop-color:var(--wave-1)"/><stop offset="1" style="stop-color:var(--wave-2)"/>
    </linearGradient></defs>
  </svg>

  <nav class="tabs" id="tabs">
    <button data-tab="stockage" class="active">Stockage</button>
    <button data-tab="recherche">Recherche</button>
    <button data-tab="global">Stock global</button>
    <button data-tab="historique">Historique</button>
  </nav>

  <div id="app"><div class="loading">Chargement du plan…</div></div>
</div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="detail-panel" id="detailPanel"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  // Remplace ces valeurs par la config de ton projet Firebase
  // (Console Firebase > Paramètres du projet > Tes applications > Config SDK)
  const firebaseConfig = {
    apiKey: "AIzaSyCE7V6RSx1akfJsFymsedaKe-uZPSrjps4",
    authDomain: "stockage-plan-temp-test.firebaseapp.com",
    projectId: "stockage-plan-temp-test",
    storageBucket: "stockage-plan-temp-test.firebasestorage.app",
    messagingSenderId: "1020932560553",
    appId: "1:1020932560553:web:02fad075d7ba49f65d7bb8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const DOC_REF = db.collection('planStockage').doc('main');
  let currentRole = 'viewer';
  function canManageStock(){ return currentRole==='editor' || currentRole==='admin'; }
  function isAdmin(){ return currentRole==='admin'; }
  let unsubscribeSnapshot = null;

  // Chaque entrée de state.lots représente UN palox physique (pas un lot agrégé).
  // Plusieurs palox entrés ensemble partagent le même batchId, pour l'affichage groupé "par lot".
  let state = { cellules: [], lots: [], transactions: [], produits: [], calibres: [] };
  let loaded = false;
  let currentTab = 'stockage';
  let currentCelluleId = null;
  let globalByCellule = false;
  const COLOR_PALETTE = ['#A85C2E','#4E6647','#3E5C76','#8B5FBF','#B0793E','#5C7A6E','#7A4B4B','#5A6B8C','#946846','#3F7161'];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){ const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}); }
  function fmt(n){ return (Math.round(n*100)/100).toString(); }
  function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function isPanelOpen(){ return document.getElementById('detailPanel').classList.contains('open'); }

  function applyIncomingState(raw){
    if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = { cellules:[], lots:[], transactions:[], produits:[], calibres:[] }; } }
    migrate();
    if(!currentCelluleId || !getCellule(currentCelluleId)) currentCelluleId = state.cellules[0] ? state.cellules[0].id : null;
  }
  function attachSnapshotListener(){
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = DOC_REF.onSnapshot(async (snap)=>{
      if(!snap.exists){
        state = { cellules: [], lots: [], transactions: [], produits: [], calibres: [] };
        if(canManageStock()){ seedDefault(); applyIncomingState(null); }
        loaded = true;
        render();
        if(canManageStock()) await saveState();
        return;
      }
      if(isPanelOpen()) return;
      applyIncomingState(snap.data().data);
      loaded = true;
      render();
    }, (err)=>{
      console.error("Erreur de synchronisation Firestore", err);
    });
  }
  async function refetchState(){
    try{
      const snap = await DOC_REF.get();
      if(snap.exists){ applyIncomingState(snap.data().data); render(); }
    }catch(e){ console.error(e); }
  }
  let saveStatusTimer = null;
  function setSaveStatus(status){
    const el = document.getElementById('saveStatus');
    if(!el) return;
    clearTimeout(saveStatusTimer);
    if(status==='saving'){ el.textContent = 'Sauvegarde…'; el.style.color = 'var(--ink-soft)'; el.style.display='inline'; }
    else if(status==='ok'){ el.textContent = '✓ Sauvegardé'; el.style.color = 'var(--green)'; el.style.display='inline'; saveStatusTimer = setTimeout(()=>{ el.style.display='none'; }, 2000); }
    else if(status==='error'){ el.innerHTML = '⚠ Non sauvegardé <button id="retrySaveBtn" style="border:none;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:11.5px;font-weight:700;padding:0;">réessayer</button>'; el.style.color = 'var(--warn)'; el.style.display='inline';
      const rb = document.getElementById('retrySaveBtn'); if(rb) rb.addEventListener('click', ()=>saveState());
    }
  }
  let saveChain = Promise.resolve();
  function saveState(){
    saveChain = saveChain.then(()=>doSaveWithRetry(4));
    return saveChain;
  }
  async function doSaveWithRetry(retriesLeft, delay){
    delay = delay || 1000;
    setSaveStatus('saving');
    try{
      await DOC_REF.set({ data: JSON.stringify(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      setSaveStatus('ok');
    }catch(e){
      console.error("Erreur de sauvegarde", e);
      if(retriesLeft>0){
        await new Promise(r=>setTimeout(r, delay));
        return doSaveWithRetry(retriesLeft-1, Math.min(delay*2, 8000));
      }
      setSaveStatus('error');
    }
  }
  function exportBackup(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sauvegarde-plan-stockage-'+today()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function importBackup(file){
    if(!canManageStock()){ alert('Réservé aux comptes de gestion.'); return; }
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.cellules){ alert('Fichier invalide : ce n\'est pas une sauvegarde reconnue.'); return; }
        if(!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
        state = parsed;
        migrate();
        await saveState();
        renderHeaderStats();
        renderTab(currentTab);
      }catch(e){ alert('Impossible de lire ce fichier : '+e.message); }
    };
    reader.readAsText(file);
  }
  async function manualRefresh(){
    const btn = document.getElementById('refreshBtn');
    if(btn) btn.classList.add('spin');
    const statusEl = document.getElementById('saveStatus');
    const hadPendingError = statusEl && statusEl.textContent.indexOf('⚠')===0;
    await refetchState();
    if(hadPendingError) saveState();
    setTimeout(()=>{ if(btn) btn.classList.remove('spin'); }, 500);
  }

  function migrate(){
    // Anciens modèles : ligne { positions, hauteurParPosition }, lot { position, hauteurDebut, nbPalox, poids total }.
    // Nouveau modèle : ligne { capacite }, lot = UN palox individuel { poids unitaire, batchId }.
    if(!Array.isArray(state.produits)){
      state.produits = ['Echalote','Echalion','Echalote de semis','Oignon de Roscoff','Oignon rouge','Oignon jaune'];
    }
    if(!Array.isArray(state.calibres)){
      state.calibres = ['20/40','40/60','60/80'];
    }
    state.cellules.forEach(c=>{
      if(c.nonAchetee==null) c.nonAchetee = !!c.frigo;
      delete c.frigo;
      c.lignes.forEach(l=>{
        if(l.capacite==null){
          if(Array.isArray(l.hauteurParPosition)) l.capacite = l.hauteurParPosition.reduce((a,b)=>a+b,0) || 50;
          else l.capacite = 50;
        }
        delete l.positions; delete l.hauteurParPosition; delete l.hauteurMax;
      });
    });
    const expanded = [];
    state.lots.forEach(l=>{
      delete l.position; delete l.hauteurDebut;
      if(l.nbPalox!=null){
        const count = Math.max(1, Math.round(l.nbPalox));
        const perUnit = l.poids!=null ? l.poids/count : null;
        const batchId = l.batchId || l.id || uid();
        for(let i=0;i<count;i++){
          expanded.push({ id: i===0 ? (l.id||uid()) : uid(), celluleId: l.celluleId, ligneId: l.ligneId, batchId,
            produit: l.produit, lot: l.lot, parcelle: l.parcelle, calibre: l.calibre, traitement: l.traitement, poidsSorti: l.poidsSorti,
            poids: perUnit, dateEntree: l.dateEntree, commentaire: l.commentaire });
        }
      } else {
        if(!l.batchId) l.batchId = l.id;
        expanded.push(l);
      }
    });
    state.lots = expanded;
    // Fusionne les lots identiques (même produit/lot/calibre/traitement/emplacement) sous un seul batchId,
    // pour éviter que des modifications successives ne fragmentent artificiellement un même lot.
    const batchKeyMap = {};
    state.lots.forEach(l=>{
      const key = [l.celluleId, l.ligneId, l.produit, l.lot||'', l.lot2||'', l.calibre||'', !!l.traitement, !!l.poidsSorti].join('|');
      if(batchKeyMap[key]==null) batchKeyMap[key] = l.batchId;
      else l.batchId = batchKeyMap[key];
    });
  }

  function seedDefault(){
    function ligne(nom, capacite){ return { id: uid(), nom, capacite }; }
    function cellule(nom, lignes){ return { id: uid(), nom, lignes }; }
    state.cellules = [
      cellule("Cellule 1", [ligne("Ligne 1",50), ligne("Ligne 2",50), ligne("Ligne 3",50)]),
      cellule("Cellule 2", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 3", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 4 LBP", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 5 LBP", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 6 LBP", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Cellule 7 LBP Colle Carotte", [ligne("Ligne Gauche",50), ligne("Ligne Milieu",50), ligne("Ligne Droite",50)]),
      cellule("Frigo 8 Cocaign", [ligne("Casiers",140)])
    ];
  }

  function getCellule(id){ return state.cellules.find(c=>c.id===id); }
  function getLigne(celluleId, ligneId){ const c = getCellule(celluleId); return c ? c.lignes.find(l=>l.id===ligneId) : null; }
  function lotsInLigne(celluleId, ligneId){ return state.lots.filter(l=>l.celluleId===celluleId && l.ligneId===ligneId); }
  function ligneOccupied(celluleId, ligneId){ return lotsInLigne(celluleId, ligneId).length; }
  function lignePercent(celluleId, ligneId){
    const l = getLigne(celluleId, ligneId);
    if(!l || !l.capacite) return 0;
    return (ligneOccupied(celluleId, ligneId) / l.capacite) * 100;
  }
  function paloxById(id){ return state.lots.find(l=>l.id===id); }
  function caseLabel(celluleId, ligneId){
    const c = getCellule(celluleId), l = getLigne(celluleId, ligneId);
    return (c?c.nom:'?') + " — " + (l?l.nom:'?');
  }
  function addTx(type, data){
    const responsable = (auth.currentUser && auth.currentUser.email) || '?';
    state.transactions.unshift(Object.assign({ id: uid(), type, date: data.date || today(), responsable }, data));
  }
  function totalPalox(){ return state.lots.length; }
  const FIXED_PRODUCT_COLORS = [
    { test: n=> n.includes('semis') && n.includes('echalote'), color: '#8E6BA8' },   // échalote de semis — mauve
    { test: n=> n.includes('echalion'), color: '#3D6C96' },                          // échalion — bleu
    { test: n=> n.includes('roscoff'), color: '#C97B94' },                           // oignon de roscoff — rose
    { test: n=> n.includes('rouge'), color: '#A83232' },                             // oignon rouge — rouge
    { test: n=> n.includes('jaune'), color: '#B8933A' },                             // oignon jaune — jaune
    { test: n=> n.includes('echalote'), color: '#8C8577' }                           // échalote — gris
  ];
  function normalizeProduitKey(produit){
    return (produit||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function colorForProduit(produit){
    const key = normalizeProduitKey(produit);
    for(let i=0;i<FIXED_PRODUCT_COLORS.length;i++){ if(FIXED_PRODUCT_COLORS[i].test(key)) return FIXED_PRODUCT_COLORS[i].color; }
    let h=0; for(let i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }
    return COLOR_PALETTE[h % COLOR_PALETTE.length];
  }
  function groupByBatch(lots){
    const map = {}, order = [];
    lots.forEach(l=>{
      const key = l.batchId+'|'+l.celluleId+'|'+l.ligneId;
      if(!map[key]){
        map[key] = { batchId:l.batchId, celluleId:l.celluleId, ligneId:l.ligneId, produit:l.produit, lot:l.lot, lot2:l.lot2,
          parcelle:l.parcelle, calibre:l.calibre, traitement:l.traitement, poidsSorti:l.poidsSorti, dateEntree:l.dateEntree, commentaire:l.commentaire, paloxs:[] };
        order.push(key);
      }
      map[key].paloxs.push(l);
    });
    return order.map(k=>map[k]);
  }
  function batchesInLigne(celluleId, ligneId){ return groupByBatch(lotsInLigne(celluleId, ligneId)); }
  function paloxTotalPoids(p){
    if(p.poids==null && p.poidsLot2==null) return null;
    return (p.poids||0) + (p.poidsLot2||0);
  }
  function batchPoidsSummary(batch){
    const known = batch.paloxs.filter(p=>paloxTotalPoids(p)!=null);
    const total = known.reduce((s,p)=>s+paloxTotalPoids(p),0);
    const unknown = batch.paloxs.length - known.length;
    return { total, unknown };
  }
  function produitBreakdownForLigne(celluleId, ligneId){
    const counts = {}, order = [];
    lotsInLigne(celluleId, ligneId).forEach(l=>{
      if(counts[l.produit]==null){ counts[l.produit]=0; order.push(l.produit); }
      counts[l.produit]++;
    });
    return order.map(p=>({ produit:p, count:counts[p] }));
  }

  // ---------- RENDER ----------
  function render(){ if(!loaded) return; renderHeaderStats(); renderTab(currentTab); }
  function renderHeaderStats(){
    document.getElementById('headerStats').innerHTML =
      '<div class="stat-pill"><span class="dot green"></span>Palox <b>'+fmt(totalPalox())+'</b></div>'+
      '<div class="stat-pill"><span class="dot"></span>Cellules <b>'+state.cellules.length+'</b></div>'+
      '<span class="role-badge '+currentRole+'">'+(currentRole==='admin'?'Admin':currentRole==='editor'?'Gestion':'Consultation')+'</span>'+
      '<span id="saveStatus" style="font-size:11.5px;font-weight:600;display:none;"></span>'+
      '<button class="refresh-btn" id="refreshBtn" title="Actualiser">⟳</button>'+
      '<button class="btn btn-ghost btn-sm" id="logoutBtn">Déconnexion</button>';
    document.getElementById('refreshBtn').addEventListener('click', manualRefresh);
    document.getElementById('logoutBtn').addEventListener('click', ()=>auth.signOut());
    const tabCellules = document.getElementById('tabCellules');
    if(tabCellules) tabCellules.style.display = isAdmin() ? '' : 'none';
    const tabComptes = document.getElementById('tabComptes');
    if(tabComptes) tabComptes.style.display = isAdmin() ? '' : 'none';
  }
  function renderTab(tab){
    if(tab==='cellules' && !isAdmin()) tab = 'stockage';
    if(tab==='comptes' && !isAdmin()) tab = 'stockage';
    currentTab = tab;
    document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
    const app = document.getElementById('app');
    if(tab==='stockage') app.innerHTML = viewStockage();
    if(tab==='recherche') app.innerHTML = viewRecherche();
    if(tab==='global') app.innerHTML = viewGlobal();
    if(tab==='historique') app.innerHTML = viewHistorique();
    if(tab==='cellules') app.innerHTML = viewCellules();
    if(tab==='comptes') app.innerHTML = viewComptes();
    bindTabEvents(tab);
  }

  function viewStockage(){
    if(state.cellules.length===0){
      return '<div class="card">'+emptyState("Aucune cellule configurée", isAdmin() ? "Crée une cellule dans l'onglet « Cellules » pour commencer." : "Aucune donnée pour le moment — contacte un compte admin.")+'</div>';
    }
    if(!currentCelluleId || !getCellule(currentCelluleId)) currentCelluleId = state.cellules[0].id;
    const c = getCellule(currentCelluleId);

    const celluleTabsHtml = state.cellules.map(cc=>{
      const n = state.lots.filter(x=>x.celluleId===cc.id).length;
      return '<button data-cellule="'+cc.id+'" class="'+(cc.id===c.id?'active':'')+'">'+escapeHtml(cc.nom)+' <span class="n">('+n+')</span></button>';
    }).join('');

    const toolbar = canManageStock() ?
      '<div class="stockage-toolbar">'+
        '<button class="btn btn-green btn-sm" id="openBulkEntree">+ Entrée</button>'+
      '</div>' : '';

    const lignesHtml = c.lignes.map(l=>{
      const occ = ligneOccupied(c.id, l.id);
      const pct = lignePercent(c.id, l.id);
      const breakdown = produitBreakdownForLigne(c.id, l.id);
      const segs = breakdown.map(b=>'<div class="fill-seg" style="width:'+((b.count/l.capacite)*100)+'%;background:'+colorForProduit(b.produit)+'" title="'+escapeHtml(b.produit)+' : '+b.count+'"></div>').join('');
      const chips = breakdown.length ?
        '<div class="lli-produits">'+breakdown.map(b=>'<button type="button" class="produit-chip" style="background:'+colorForProduit(b.produit)+'" data-produit-jump="'+c.id+'|'+l.id+'|'+encodeURIComponent(b.produit)+'">'+escapeHtml(b.produit)+' ('+b.count+')</button>').join('')+'</div>' :
        '<div class="lli-empty">Vide</div>';
      const complet = occ>=l.capacite ? ' <span style="color:var(--warn);font-weight:700;">· Complet</span>' : '';
      const ligneEntreeBtn = canManageStock() ? '<button type="button" class="btn btn-green btn-sm" data-ligne-entree="'+c.id+'|'+l.id+'">+ Entrée</button>' : '';
      return '<div class="ligne-list-item" data-cellule="'+c.id+'" data-ligne="'+l.id+'">'+
        '<div class="lli-head"><h3>'+escapeHtml(l.nom)+'</h3>'+
          '<div style="display:flex;align-items:center;gap:10px;"><span class="lli-count">'+occ+' / '+l.capacite+' palox · '+Math.round(pct)+'%'+complet+'</span>'+ligneEntreeBtn+'</div>'+
        '</div>'+
        '<div class="fill-track">'+segs+'</div>'+
        chips+
      '</div>';
    }).join('');

    return '<div class="cellule-tabs" id="stockageCelluleTabs">'+celluleTabsHtml+'</div>'+
      toolbar+
      '<div class="card"><h2>'+escapeHtml(c.nom)+'</h2>'+
      '<p class="sub">Une ligne = une file de stockage. La barre montre la part de chaque produit. Touche une ligne — ou un produit — pour voir son détail.</p>'+
      '<div class="ligne-list">'+lignesHtml+'</div>'+
      '</div>';
  }

  function emptyState(title, sub){
    return '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M3 11h18M8 7V4h8v3"/></svg>'+
      '<div style="font-family:\'Fraunces\';font-size:15px;color:var(--ink);margin-bottom:4px;">'+title+'</div><div style="font-size:13px;">'+sub+'</div></div>';
  }

  // ---------- DETAIL PANEL (une ligne, détail par lot) ----------
  function batchCardHtml(batch, visibleIds){
    const visiblePaloxs = visibleIds ? batch.paloxs.filter(p=>visibleIds.has(p.id)) : batch.paloxs;
    const summary = batchPoidsSummary({ paloxs: visiblePaloxs });
    const poidsStr = summary.unknown>0 ?
      (fmt(summary.total)+' kg connus ('+summary.unknown+' palox sans poids renseigné)') :
      (fmt(summary.total)+' kg');
    const rows = batch.paloxs.map((p,idx)=>{
      if(visibleIds && !visibleIds.has(p.id)) return '';
      let poidsLabel;
      if(p.poidsLot2!=null){
        const tot = paloxTotalPoids(p);
        poidsLabel = (p.poids!=null? fmt(p.poids):'?')+' kg (lot '+escapeHtml(batch.lot||'1')+') + '+fmt(p.poidsLot2)+' kg (lot '+escapeHtml(batch.lot2||'2')+')'+(tot!=null?' = '+fmt(tot)+' kg':'');
      } else {
        poidsLabel = p.poids!=null? fmt(p.poids)+' kg':'poids inconnu';
      }
      return '<label class="palox-item"><input type="checkbox" data-palox="'+p.id+'"> Palox '+(idx+1)+' — '+poidsLabel+'</label>';
    }).join('');
    return '<div class="lot-card" style="border-left-color:'+colorForProduit(batch.produit)+'" data-batch="'+batch.batchId+'" data-cellule="'+batch.celluleId+'" data-ligne="'+batch.ligneId+'" data-produit="'+escapeHtml((batch.produit||'').toLowerCase())+'">'+
      '<div class="lp-title">'+escapeHtml(batch.produit)+(batch.poidsSorti?'<span class="badge-poids-sorti">Poids sorti</span>':'')+'</div>'+
      '<div class="lp-meta">Lot <span>'+escapeHtml(batch.lot||'—')+(batch.lot2? ' + '+escapeHtml(batch.lot2):'')+'</span>'+
        (batch.parcelle? ' · Parcelle <span>'+escapeHtml(batch.parcelle)+'</span>':'')+
        (batch.calibre? ' · Calibre <span>'+escapeHtml(batch.calibre)+'</span>':'')+
        (batch.traitement? ' · Antigerme':'')+
        '<br>entré le '+fmtDate(batch.dateEntree)+
        (batch.commentaire? '<br>« '+escapeHtml(batch.commentaire)+' »':'')+
      '</div>'+
      (visibleIds ? '<div class="filter-bar" style="margin-bottom:8px;">'+visiblePaloxs.length+' palox isolé(s) par la recherche</div>' : '')+
      (canManageStock() ? '<label class="palox-item palox-select-all"><input type="checkbox" data-select-all="'+batch.batchId+'"> Tout sélectionner</label>' : '')+
      '<div class="palox-list">'+rows+'</div>'+
      '<div class="batch-summary">'+visiblePaloxs.length+' palox · '+poidsStr+'</div>'+
      (canManageStock() ? (

  function ligneDetailBatchesHtml(celluleId, ligneId, filterProduit, searchQuery){
    let batches = batchesInLigne(celluleId, ligneId);
    if(filterProduit){
      const norm = normalizeProduitKey(filterProduit);
      batches = batches.filter(b => normalizeProduitKey(b.produit)===norm);
    }
    const allTokens = (searchQuery||'').toLowerCase().trim().split(/\s+/).filter(t => t && t!=='kg');
    const weightTokens = allTokens.filter(t => /^\d+([.,]\d+)?$/.test(t));
    const textTokens = allTokens.filter(t => !/^\d+([.,]\d+)?$/.test(t));
    const paloxMatchesWeights = (p) => weightTokens.every(t =>
      (p.poids!=null && String(p.poids).includes(t)) || (p.poidsLot2!=null && String(p.poidsLot2).includes(t))
    );
    if(allTokens.length){
      batches = batches.filter(b=>{
        const haystack = [b.produit,b.lot,b.lot2,b.parcelle,b.calibre,(b.traitement?'antigerme':''),b.commentaire].map(f=>(f||'').toLowerCase()).join(' ');
        const textOk = textTokens.every(t => haystack.includes(t));
        const weightOk = weightTokens.length===0 || b.paloxs.some(paloxMatchesWeights);
        return textOk && weightOk;
      });
    }
    if(batches.length===0){
      return '<p style="color:var(--ink-soft);font-size:13.5px;">'+
        (allTokens.length ? 'Aucun résultat pour « '+escapeHtml(searchQuery)+' ».' : filterProduit? 'Aucun palox de « '+escapeHtml(filterProduit)+' » ici pour le moment.' : 'Aucun palox ici pour le moment.')+
      '</p>';
    }
    return batches.map(b=>{
      const visibleIds = weightTokens.length ? new Set(b.paloxs.filter(paloxMatchesWeights).map(p=>p.id)) : null;
      return batchCardHtml(b, visibleIds);
    }).join('');
  }

  function resolvePaloxWeight(paloxState){

  function bindBatchCardEvents(root){
    root.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const batchId = btn.dataset.batch, act = btn.dataset.act;
        const card = btn.closest('.lot-card');
        const checked = Array.from(card.querySelectorAll('input[data-palox]:checked')).map(cb=>cb.dataset.palox);
        if(checked.length===0){
          alert('Sélectionne au moins un palox dans la liste ci-dessus.');
          return;
        }
        if(act==='supprimer'){
          if(!confirm('Supprimer définitivement '+checked.length+' palox sélectionné(s) ? Cette action ne peut pas être annulée.')) return;
          const idSet = new Set(checked);
          state.lots = state.lots.filter(l=>!idSet.has(l.id));
          await saveState();
          renderHeaderStats();
          openLigneDetail(document.getElementById('detailPanel').dataset.cellule, document.getElementById('detailPanel').dataset.ligne, document.getElementById('detailPanel').dataset.filterProduit || undefined);
          renderTab(currentTab);
          return;
        }
        const formEl = document.getElementById('form-'+act+'-'+batchId);
        if(act==='sortie') formEl.innerHTML = formSortieSelection(checked);
        else if(act==='deplacer') formEl.innerHTML = formDeplacerSelection(checked, card.dataset.cellule);
        else if(act==='modifier') formEl.innerHTML = formModifierSelection(checked);
        formEl.classList.add('open');
        formEl.dataset.selection = checked.join(',');
        bindSelectionFormEvents(formEl, act, card);
      });
    });

    root.querySelectorAll('[data-select-all]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const card = cb.closest('.lot-card');
        card.querySelectorAll('input[data-palox]').forEach(paloxCb=>{ paloxCb.checked = cb.checked; });
      });
    });
  }


  function bindSelectionFormEvents(formEl, act, card){
    const destCelSel = formEl.querySelector('[data-f="destCellule"]');
    if(destCelSel){
      destCelSel.addEventListener('change', ()=>{
        formEl.querySelector('[data-f="destLigne"]').innerHTML = ligneOptionsHtml(destCelSel.value);
      });
    }
    if(act==='modifier'){
      const row = formEl.querySelector('[data-modifier-row]');
      const selectionCount = (formEl.dataset.selection||'').split(',').filter(Boolean).length;
      formEl.addEventListener('input', (ev)=>{
        if(ev.target.matches('[data-f="lot2"]')) refreshPaloxWeightInputs(row, selectionCount);
      });
    }
    formEl.querySelector('[data-cancel-selection]').addEventListener('click', ()=>{
      formEl.classList.remove('open'); formEl.innerHTML='';
    });
    formEl.querySelector('[data-confirm-selection]').addEventListener('click', async ()=>{
      const ids = (formEl.dataset.selection||'').split(',').filter(Boolean);
      const paloxs = ids.map(paloxById).filter(Boolean);
      const msg = formEl.querySelector('#msg-selection');
      if(paloxs.length===0){ msg.textContent = '✗ Sélection invalide'; msg.className='msg err'; return; }
      const first = paloxs[0];
      const known = paloxs.filter(p=>paloxTotalPoids(p)!=null);
      const poidsTotal = known.length ? known.reduce((s,p)=>s+paloxTotalPoids(p),0) : null;

      if(act==='sortie'){
        const date = formEl.querySelector('[data-f="date"]').value;
        const comment = formEl.querySelector('[data-f="comment"]').value;
        addTx('sortie', { quantite: paloxs.length, poids: poidsTotal, produit: first.produit, lot: first.lot, date, commentaire: comment, label: caseLabel(first.celluleId, first.ligneId) });
        const idSet = new Set(ids);
        state.lots = state.lots.filter(l=>!idSet.has(l.id));
      } else if(act==='deplacer'){
        const date = formEl.querySelector('[data-f="date"]').value;
        const comment = formEl.querySelector('[data-f="comment"]').value;
        const destCelluleId = formEl.querySelector('[data-f="destCellule"]').value;
        const destLigneId = formEl.querySelector('[data-f="destLigne"]').value;
        const destLigneObj = getLigne(destCelluleId, destLigneId);
        const isSameSpot = destCelluleId===first.celluleId && destLigneId===first.ligneId;
        const destOccupied = ligneOccupied(destCelluleId, destLigneId) - (isSameSpot ? paloxs.length : 0);
        if(destOccupied + paloxs.length > destLigneObj.capacite){
          msg.textContent = '✗ Ne rentre pas à destination ('+(destLigneObj.capacite-destOccupied)+' palox restants)';
          msg.className = 'msg err';
          return;
        }
        if(isSameSpot){ msg.textContent = '✗ La destination est identique à la source'; msg.className='msg err'; return; }
        const fromLabel = caseLabel(first.celluleId, first.ligneId);
        paloxs.forEach(p=>{ p.celluleId = destCelluleId; p.ligneId = destLigneId; });
        addTx('deplacement', { quantite: paloxs.length, poids: poidsTotal, produit: first.produit, lot: first.lot, date, commentaire: comment,
          fromLabel: fromLabel, toLabel: caseLabel(destCelluleId, destLigneId) });
      } else if(act==='modifier'){
        const row = formEl.querySelector('[data-modifier-row]');
        const get = (f)=> row.querySelector('[data-f="'+f+'"]').value;
        const produit = get('produit').trim();
        if(!produit){ msg.textContent = '✗ Le produit est obligatoire'; msg.className='msg err'; return; }
        const lotVal = get('lot').trim();
        const lot2Val = get('lot2').trim();
        const parcelle = get('parcelle').trim();
        const calibre = get('calibre').trim();
        if(!calibre){ msg.textContent = '✗ Le calibre est obligatoire'; msg.className='msg err'; return; }
        const traitement = row.querySelector('[data-f="traitement"]').checked;
        const poidsSorti = row.querySelector('[data-f="poidsSorti"]').checked;
        const dateEntree = get('dateEntree');
        const commentaire = get('commentaire').trim();
        const weightsEl = row.querySelector('.palox-weights');
        const paloxStates = weightsEl ? readPaloxWeightsState(weightsEl) : [];
        const idSet = new Set(ids);
        const existingMatch = state.lots.find(l => !idSet.has(l.id) && l.celluleId===first.celluleId && l.ligneId===first.ligneId &&
          l.produit===produit && (l.lot||'')===lotVal && (l.lot2||'')===lot2Val && (l.calibre||'')===calibre && !!l.traitement===traitement && !!l.poidsSorti===poidsSorti);
        const newBatchId = existingMatch ? existingMatch.batchId : uid();
        state.lots = state.lots.filter(l=>!idSet.has(l.id));
        paloxs.forEach((p,idx)=>{
          const { poids: poidsUnit, poidsLot2: poidsLot2Unit } = resolvePaloxWeight(paloxStates[idx]);
          state.lots.push({ id: p.id, celluleId: p.celluleId, ligneId: p.ligneId, batchId: newBatchId,
            produit, lot: lotVal, lot2: lot2Val, parcelle, calibre, traitement, poidsSorti, poids: poidsUnit, poidsLot2: poidsLot2Unit, dateEntree, commentaire });
        });
        addTx('modification', { quantite: paloxs.length, produit, lot: lotVal, lot2: lot2Val, date: today(), commentaire, label: caseLabel(first.celluleId, first.ligneId) });
      }
      await saveState();
      renderHeaderStats();
      openLigneDetail(document.getElementById('detailPanel').dataset.cellule, document.getElementById('detailPanel').dataset.ligne, document.getElementById('detailPanel').dataset.filterProduit || undefined);
      renderTab(currentTab);
    });
  }

  function bindBulkEvents(){
    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    document.getElementById('overlayBg').addEventListener('click', closeDetail);

    const rowsEl = document.getElementById('bulkRows');

    document.getElementById('addBulkRow').addEventListener('click', ()=>{
      bulkRowCounter++;
      const wrap = document.createElement('div');
      wrap.innerHTML = bulkRowHtml(bulkRowCounter);
      const row = wrap.firstElementChild;
      rowsEl.appendChild(row);
      row.querySelector('[data-f="ligne"]').innerHTML = ligneOptionsHtml(row.querySelector('[data-f="cellule"]').value);
    });

    rowsEl.addEventListener('click', (ev)=>{
      if(ev.target.matches('[data-remove-row]')) ev.target.closest('.entree-row').remove();
    });
    rowsEl.addEventListener('input', (ev)=>{
      if(ev.target.matches('[data-f="nbPalox"]') || ev.target.matches('[data-f="lot"]') || ev.target.matches('[data-f="lot2"]')) refreshPaloxWeightInputs(ev.target.closest('.entree-row'));
    });
    rowsEl.addEventListener('change', (ev)=>{
      if(ev.target.matches('[data-f="cellule"]')){
        const row = ev.target.closest('.entree-row');
        row.querySelector('[data-f="ligne"]').innerHTML = ligneOptionsHtml(ev.target.value);
      }
    });

    document.getElementById('bulkForm').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const dateVal = document.querySelector('[name="bulkDate"]').value;
      const rows = Array.from(rowsEl.querySelectorAll('.entree-row'));
      const msg = document.getElementById('bulkMsg');
      let applied = 0, errors = [];

      rows.forEach((row, idx)=>{
        const celluleId = row.querySelector('[data-f="cellule"]').value;
        const ligneId = row.querySelector('[data-f="ligne"]').value;
        const produit = row.querySelector('[data-f="produit"]').value.trim();
        const nbPalox = parseFloat(row.querySelector('[data-f="nbPalox"]').value);
        const ligneObj = getLigne(celluleId, ligneId);
        if(!produit){ errors.push('Ligne #'+(idx+1)+' : produit manquant'); return; }
        if(!nbPalox || nbPalox<1){ errors.push('Ligne #'+(idx+1)+' : quantité invalide'); return; }
        const count = Math.round(nbPalox);
        const used = ligneOccupied(celluleId, ligneId);
        if(used + count > ligneObj.capacite){ errors.push('Ligne #'+(idx+1)+' ('+ligneObj.nom+') : ne rentre pas, '+(ligneObj.capacite-used)+' palox restants'); return; }
        const lotVal = row.querySelector('[data-f="lot"]').value.trim();
        const lot2Val = row.querySelector('[data-f="lot2"]').value.trim();
        const parcelle = row.querySelector('[data-f="parcelle"]').value.trim();
        const calibre = row.querySelector('[data-f="calibre"]').value.trim();
        if(!calibre){ errors.push('Ligne #'+(idx+1)+' : calibre manquant'); return; }
        const traitement = row.querySelector('[data-f="traitement"]').checked;
        const poidsSorti = row.querySelector('[data-f="poidsSorti"]').checked;
        const weightsEl = row.querySelector('.palox-weights');
        const paloxStates = weightsEl ? readPaloxWeightsState(weightsEl) : [];
        const commentaire = row.querySelector('[data-f="commentaire"]').value.trim();
        const resolved = [];
        for(let n=0;n<count;n++) resolved.push(resolvePaloxWeight(paloxStates[n]));
        const missingWeight = resolved.some(r => r.poids==null || (lot2Val && r.poidsLot2==null));
        if(missingWeight){ errors.push('Ligne #'+(idx+1)+' : le poids de chaque palox est obligatoire'+(lot2Val?' (lot 1 et lot 2)':'')); return; }
        const batchId = uid();
        const poidsKnown = [];
        resolved.forEach(({poids: poidsUnit, poidsLot2: poidsLot2Unit})=>{
          poidsKnown.push((poidsUnit||0) + (poidsLot2Unit||0));
          state.lots.push({ id: uid(), celluleId, ligneId, batchId, produit, lot: lotVal, lot2: lot2Val, parcelle, calibre, traitement, poidsSorti, poids: poidsUnit, poidsLot2: poidsLot2Unit, dateEntree: dateVal, commentaire });
        });
        const poidsTotal = poidsKnown.reduce((a,b)=>a+b,0);
        addTx('entree', { quantite: count, poids: poidsTotal, produit, lot: lotVal, lot2: lot2Val, date: dateVal, commentaire, label: caseLabel(celluleId,ligneId) });
        applied++;
      });

      await saveState();
      renderHeaderStats();
      if(errors.length===0){
        closeDetail();
        renderTab(currentTab);
      } else {
        msg.innerHTML = (applied>0 ? '✓ '+applied+' ligne(s) appliquée(s).<br>':'')+'⚠ '+errors.join('<br>⚠ ');
        msg.className = 'msg err';
        renderTab(currentTab);
      }
    });
  }

    state.lots.forEach(l=>{

    });
    return out.sort((a,b)=>a.localeCompare(b, 'fr'));

    return {

      celluleId: (document.getElementById('filterCellule')||{}).value || '',
      produit: (document.getElementById('filterProduit')||{}).value || '',

    };

  function filteredBatches(filters){
    filters = filters || {};
    const q = (filters.q||'').toLowerCase().trim();
    const lotText = (filters.lot||'').toLowerCase().trim();
    let batches = groupByBatch(state.lots);
    if(filters.celluleId) batches = batches.filter(b=>b.celluleId===filters.celluleId);
    if(filters.produit) batches = batches.filter(b=>b.produit===filters.produit);
    if(filters.calibre) batches = batches.filter(b=>b.calibre===filters.calibre);
    if(lotText) batches = batches.filter(b=>(b.lot||'').toLowerCase().includes(lotText) || (b.lot2||'').toLowerCase().includes(lotText));
    if(q){
      const tokens = q.split(/\s+/).filter(Boolean);
      batches = batches.filter(b=>{
        const haystack = [b.produit,b.lot,b.lot2,b.parcelle,b.calibre,(b.traitement?'antigerme':''),b.commentaire,caseLabel(b.celluleId,b.ligneId)]
          .map(f=>(f||'').toLowerCase()).join(' ');
        return tokens.every(t => haystack.includes(t));
      });
    }
    return batches;
  }
  function csvEscape(v){
    v = String(v??'');
    return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function exportStockCsv(){
    const batches = filteredBatches(currentSearchFilters()).filter(b => !(getCellule(b.celluleId)||{}).nonAchetee);
    const header = ['Produit','Lot','Poids total (kg)','Palox','Emplacement','Calibre','Traitement','Poids sorti'];
    const lines = [header.join(';')];
    batches.forEach(b=>{
      const summary = batchPoidsSummary(b);
      const row = [
        b.produit||'',
        (b.lot||'')+(b.lot2? ' + '+b.lot2 : ''),
        summary.total>0 ? fmt(summary.total) : '',
        b.paloxs.length,
        caseLabel(b.celluleId,b.ligneId),
        b.calibre||'',
        b.traitement ? 'Oui' : 'Non',
        b.poidsSorti ? 'Oui' : 'Non'
      ];
      lines.push(row.map(csvEscape).join(';'));
    });
    const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stock-'+today()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function searchResultsHtml(filters){
    filters = filters || {};
    const q = (filters.q||'').toLowerCase().trim();
    const lotText = (filters.lot||'').toLowerCase().trim();
    const batches = filteredBatches(filters);
    const anyFilter = q || filters.celluleId || filters.produit || filters.calibre || lotText;
    const totalPaloxCount = batches.reduce((s,b)=>s+b.paloxs.length,0);
    const totalKnown = batches.reduce((s,b)=>s+batchPoidsSummary(b).total,0);
    const totalUnknown = batches.reduce((s,b)=>s+batchPoidsSummary(b).unknown,0);
    const totalHtml = '<div class="consult-total"><span>Total affiché</span><span>'+totalPaloxCount+' palox · '+fmt(totalKnown)+' kg'+(totalUnknown>0?' connus ('+totalUnknown+' palox sans poids)':'')+'</span></div>';
    if(batches.length===0) return emptyState(anyFilter? "Aucun résultat" : "Aucun palox enregistré", anyFilter? "Essaie d'élargir tes critères." : "Filtre par cellule, produit, calibre, lot — ou tape une recherche libre.")+totalHtml;
    const sorted = batches.slice().sort((a,b)=>(a.produit||'').localeCompare(b.produit||'','fr'));
    let rows = '';
    let i = 0;
    while(i < sorted.length){
      const produit = sorted[i].produit;
      let groupPalox = 0, groupKnown = 0, groupUnknown = 0;
      while(i < sorted.length && sorted[i].produit === produit){
        const b = sorted[i];
        const summary = batchPoidsSummary(b);
        const poidsStr = summary.total>0 ? (fmt(summary.total)+' kg'+(summary.unknown>0?' (partiel)':'')) : '—';
        rows += '<tr><td>'+escapeHtml(b.produit)+'</td><td class="mono">'+escapeHtml(b.lot||'—')+(b.lot2? ' + '+escapeHtml(b.lot2):'')+'</td>'+
          '<td>'+escapeHtml(b.parcelle||'—')+'</td><td>'+escapeHtml(b.calibre||'—')+'</td><td>'+(b.traitement?'Antigerme':'—')+'</td>'+
          '<td>'+(b.poidsSorti?'Oui':'—')+'</td>'+
          '<td class="mono">'+b.paloxs.length+'</td>'+
          '<td class="mono">'+poidsStr+'</td>'+
          '<td>'+escapeHtml(caseLabel(b.celluleId,b.ligneId))+'</td>'+
          '<td>'+escapeHtml(b.commentaire||'—')+'</td></tr>';
        groupPalox += b.paloxs.length;
        groupKnown += summary.total;
        groupUnknown += summary.unknown;
        i++;
      }
      rows += '<tr class="totals-row"><td colspan="6">Sous-total — '+escapeHtml(produit)+'</td>'+
        '<td class="mono">'+groupPalox+'</td>'+
        '<td class="mono">'+fmt(groupKnown)+' kg'+(groupUnknown>0?' ('+groupUnknown+' sans poids)':'')+'</td>'+
        '<td colspan="2"></td></tr>';
    }
    return '<div class="table-scroll"><table class="data"><thead><tr><th>Produit</th><th>Lot</th><th>Parcelle</th><th>Calibre</th><th>Traitement</th><th>Poids sorti</th><th>Palox</th><th>Poids</th><th>Emplacement</th><th>Commentaire</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+totalHtml;
  }

  // ---------- STOCK GLOBAL ----------
  function globalStockGroups(byCellule){
    const map = {}, order = [];
    state.lots.forEach(l=>{
      const cell = getCellule(l.celluleId);
      const isNonAchetee = !!(cell && cell.nonAchetee);
      const key = (byCellule ? l.celluleId+'|' : (isNonAchetee?'nonachetee|':'cellules|')) + l.produit + '|' + (l.calibre||'');
      if(!map[key]){
        map[key] = { celluleId: byCellule ? l.celluleId : null, nonAchetee: isNonAchetee, produit: l.produit, calibre: l.calibre||'', count:0, poidsConnu:0, inconnu:0 };
        order.push(key);
      }
      map[key].count++;
      const tot = paloxTotalPoids(l);
      if(tot!=null) map[key].poidsConnu += tot; else map[key].inconnu++;
    });
    return order.map(k=>map[k]).sort((a,b)=>{
      if(byCellule){
        const nomA = getCellule(a.celluleId).nom, nomB = getCellule(b.celluleId).nom;
        if(nomA!==nomB) return nomA.localeCompare(nomB,'fr');
      } else if(a.nonAchetee!==b.nonAchetee){
        return a.nonAchetee ? 1 : -1;
      }
      if(a.produit!==b.produit) return a.produit.localeCompare(b.produit,'fr');
      return (a.calibre||'').localeCompare(b.calibre||'','fr');
    });
  }
  function globalStockTableHtml(groups, byCellule){
    let rows = '';
    let i = 0;
    while(i < groups.length){
      const g0 = groups[i];
      let groupPalox = 0, groupPoids = 0, groupInconnu = 0;
      while(i < groups.length && groups[i].produit===g0.produit && (!byCellule || groups[i].celluleId===g0.celluleId)){
        const g = groups[i];
        const poidsStr = g.poidsConnu>0 ? (fmt(g.poidsConnu)+' kg'+(g.inconnu>0?' (partiel)':'')) : '—';
        const celluleCell = byCellule ? '<td>'+escapeHtml(getCellule(g.celluleId).nom)+'</td>' : '';
        rows += '<tr>'+celluleCell+
          '<td><span class="produit-dot" style="background:'+colorForProduit(g.produit)+'"></span>'+escapeHtml(g.produit)+'</td>'+
          '<td>'+escapeHtml(g.calibre||'—')+'</td>'+
          '<td class="mono">'+g.count+'</td>'+
          '<td class="mono">'+poidsStr+'</td>'+
        '</tr>';
        groupPalox += g.count; groupPoids += g.poidsConnu; groupInconnu += g.inconnu;
        i++;
      }
      const celluleSubtotalCell = byCellule ? '<td></td>' : '';
      rows += '<tr class="totals-row">'+celluleSubtotalCell+'<td colspan="2">Sous-total — '+escapeHtml(g0.produit)+'</td>'+
        '<td class="mono">'+groupPalox+'</td>'+
        '<td class="mono">'+fmt(groupPoids)+' kg'+(groupInconnu>0?' ('+groupInconnu+' sans poids)':'')+'</td></tr>';
    }
    const totalCount = groups.reduce((s,g)=>s+g.count,0);
    const totalPoids = groups.reduce((s,g)=>s+g.poidsConnu,0);
    const totalInconnu = groups.reduce((s,g)=>s+g.inconnu,0);
    const celluleHead = byCellule ? '<th>Cellule</th>' : '';
    const celluleTotalCell = byCellule ? '<td></td>' : '';
    const totalsRow = '<tr class="totals-row">'+celluleTotalCell+'<td>Total</td><td></td><td class="mono">'+totalCount+'</td>'+
      '<td class="mono">'+fmt(totalPoids)+' kg'+(totalInconnu>0?' ('+totalInconnu+' sans poids)':'')+'</td></tr>';
    return '<div class="table-scroll"><table class="data"><thead><tr>'+celluleHead+'<th>Produit</th><th>Calibre</th><th>Palox</th><th>Poids</th></tr></thead><tbody>'+rows+totalsRow+'</tbody></table></div>';
  }
  function viewGlobal(){
    const groups = globalStockGroups(globalByCellule);
    const switchHtml = '<div class="view-switch">'+
